estion":"求職者常因為失業或不易找到工作而感到壓力大，此時，就業服務人員可以運用「壓力緩衝盾」(Stress Buffer Shield)協助求職者紓壓，下列哪 1 項不是屬於「壓力緩衝盾」可用的資源或方法？","options":["冥想","負向思考","找專業人員","適當運動或睡眠"]},{"id":"Q1558","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":89,"answer":[2],"multiple":false,"question":"依據何倫(Holland)人格類型分析，與傳統型(C)一致性(consistency)最低的是下列哪一種類型？","options":["研究型(I)","藝術型(A)","企業型(E)","社會型 (S)"]},{"id":"Q1559","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":90,"answer":[1],"multiple":false,"question":"面對多種職涯選擇的求助個案，A、B、C、D 等4 位就業服務人員各有不同做法，A 強調價值觀排序，B 主張興趣優先，C 強調專業技能，D 著重語言能力。請問誰的做法最能反映布朗(Brown)的價值基礎生活角色選擇論(value in life role choices)的特性？","options":["A","B","C","D"]},{"id":"Q1560","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":91,"answer":[1],"multiple":false,"question":"甲君已經有10 年的工作年資，為了實踐自己的生涯理想，決定進行生涯改變。從布朗(Brown)的價值基礎生活角色選擇論(value in life role choices)來看，對於有所規劃且決定要做生涯轉變的當事人，下列何種做法，是此1 理論取向的就業服務人員，最可能使用的輔導策略？","options":["透過角色衝突協助甲君探索生涯不滿意的原因","透過測驗，協助甲君瞭解自己興趣","透過同儕回饋，協助甲君認識自己的盲點","透過職場分析， 鼓勵甲君延後生涯轉變"]},{"id":"Q1561","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":92,"answer":[1],"multiple":false,"question":"甲君因為公司改組，遭遇生命中第1 次非計畫性的生涯轉變。如果以布朗(Brown)的價值基礎生活角色選擇論(value in life role choices)作為諮詢取向，下列何種問題，會優先處理？","options":["情緒問題","能力問題","個性問題","人際問題"]},{"id":"Q1562","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":93,"answer":[4],"multiple":false,"question":"後現代主義盛行之後，凱立(Kelly)的生涯建構理論受到職涯諮詢的重用。此1 理論提出統轄建構、從屬建構、邊緣建構、核心建構。其中 「與個人內心深層特質有關，他人不易察覺，甚至自己本身也不一定察覺的部分｣，是屬於何種建構？","options":["統轄建構","從屬建構","邊緣建構","核心建構"]},{"id":"Q1563","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":94,"answer":[1],"multiple":false,"question":"凱立(Kelly)的建構理論，包含統轄建構、從屬建構、邊緣建構、核心建構等4 種與生涯有關的建構。其中「個人對工作世界的解釋｣，是屬於何種建構？","options":["統轄建構","從屬建構","邊緣建構","核心建構"]},{"id":"Q1564","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":95,"answer":[2],"multiple":false,"question":"甲君引導處在抉擇十字路口的乙君，針對不同選項，進行不同角度的思考。若以凱立(Kelly)建構理論所提及的「審慎思考｣(circumspection)、 「取得先機、(preemption)以及「掌握選擇｣(control and choice)3 種概念來看，甲君的做法，最符合上述何種概念？","options":["取得先機","審慎思考","掌握選擇","以上皆是"]},{"id":"Q1565","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":96,"answer":[1],"multiple":false,"question":"凱立(Kelly)的建構理論主張我們每個人都有自己所期待的理想決定型態，他將這種型態命名為「精慮性的決定型態｣(elaborately decided)。下列敘述，何者最能反映此一型態的分化性與統整性？","options":["高分化與高統整","高分化與低統整","低分化與高統整","低分化與低統整"]},{"id":"Q1566","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":97,"answer":[3],"multiple":false,"question":"就業服務人員引導甲君對不同的職業進行比較，而且請甲君進行重要程度評比，試圖讓甲君從評比過程與最後結果，瞭解自己的理想與實際之間的一致性。以建構取向來看，此位就業服務人員最可能運用下列何種技術？","options":["生涯願景","生涯地圖","生涯方格","生涯想像"]},{"id":"Q1567","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":98,"answer":[1],"multiple":false,"question":"甲君對就業服務人員表示，希望自己日後可以有高薪工作，就業服務人員持續追問甲君「為何高薪是重要的？｣並繼續再問「如果真的有高薪？ 你會有何感受？你的想法是什麼？｣，如此一層層進入甲君的內心想法。 若以建構取向的生涯諮詢技術，係指下列何種技術？","options":["階梯技術","生涯反思技術","追問技術","腦力激盪技術"]},{"id":"Q1568","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":99,"answer":[3],"multiple":false,"question":"沙維卡斯(Savickas)結合後現代主義理念，發展出敘事取向的生涯諮詢概念。下列敘述何者最能符合此1 學派所強調的生涯觀點？","options":["看重個人主觀生涯，借助客觀測驗來找到符合工作世界要求的職業","看重個人客觀生涯，應用客觀測驗來協助個人修正自己的工作適應","看重個人主觀生涯，強調如何建構個人認為有意義的生涯","看重個人客觀生涯，同時採用測驗與說故事作為修正職涯的方法"]},{"id":"Q1569","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":100,"answer":[4],"multiple":false,"question":"就業諮詢常以希爾與歐布來恩(Hill& O'Brien)所提出的3 階段助人模式，協助當事人進行生涯探索。若從階段的先後順序來看，下列敘述何者正確？","options":["洞察階段--探索階段--發展行動計畫","洞察階段--發展行動計畫--探索階段","探索階段--發展行動計畫--洞察階段","探索階段--洞察階段--發展行動計畫"]},{"id":"Q1570","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":101,"answer":[4],"multiple":false,"question":"克朗伯茲(Krumboltz)在個體的生涯選擇行為中提及自我觀察推論以及世界觀推論，對於推論正確性的觀點，下列敘述何者正確？","options":["自我觀察是主觀的；世界觀推論是客觀的","自我觀察與世界觀推論都是客觀的","自我觀察是客觀的；世界觀推論是主觀的","自我觀察與世界觀推論都是主觀的"]},{"id":"Q1571","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":102,"answer":[4],"multiple":false,"question":"班都拉(Bandura)提出社會學習理論(social learning theory)，重視「自我效能｣預期。其中有一個向度強調「個人預期成功的信念是否能由某1 情境或某1 任務推論到別的情境或任務｣。此一向度是指下列何者？","options":["效度","難度","強度","推論性"]},{"id":"Q1572","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":103,"answer":[1],"multiple":false,"question":"葛雷特(Gelatt)的職業決策模式，在實際應用時包含5 個主要步驟。其內容有：A 經驗做決定的必要性同時為自己建立目標、B 蒐集資料、C 分析所蒐集的資料、D 評量並做成決定、E 瞭解價值系統在決定歷程中的重要性。若依這5 個步驟的先後順序排列，下列敘述何者正確？","options":["A-B- C-E-D","A-B-C-D-E","B-C-E-A-D","B-C-A-E-D"]},{"id":"Q1573","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":104,"answer":[4],"multiple":false,"question":"甲君就讀小學，並不清楚自己喜歡的職業需要具備什麼能力，但幻想自己未來可以成為1 名太空人。從金茲伯(Ginzberg)的生涯發展觀點來看， 甲君所處的生涯階段，係指下列何者？","options":["萌芽階段","實現階段","試驗階段","幻想階段"]},{"id":"Q1574","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":105,"answer":[3],"multiple":false,"question":"甲君過年後就16 歲了，進入青少年前期，蛻變成一位翩翩美少女。她開始意識到自己長大以後，也要找1 份工作，並想要認識自己的興趣、能力與價值觀。從金茲伯(Ginzberg)的生涯發展觀點來看，甲君所處的生涯階段，係指下列何者？","options":["萌芽階段","實現階段","試驗階段","幻想階段"]},{"id":"Q1575","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":106,"answer":[2],"multiple":false,"question":"甲君今年20 歲，經過一段時間探索，找到自己喜歡的領域，而且已在生命科技的領域發展。從金茲伯(Ginzberg)的生涯發展觀點來看，甲君所處的生涯階段，係指下列何者？","options":["萌芽階段","實現階段","試驗階段","幻想階段"]},{"id":"Q1576","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":107,"answer":[1],"multiple":false,"question":"舒波(Super)的生涯彩虹圖，指出人生的發展歷程，可以從成長到衰退分為5 個階段。此一概念係指下列何者？","options":["生活廣度","生活空間","生命主題","多元觀點"]},{"id":"Q1577","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":108,"answer":[3],"multiple":false,"question":"甲君與乙君對自己的職涯很關心，不論在想法或態度方面，對於未來的職場環境，都有良好的因應準備度。若從舒波(Super)的觀點來看，是指下列何種概念？","options":["生涯熟悉","生涯動機","生涯成熟度","生涯幻想"]},{"id":"Q1578","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":109,"answer":[2],"multiple":false,"question":"舒波(Super)認為男性與女性的生涯發展情形不同，對於女性的生涯組型中，提及有些女性多半是在婚前有工作經驗，但在婚後即辭職料理家務，待子女成長入學後，才再度進入就業市場。此種生涯組型，係指下列何者？","options":["多軌生涯型","間斷生涯型","隨易而安型","不穩定生涯型"]},{"id":"Q1579","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":110,"answer":[4],"multiple":false,"question":"舒波(Super)認為男性與女性的生涯發展情形不同，對於女性的生涯組型中，提及有些女性因為家庭經濟的緣故，必須不定期地外出工作以貼補家用，因此在其生涯發展過程有時對家庭的投入較多，有時又以對工作的投入較多。此種生涯組型，係指下列何者？","options":["多軌生涯型","間斷生涯型","隨易而安型","不穩定生涯型"]},{"id":"Q1580","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":111,"answer":[2],"multiple":false,"question":"鐵德曼及歐哈瑞(Tiedeman& O'Hara)參考艾利克森(Erikson)與舒波 (Super)的生涯發展論，建立生涯決定發展模式，他們將生涯分為2 個階段，包括預期階段與實踐階段。其中預期階段又分為4 個次階段。此4 個次階段的順序，下列敘述何者正確？","options":["探索-澄清-選擇-具體化","探索-具體化-選擇-澄清","具體化-澄清-選擇-探索","具體化-探索-澄清-選擇"]},{"id":"Q1581","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":112,"answer":[1],"multiple":false,"question":"鐵德曼及歐哈瑞(Tiedeman& O'Hara)將生涯分為2 個階段，包括預期階段與實踐階段。其中實踐階段又分為3 個次階段。此3 個次階段的順序，下列敘述何者正確？","options":["入門--重整--統整","統整-重整-入門","重整- -入門-統整","入門--統整--重整"]},{"id":"Q1582","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":113,"answer":[2],"multiple":false,"question":"甲君與乙君二人討論自己的職業目標，甲君從原來感興趣的數10 種職業，逐漸窄化到5 種；乙君則權衡個人條件與家庭經濟，決定放棄出國進修，而以目前的打工工作，作為持續精進的職業目標。若以葛佛森 (Gottfredson)的妥協(compromise)與設限(circumscription)概念來看，下列敘述何者正確？","options":["甲君與乙君都是妥協","甲君是設限，乙君是妥協","甲君與乙君都是設限","甲君是妥協，乙君是設限"]},{"id":"Q1583","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":114,"answer":[1],"multiple":false,"question":"5 歲的甲君跟爸爸說他最想當大人，因為可以有權力決定要做什麼，很威風；就讀大學的乙君姊姊，則刪除了原本想做的外交官，而以主播工作為考量的領域。若從葛佛森(Gottfredson)的職業發展階段來看，甲君與乙君分別在下列何種階段？","options":["甲君在權力傾向階段；乙君在自我傾向階段","甲君在性別角色傾向階段；乙君在社會價值傾向階段","甲君在社會價值傾向階段；乙君在性別角色傾向階段","甲君在自我傾向階段； 乙君在權力傾向階段"]},{"id":"Q1584","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":115,"answer":[1],"multiple":false,"question":"戴維斯、英格蘭、與拉奎司特(Dawis, England, &Lofquist)提出明尼蘇達工作適應理論，其中有關工作適應的詮釋，下列敘述何者正確？","options":["包括個人內在的滿意度與外在的滿意度，即工作環境能滿足個人價值需求以及個人能滿足工作要求的客觀表現","著重個人內在的滿意度，不含外在的滿意度，即以工作環境能滿足個人價值需求為主","著重外在的滿意度，不含內在的滿意度，即以個人能滿足工作要求的客觀表現為主","只要符合個人內在的滿意度或外在滿意度其中1 項即可，也就是工作環境能滿足個人價值需求或個人能滿足工作要求的客觀表現，2 者只要有1 項達到，就算工作適應"]},{"id":"Q1585","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":116,"answer":[4],"multiple":false,"question":"甲君研究何倫(Holland)的類型論(Career Typology)，他發現在6 大類人格特質與職業環境中，實用型(R)與研究型(I)之間的相關比實用型(R)與社會型(S)之間的相關要高。此一發現，係指下列何種概念？","options":["相似性 (similarity)","適配性(fit)","連結性(connectivity)","一致性 (consistency)"]},{"id":"Q1586","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":117,"answer":[2],"multiple":false,"question":"甲君與乙君在求職前做了何倫(Holland)的職業興趣測驗，甲君在六個類型中的得分以CER 最高，在IAS 三類的分數則很低；乙君在六個類型的得分都很接近。若以何倫(Holland)的分化性(differentiation)來看，下列敘述何者正確？","options":["甲君與乙君的分化都很高","甲君的分化較高，乙君的分化較低","甲君與乙君的分化都很低","甲君的分化較低，乙君的分化較高"]},{"id":"Q1587","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":118,"answer":[4],"multiple":false,"question":"就業服務人員涉入生涯輔導最深的服務方式是哪1 項？","options":["資訊提供","工作坊","生涯課程","個別與團體諮商"]},{"id":"Q1588","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":119,"answer":[3],"multiple":false,"question":"依何倫(Holland)的職業導向6 種類型中，喜歡直覺與創新的工作是屬於哪一種類型？","options":["務實型(realistic)","研究型(investigative)","藝術型 (artistic)","社交型(social)"]},{"id":"Q1589","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":120,"answer":[2],"multiple":false,"question":"就業服務人員依照何倫的職業導向6 種類型，較偏向何種類型？","options":["務實型(realistic)與研究型(investigative)","社交型(social)與企業型 (enterprising)","研究型(investigative)與藝術型(artistic)","企業型 (enterprising)與傳統型(conventional)"]},{"id":"Q1590","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":121,"answer":[3],"multiple":false,"question":"在當代職業環境中生涯適應力日形重要，而提升生涯適應力的要素包含：真心關切自己生涯(concern)、對生涯有主控感(control)、好奇性地開展生涯(curiosity)、有信心地向前進(confidence)，此陳述最接近以下4 個理論中的哪1 個：","options":["何倫(Holland)的職業人格與工作環境理論","工作適應理論(Theory of Work Adjustment)","Savickas 的生涯建構論","Gottfredson 的框限妥協理論"]},{"id":"Q1591","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":122,"answer":[4],"multiple":false,"question":"當人們因條件所限，不得不進行妥協與犧牲某部分的自我形象時，那些愈晚形成的自我部分，就比較會被先犧牲，此陳述最接近以下4 個理論中的哪1 個：","options":["何倫(Holland)的職業人格與工作環境理論","工作適應理論(Theory of Work Adjustment)","Savickas 的生涯建構論","Gottfredson 的框限妥協理論"]},{"id":"Q1592","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":123,"answer":[1],"multiple":false,"question":"人們的人格特質與職業特徵是可以用同一種印象架構來分類，而愈能反映自我形象的工作，人們就愈滿意；因此，協助人們朝向人境契合乃是職業生涯諮詢工作的重要方式與目標，此陳述最接近以下4 個理論中的哪1 個？","options":["何倫(Holland)的職業人格與工作環境理論","工作適應理論 (Theory of Work Adjustment)","Savickas 的生涯建構論","Gottfredson 的框限妥協理論"]},{"id":"Q1593","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":124,"answer":[4],"multiple":false,"question":"一般而言，冰山模式將職能分為行為、知識、技能、動機、特質等層面，生涯與職業測驗中以工作適應理論(Theory of Work Adjustment)為依據所編製的工作價值觀測驗，大抵是在測量冰山模式的哪1 層？","options":["行為","知識","技能","動機與特質"]},{"id":"Q1594","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":125,"answer":[1],"multiple":false,"question":"特別強調生涯諮商關係是雙方面的相互尊重，以促使當事人更加了解自己，從而採取自己能夠接受的步驟之人本學派學者","options":["C. Rogers","G. W. Peterson","H. Williamson","G. Corey"]},{"id":"Q1595","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":126,"answer":[3],"multiple":false,"question":"1 種「概念架構」或「意識形態」，可提供研究生涯重要問題的理論與方法，是為生涯的","options":["模型","信仰","範典","觀念"]},{"id":"Q1596","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":127,"answer":[2],"multiple":false,"question":"美國輔導先驅Frank Parsons 所做的輔導就是","options":["生活輔導","就業服務","創傷輔導","休閒輔導"]},{"id":"Q1597","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":128,"answer":[2],"multiple":false,"question":"生涯發展是一生當中連續不斷的過程，意指生涯的","options":["方向性","時間性","空間性","現象性"]},{"id":"Q1598","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":129,"answer":[4],"multiple":false,"question":"舒伯(Super)將女性生涯發展型態分為7 類，其中婦女婚後繼續工作並兼顧家庭照顧之責的生涯型態是","options":["穩定家庭照顧型","傳統婦女型","穩定工作型","雙生涯工作型"]},{"id":"Q1599","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":130,"answer":[1],"multiple":false,"question":"羅安(Ann Roe)的生涯選擇人格論，強調家庭經驗對日後職業選擇行為具有重要影響力。所謂家庭經驗，係指個體在下列哪1 個時期的經驗？","options":["童年早期經驗","少年時期經驗","青年時期經驗","壯年時期經驗"]},{"id":"Q1600","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":131,"answer":[2],"multiple":false,"question":"為了強化產學連結，A 企業提供生涯影子(career shadowing)方案，安排學生跟隨公司特定工作者，以瞭解其工作角色與工作內容。試問此種認識職業的做法，屬於下列何種類別？","options":["角色扮演","直接觀察","直接工作","課堂教學"]},{"id":"Q1601","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":132,"answer":[3],"multiple":false,"question":"甲君一看到數字計算就深痛惡絕，但卻廢寢忘食、樂此不疲地鑽研各種理論模型。何倫(Holland)興趣類型論的哪個概念最能描述出甲君的「好惡分明」傾向？","options":["人格類型","一致性","分化性","職業認同"]},{"id":"Q1602","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":133,"answer":[1],"multiple":false,"question":"甲君、乙君、丙君是同班同學，最近3 人大學畢業而且一起參與工作面談，甲君強調工作倫理與專業精神，丙君強調溝通協調技能與衝突化解能力，乙君強調環境知識的學習與創新。請問若從勞動部勞動力發展署 「全民共通核心職能(3Cs)」來看，下列敘述何者正確？","options":["甲君傾向動機職能、乙君傾向知識職能、丙君傾向行為職能","甲君傾向行為職能、 乙君傾向動機職能、丙君傾向知識職能","甲君傾向知識職能、乙君傾向行為職能、丙君傾向動機職能","甲君、乙君、丙君三人都傾向行為職能"]},{"id":"Q1603","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":134,"answer":[3],"multiple":false,"question":"根據斯溫(Swain)的生涯金三角模式，生涯輔導的重要目的是協助求職者做出什麼決定？","options":["自我探索","環境探索","生涯目標","生涯規劃"]},{"id":"Q1604","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":135,"answer":[3],"multiple":false,"question":"面對生涯選擇，每個人的決定狀態不同。甲君處在生涯未決定狀態，而且有明顯的焦慮現象。若從職涯輔導的對象來看，甲君最可能是下列何種對象？","options":["生涯已決定者","生涯未決定者","生涯猶豫者","生涯適應不良者"]},{"id":"Q1605","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":136,"answer":[4],"multiple":false,"question":"增進自我知識是職涯輔導的重要策略之一。有許多職涯輔導工作者，會協助當事人回溯過去生涯事件，重新體驗自己對自己的看法。下列何者是Super 對此作法的用語？","options":["生涯經驗(career experiences)","生涯亮點 (career spotlight)","生涯心事(career mind)","生涯自傳(career autobiography)"]},{"id":"Q1606","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":137,"answer":[2],"multiple":false,"question":"甲君對於自己所從事的數據分析工作充滿愉悅感，相當專心與投入，甚至會忘了吃飯，不知覺的時間就這樣過去。下列何種職涯諮商心理學用語，最能詮釋這樣的情境？","options":["自在感(feel at ease)","心流體驗(flow Experience)","存在感(sense of existence)","親身體驗(firsthand experience)"]},{"id":"Q1607","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":138,"answer":[2],"multiple":false,"question":"下列何者為何倫(Holland)興趣碼「A」的特性：","options":["喜歡能以井然有序的方式組織資訊的活動","喜歡具有創意的活動","喜歡領導與影響他人","喜歡鼓勵、教導與協助他人"]},{"id":"Q1608","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":139,"answer":[1],"multiple":false,"question":"下列何者為何倫(Holland)興趣碼「C」的特性：","options":["喜歡以井然有序的方式，組織資訊的活動","喜歡具有創意的活動","喜歡領導與影響他人","喜歡鼓勵、教導與協助他人"]},{"id":"Q1609","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":140,"answer":[2],"multiple":false,"question":"根據斯波坎(Spokane)的生涯輔導策略模式，自己使用資訊系統進行生涯探索、抉擇與規劃，是屬於哪一種輔導策略？","options":["資訊探索(即提供資訊)","自我導向活動(即自助活動)","個別諮商","團體諮商"]},{"id":"Q1610","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":141,"answer":[2],"multiple":false,"question":"甲君應徵新職務，他很有信心，認為自己具有成功完成此一職務的能力。若從社會認知生涯理論(social cognitive career theory)的觀點來看， 下列何種概念最能詮釋甲君的情況？","options":["結果預期","自我效能","目標選擇","任務表現"]},{"id":"Q1611","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":142,"answer":[2],"multiple":false,"question":"就業服務人員甲君，運用沙維卡斯(Savickas)的職涯諮詢5 步驟，協助乙君探討職涯。甲君做了下列協助，包括(A)傾聽乙君的職涯故事，找出其生命主題。(B)引導乙君探索自己的生涯困境與生命主題之間的關係(C) 反映與帶領乙君思考自己的生命主題。(D)協助乙君嘗試將自己的生命主題延伸到未來(E)發展與練習做決定必須具備的技巧。下列何種排序，符合職涯諮詢5 步驟的先後順序","options":["A-B-C-D-E","A-C-B-D-E","B-C-A-D-E","B-A-C-E-D"]},{"id":"Q1612","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":143,"answer":[2],"multiple":false,"question":"舒波(Super)強調每個人在所扮演的多種角色中，對各個角色所投注的時間不同，而扮演不同角色時，所感受的情緒也不同。此一概念，係指下列何者？","options":["生涯成熟(career maturity)","生涯凸顯(career salience)","生涯韌性(career resilience)","生涯滿足(career satisfaction)"]},{"id":"Q1613","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":144,"answer":[3],"multiple":false,"question":"甲君經過就業諮詢之後，對於在國內與國外就業的優、缺點有更明確的認識，而且下了決定要到國外工作。若從鐵德曼(Tiedeman)的生涯預備階段之4 個次階段來看，甲君此刻的狀態，最可能是下列哪1 個階段？","options":["探索期","具體期","選擇期","沉殿期"]},{"id":"Q1614","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":145,"answer":[1],"multiple":false,"question":"甲君以二度就業的女性為對象，帶領生涯團體。他將團體分為接觸階段、探索階段、工作階段、以及行動階段等4 個階段，並設定其中1 個階段的目標為「建立關係，強化成員彼此信任感｣。此1 階段目標，最可能在哪1 個階段出現？","options":["接觸階段","探索階段","工作階段","行動階段"]},{"id":"Q1615","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":146,"answer":[3],"multiple":false,"question":"甲君想要選擇的職業太多，感到非常困擾。就業服務人員引用Gati 的生涯決策模式，協助甲君根據喜好程度，刪除喜好度較低的選項，達到快速決定的選擇。此種生涯決定的方法，是指下列何者？","options":["因素演算法","選項反應法","因素刪除法","因素分析法"]},{"id":"Q1616","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":147,"answer":[1],"multiple":false,"question":"職業組合卡在實施時會要求當事人依直覺，將手中的卡片按照「喜歡｣、 「不喜歡｣、「不知道｣等3 大類進行歸類。其中哪一類最能反映出當事人內心的不確定、猶豫或衝突","options":["不知道","不喜歡","喜歡","3 類都會"]},{"id":"Q1617","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":148,"answer":[2],"multiple":false,"question":"何倫(Holland)的職業興趣測驗，包含：實用型(R)、研究型(I)、藝術型 (A)、社會型(S)、企業型(E)、事務型(C)6 種興趣碼。若從一致性來看， 與社會型「S」一致性最低的是下列哪一個碼？","options":["事務型(C)","實用型 (R)","研究型(I)","藝術型(A)"]},{"id":"Q1618","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":149,"answer":[1],"multiple":false,"question":"舒波(Super)認為男性與女性的生涯發展情形不同，他將女性的生涯發展分為7 大組型，其中有一組型強調女性擁有多種不同類型的工作，這些工作有些是自己的理想，有些只是謀生的方式。此種組型係指下列何者？","options":["多軌生涯型","間斷生涯型","隨易而安型","不穩定生涯型"]},{"id":"Q1619","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":150,"answer":[1,2,3],"multiple":true,"question":"下列哪3 個是職業心理測驗施測與解釋分析時，應該遵守的情況？","options":["應該謹慎確認符合規定時，方提供測驗工具給單位使用","進行測驗施測時，應該先研讀使用手冊相關注意事項","提供測驗結果，給受測者參考時，不強加建議，一定要依據結果，作職涯決定","不需參考相關資訊佐證，即可作為人員就業推介時的依據"]},{"id":"Q1620","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":151,"answer":[1,2],"multiple":true,"question":"A 公司辦理公關人才招募，特別辦理成就測驗與興趣測驗，試問這2 種測驗所要檢測的重點，下列敘述哪2 個正確？","options":["成就測驗在評量工作成效","興趣測驗在評量工作偏好","成就測驗在評量工作偏好","興趣測驗在評量工作成效"]},{"id":"Q1621","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":152,"answer":[1,2,3],"multiple":true,"question":"下列哪3 個是生涯量表與測驗之用途？","options":["生涯探索","生涯選擇","自我瞭解","同儕比較"]},{"id":"Q1622","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":153,"answer":[1,2,3],"multiple":true,"question":"常用來測量所謂「知己」的工具與方法，不外乎是主觀直覺訊息判斷與客觀科學化測驗量表2 種，下列敘述哪3 個是主觀直覺訊息判斷方式？","options":["血型","西洋星座","生肖特質","職業興趣與成就量表"]},{"id":"Q1623","s
