  return Math.max(80,Math.min(130,Math.round(v/5)*5));
}
function applyViewportScale(value, save=true){
  const v=clampScale(value);
  const s=v/100;
  document.documentElement.style.setProperty('--app-user-scale', String(s));

  // 不使用 body zoom，避免縮放後左右留白或看起來不是滿版。
  // 改為只縮放字體、按鈕、間距等 UI 尺寸，容器寬度仍固定 100vw。
  const range=document.getElementById('viewportScaleRange');
  const text=document.getElementById('viewportScaleText');
  if(range) range.value=String(v);
  if(text) text.textContent=`${v}%`;

  if(save){
    try{ localStorage.setItem(VIEW_SCALE_KEY,String(v)); }catch(e){}
  }
}
function hideViewportScalePanel(){
  const panel=document.getElementById('viewportScalePanel');
  if(panel) panel.classList.add('hide');
  if(viewportScaleHideTimer){ clearTimeout(viewportScaleHideTimer); viewportScaleHideTimer=null; }
}
function scheduleViewportScaleHide(){
  if(viewportScaleHideTimer) clearTimeout(viewportScaleHideTimer);
  viewportScaleHideTimer=setTimeout(hideViewportScalePanel,1200);
}
function initViewportScaleControl(){
  let saved=100;
  try{ saved=clampScale(localStorage.getItem(VIEW_SCALE_KEY) || 100); }catch(e){}
  applyViewportScale(saved,false);

  const panel=document.getElementById('viewportScalePanel');
  const range=document.getElementById('viewportScaleRange');
  const down=document.getElementById('scaleDownBtn');
  const up=document.getElementById('scaleUpBtn');
  const reset=document.getElementById('scaleResetBtn');
  if(!panel || !range || !down || !up || !reset) return;

  const keepOpen=(ev)=>{
    ev.stopPropagation();
    if(viewportScaleHideTimer){ clearTimeout(viewportScaleHideTimer); viewportScaleHideTimer=null; }
  };
  panel.addEventListener('pointerdown',keepOpen);
  panel.addEventListener('click',keepOpen);

  range.addEventListener('input',()=>{
    applyViewportScale(range.value,true);
  });
  range.addEventListener('change',scheduleViewportScaleHide);

  down.addEventListener('click',()=>{
    applyViewportScale(Number(range.value)-5,true);
    scheduleViewportScaleHide();
  });
  up.addEventListener('click',()=>{
    applyViewportScale(Number(range.value)+5,true);
    scheduleViewportScaleHide();
  });
  reset.addEventListener('click',()=>{
    applyViewportScale(100,true);
    scheduleViewportScaleHide();
  });

  // 若未調整，使用者點擊畫面任何其他位置時，立即隱藏。
  document.addEventListener('pointerdown',(ev)=>{
    if(!panel.contains(ev.target)) hideViewportScalePanel();
  },{capture:true});
}

function init(){
  initViewportScaleControl();
  const versionTag = $('#versionTag');
  if (versionTag) versionTag.textContent = `v${APP_VERSION}`;
  $('#totalCount').textContent = SUMMARY.total.toLocaleString('zh-TW');
  $('#singleCount').textContent = SUMMARY.singleSelect.toLocaleString('zh-TW');
  $('#multiCount').textContent = SUMMARY.multiSelect.toLocaleString('zh-TW');
  buildSectionOptions(); bindEvents(); renderStats(); renderBankList();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
}
function buildSectionOptions(){ const select=$('#sectionSelect'); if(isSupplement()){ const sections=[...new Set(SUPPLEMENT_NOTES.map(q=>q.section))]; select.innerHTML='<option value="all">全部課後補充</option>'+sections.map(s=>`<option value="${escapeHTML(s)}">${escapeHTML(s)}</option>`).join(''); } else if(isPractical()){ const exams=[...new Set(PRACTICAL_QUESTIONS.map(q=>q.exam))]; select.innerHTML='<option value="all">全部術科歷屆</option>'+exams.map(s=>`<option value="${escapeHTML(s)}">${escapeHTML(s)}</option>`).join(''); } else { const sections=[...new Set(QUESTIONS.map(q=>q.section))]; select.innerHTML='<option value="all">全部學科題庫</option>'+sections.map(s=>`<option value="${escapeHTML(s)}">${escapeHTML(shortSection(s))}</option>`).join(''); } }
function bindEvents(){
  $('#academicTab').addEventListener('click',()=>setBankType('academic')); $('#practicalTab').addEventListener('click',()=>setBankType('practical')); $('#supplementTab').addEventListener('click',()=>setBankType('supplement')); $('#listenCurrentBtn').addEventListener('click',listenCurrent); $('#autoListenBtn').addEventListener('click',toggleAutoListen); $('#homeAutoListenBtn').addEventListener('click',startAutoListenFromHome); $('#stopVoiceBtn').addEventListener('click',stopAutoListen); $('#backHomeBtn').addEventListener('click',backToHome);
  $('#startBtn').addEventListener('click', startQuiz); $('#submitBtn').addEventListener('click', submitAnswer); $('#nextBtn').addEventListener('click', nextQuestion); $('#restartBtn').addEventListener('click', showSetup);
  $('#searchBox').addEventListener('input', renderBankList); $('#sectionSelect').addEventListener('change', renderBankList);
  $('#resetWrongBtn').addEventListener('click', () => { localStorage.removeItem(STORE.wrong); renderStats(); renderBankList(); });
  $('#clearHistoryBtn').addEventListener('click', () => { localStorage.removeItem(STORE.history); renderStats(); });
  $('#exportWrongBtn').addEventListener('click', exportWrongNotes); $('#reviewWrongBtn').addEventListener('click', () => startSpecialQuiz('wrong')); $('#reviewBookmarkBtn').addEventListener('click', () => startSpecialQuiz('bookmark'));
  $('#toggleBankBtn').addEventListener('click', () => $('#bankPanel').classList.toggle('hidden'));
}
function getFilteredPool(){ const section=$('#sectionSelect').value; const keyword=normalize($('#searchBox').value); if(isSupplement()){ let pool=section==='all'?SUPPLEMENT_NOTES:SUPPLEMENT_NOTES.filter(q=>q.section===section); if(keyword) pool=pool.filter(q=>normalize(`${q.title} ${q.content} ${q.section}`).includes(keyword)); return pool; } if(isPractical()){ let pool=section==='all'?PRACTICAL_QUESTIONS:PRACTICAL_QUESTIONS.filter(q=>q.exam===section); if(keyword) pool=pool.filter(q=>normalize(`${q.exam} ${q.question} ${q.answer}`).includes(keyword)); return pool; } let pool=section==='all'?QUESTIONS:QUESTIONS.filter(q=>q.section===section); if(keyword) pool=pool.filter(q=>normalize(`${q.question} ${q.options.join(' ')} ${q.section}`).includes(keyword)); return pool; }
function startQuiz(){ stopAutoListen(); state.mode=$('#modeSelect').value; let pool=getFilteredPool(); if(!isPractical()){ if(state.mode==='wrong'){ const wrong=idSet(STORE.wrong); pool=pool.filter(q=>wrong.has(q.id)); } else if(state.mode==='bookmark'){ const bm=idSet(STORE.bookmark); pool=pool.filter(q=>bm.has(q.id)); } } if(!pool.length){ toast('目前篩選條件沒有題目。'); return; } const count=$('#countSelect').value==='all'?pool.length:Math.min(Number($('#countSelect').value),pool.length); state.pool=pool; state.quiz=state.mode==='sequential'?pool.slice(0,count):shuffle(pool).slice(0,count); state.index=0; state.score=0; state.wrongItems=[]; showView('quizView'); renderQuestion(); }
function startSpecialQuiz(type){ $('#modeSelect').value=type; startQuiz(); }
function renderQuestion(fromAuto=false){
  if(!fromAuto) stopVoice(); state.selected.clear(); state.submitted=false; const q=state.quiz[state.index];
  $('#progressBar').style.width=`${(state.index/state.quiz.length)*100}%`;
  $('#progressText').textContent=`第 ${state.index+1} / ${state.quiz.length} 題`;
  $('#feedback').className='feedback hidden';
  $('#nextBtn').classList.add('hidden');
  $('#qText').classList.remove('hidden');
  if(isSupplement()){
    $('#scoreText').textContent='';
    $('#qMeta').textContent=`課後補充｜${q.section}`;
    $('#qText').classList.add('hidden');
    $('#multiHint').textContent='此區為課後補充重點，可直接閱讀或按「聽本題＋答案」朗讀。';
    $('#bookmarkBtn').classList.add('hidden');
    const options=$('#options');
    options.innerHTML=`<div class="supplement-card"><div class="supplement-title">${escapeHTML(q.title)}</div>${escapeHTML(q.content)}</div>`;
    $('#submitBtn').classList.add('hidden');
    $('#nextBtn').textContent=state.index===state.quiz.length-1?'完成複習':'下一題';
    $('#nextBtn').classList.remove('hidden');
    return;
  }
  if(isPractical()){
    $('#scoreText').textContent='';
    $('#qMeta').textContent=`${q.exam}｜第 ${q.number} 大題｜術科申論／情境題`;
    $('#qText').classList.add('practical-question');
    $('#qText').textContent=q.question;
    $('#multiHint').textContent='先自行作答，再按「顯示參考答案」；若同一大題含（一）（二）（三）等小題，答案會直接接在各小題後面。語音朗讀也會採「小題 → 答案 → 下一小題」順序。';
    $('#bookmarkBtn').classList.add('hidden');
    const options=$('#options');
    options.innerHTML='<button id="revealPracticalBtn" class="primary" type="button">顯示參考答案</button><div id="practicalAnswerBox" class="practical-answer hidden"></div>';
    $('#revealPracticalBtn').addEventListener('click',()=>{
      const box=$('#practicalAnswerBox');
      box.innerHTML=practicalInterleavedHTML(q);
      box.classList.remove('hidden');
      $('#qText').classList.add('hidden');
      $('#revealPracticalBtn').classList.add('hidden');
      $('#nextBtn').textContent=state.index===state.quiz.length-1?'完成複習':'下一題';
      $('#nextBtn').classList.remove('hidden');
    });
    $('#submitBtn').classList.add('hidden');
    return;
  }
  $('#qText').classList.remove('practical-question');
  $('#scoreText').textContent=`目前 ${state.score} 分`;
  $('#qMeta').textContent=`${shortSection(q.section)}｜原題號 ${q.number}｜${q.multiple?'複選':'單選'}`;
  $('#qText').textContent=q.question;
  $('#multiHint').textContent=q.multiple?`本題為複選題，選滿 ${q.answer.length} 個答案後會立即判定。`:'點選答案後會立即判定。';
  const bm=idSet(STORE.bookmark); $('#bookmarkBtn').classList.remove('hidden'); $('#bookmarkBtn').textContent=bm.has(q.id)?'★ 已收藏':'☆ 收藏'; $('#bookmarkBtn').onclick=()=>toggleBookmark(q.id);
  const options=$('#options'); options.innerHTML=q.options.map((opt,idx)=>{ const n=idx+1; const img=q.optionImages&&q.optionImages[idx]?`<img class="option-img" alt="選項 ${n} 圖示" src="${q.optionImages[idx]}">`:''; return `<button class="option" type="button" data-n="${n}"><span class="option-mark">${q.multiple?'□':'○'}</span><span class="option-label">${n}</span><span class="option-content">${img}<span>${escapeHTML(opt)}</span></span></button>`; }).join('');
  $$('#options .option').forEach(btn=>btn.addEventListener('click',()=>chooseOption(Number(btn.dataset.n))));
  $('#submitBtn').disabled=false; $('#submitBtn').classList.add('hidden');
}
function chooseOption(n){ if(state.submitted) return; const q=state.quiz[state.index]; if(q.multiple){ state.selected.has(n)?state.selected.delete(n):state.selected.add(n); } else { state.selected.clear(); state.selected.add(n); } $$('#options .option').forEach(btn=>{ const v=Number(btn.dataset.n); const active=state.selected.has(v); btn.classList.toggle('selected',active); btn.querySelector('.option-mark').textContent=q.multiple?(active?'☑':'□'):(active?'●':'○'); }); if(!q.multiple || state.selected.size===q.answer.length){ window.setTimeout(submitAnswer, 120); } }
function submitAnswer(){ if(state.submitted || !state.selected.size) return; const q=state.quiz[state.index]; const correct=sameAnswer(state.selected,q.answer); state.submitted=true; $('#submitBtn').disabled=true; $('#submitBtn').classList.add('hidden'); if(correct) state.score+=1; else { recordWrong(q.id); state.wrongItems.push({q,selected:[...state.selected]}); } $$('#options .option').forEach(btn=>{ const n=Number(btn.dataset.n); btn.classList.remove('selected'); btn.classList.toggle('correct',q.answer.includes(n)); btn.classList.toggle('wrong',state.selected.has(n)&&!q.answer.includes(n)); btn.querySelector('.option-mark').textContent=q.answer.includes(n)?'✓':(state.selected.has(n)?'✕':(q.multiple?'□':'○')); btn.disabled=true; }); $('#scoreText').textContent=`目前 ${state.score} 分`; const fb=$('#feedback'); fb.className=`feedback ${correct?'good':'bad'}`; fb.innerHTML=correct?`<strong>答對了。</strong><br>正確答案：${escapeHTML(answerText(q))}`:`<strong>答錯了。</strong><br>紅色為你的錯誤選項；綠色為正確答案。<br>正確答案：${escapeHTML(answerText(q))}`; $('#nextBtn').textContent=state.index===state.quiz.length-1?'看結果':'下一題'; $('#nextBtn').classList.remove('hidden'); }
function nextQuestion(){ stopAutoListen(); if(state.index<state.quiz.length-1){ state.index+=1; renderQuestion(); } else { if(isPractical() || isSupplement()) showSetup(); else finishQuiz(); } }
function finishQuiz(){ $('#progressBar').style.width='100%'; const total=state.quiz.length; const acc=Math.round((state.score/total)*100); $('#resultScore').textContent=`${state.score} / ${total}`; $('#resultAcc').textContent=`${acc}%`; $('#resultNote').textContent=state.wrongItems.length?`本次錯 ${state.wrongItems.length} 題，已自動加入錯題複習。`:'本次全部答對。'; writeHistory(total,state.score); renderWrongList(); renderStats(); showView('resultView'); }
function recordWrong(id){ const wrong=idSet(STORE.wrong); wrong.add(id); saveIdSet(STORE.wrong, wrong); }
function toggleBookmark(id){ const bm=idSet(STORE.bookmark); bm.has(id)?bm.delete(id):bm.add(id); saveIdSet(STORE.bookmark,bm); $('#bookmarkBtn').textContent=bm.has(id)?'★ 已收藏':'☆ 收藏'; renderStats(); }
function writeHistory(total,score){ const h=readJSON(STORE.history,[]); h.unshift({time:new Date().toISOString(),total,score}); writeJSON(STORE.history,h.slice(0,30)); }
function renderStats(){ const wrong=idSet(STORE.wrong); const bm=idSet(STORE.bookmark); const history=readJSON(STORE.history,[]); $('#wrongCount').textContent=wrong.size.toLocaleString('zh-TW'); $('#bookmarkCount').textContent=bm.size.toLocaleString('zh-TW'); $('#historyCount').textContent=history.length.toLocaleString('zh-TW'); $('#lastScore').textContent=history[0]?`${history[0].score}/${history[0].total}`:'尚無'; }
function renderWrongList(){ const wrap=$('#wrongList'); if(!state.wrongItems.length){ wrap.innerHTML='<p class="muted">沒有錯題。</p>'; return; } wrap.innerHTML=state.wrongItems.map(({q,selected},idx)=>`<details class="wrong-card"><summary>${idx+1}. ${escapeHTML(q.question)}</summary><p class="muted">${escapeHTML(shortSection(q.section))}｜原題號 ${q.number}</p><p>你選：${selected.sort().join('、')}｜正確：${escapeHTML(answerText(q))}</p></details>`).join(''); }
function renderBankList(){ const filtered=getFilteredPool(); const pool=filtered.slice(0,80); $('#bankCount').textContent=`${filtered.length} ${isPractical()?'大題':(isSupplement()?'主題':'題')}${filtered.length>80?'，先顯示前 80 題':''}`; if(isSupplement()){ $('#bankList').innerHTML=pool.map((q,i)=>`<details class="bank-item"><summary>${escapeHTML(q.section)}｜${escapeHTML(q.title)}</summary><div class="supplement-card">${escapeHTML(q.content)}</div><button class="listen-btn bank-listen" type="button" data-i="${i}">🔊 聽這個主題</button></details>`).join(''); $$('.bank-listen').forEach(b=>b.addEventListener('click',()=>speakText(supplementSpeakText(pool[Number(b.dataset.i)])))); } else if(isPractical()){ $('#bankList').innerHTML=pool.map((q,i)=>`<details class="bank-item"><summary>${escapeHTML(q.exam)}｜第 ${q.number} 大題</summary><div class="practical-answer">${practicalInterleavedHTML(q)}</div><button class="listen-btn bank-listen" type="button" data-i="${i}">🔊 聽本題＋答案</button></details>`).join(''); $$('.bank-listen').forEach(b=>b.addEventListener('click',()=>speakText(practicalSpeakText(pool[Number(b.dataset.i)])))); } else { $('#bankList').innerHTML=pool.map((q,i)=>`<details class="bank-item"><summary>${escapeHTML(shortSection(q.section))} #${q.number}｜${escapeHTML(q.question)}</summary><ol>${q.options.map((o,j)=>`<li>${q.optionImages&&q.optionImages[j]?`<img class="mini-img" src="${q.optionImages[j]}" alt="選項${j+1}">`:''}${escapeHTML(o)}</li>`).join('')}</ol><p class="muted">答案：${escapeHTML(answerText(q))}</p><button class="listen-btn bank-listen" type="button" data-i="${i}">🔊 聽本題＋答案</button></details>`).join(''); $$('.bank-listen').forEach(b=>b.addEventListener('click',()=>speakText(academicSpeakText(pool[Number(b.dataset.i)])))); } }
function exportWrongNotes(){ const wrong=idSet(STORE.wrong); const list=QUESTIONS.filter(q=>wrong.has(q.id)); if(!list.length){ toast('目前沒有錯題可匯出。'); return; } const text=list.map((q,i)=>`${i+1}. [${shortSection(q.section)} #${q.number}] ${q.question}\n${q.options.map((o,idx)=>`  ${idx+1}. ${o}`).join('\n')}\n答案：${answerText(q)}\n`).join('\n'); const blob=new Blob([text],{type:'text/plain;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='就業服務乙級_錯題筆記.txt'; a.click(); URL.revokeObjectURL(url); }
function showSetup(){ stopAutoListen(); showView('setupView'); renderStats(); renderBankList(); }
function showView(id){ ['setupView','quizView','resultView'].forEach(v=>$('#'+v).classList.toggle('hidden',v!==id)); document.body.classList.toggle('quiz-active',id==='quizView'); document.body.classList.toggle('result-active',id==='resultView'); document.body.classList.toggle('focus-mode',id==='quizView'||id==='resultView'); window.scrollTo({top:0,behavior:'smooth'}); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1700); }
function escapeHTML(s){ return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
document.addEventListener('DOMContentLoaded', init);

</script></body></html>
