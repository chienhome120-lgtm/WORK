":"皮亞傑(Piaget)的認知發展論應用在職涯諮詢時，特別強調生涯是一個學習的過程，通常會經歷3 個重要階段，是指下列哪3 個階段？","options":["同化","調適","進步","平衡"]},{"id":"Q1660","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":191,"answer":[1,2,3],"multiple":true,"question":"為了減低當事人的防衛，瞭解其內在經驗。幻想技術自1950 年代之後即被運用在職業輔導。其使用步驟，包括下列哪3 個？","options":["放鬆","幻遊","經驗分享","改變想法"]},{"id":"Q1661","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":192,"answer":[1,3,4],"multiple":true,"question":"後現代主義反對現代化主義所追求的普遍與客觀理性。有許多職涯輔導人員應用後現代的觀點協助當事人進行職涯探索。下列敘述，有哪3 個是後現代主義的特徵？","options":["「不確定性」","「驗證性｣","「多元性」","「去中心性」"]},{"id":"Q1662","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目03：職涯諮詢輔導","number":193,"answer":[1,2,3],"multiple":true,"question":"面對生涯阻礙，如果能找到因應或調適的方法，就能對生涯發展帶來前進動力。下列敘述，有哪3 種方法具有正向影響？","options":["在工作中建立良好人際關係","採取適當的抒壓方式","培養增能習慣","自我傷害"]}];
const PRACTICAL_QUESTIONS = [{"id":"P001","exam":"115年度第2梯次","number":1,"question":"一、請依私立就業服務機構許可及管理辦法，回答下列問題：\n  （一）私立就業服務機構許可證有效期限為幾年？（2 分）有效期限屆滿前幾日\n       內，應備申請書等相關文件重新申請設立許可及換發許可證？（2 分）\n  （二）私立就業服務機構之就業服務專業人員異動時，應自異動之日起幾日內，\n       檢附異動申請表等文件報請原許可機關備查？（2 分）\n  （三）私立就業服務機構暫停營業一個月以上者，應於停止營業之日起幾日內，\n       向原許可機關申報備查？（2 分）前項停業期間最長不得超過幾年？（2\n       分）","answer":"（一）2年；有效期限屆滿前30日內。\n（二）異動之日起30日內。\n（三）停止營業之日起15日內申報；停業期間最長1年。"},{"id":"P002","exam":"115年度第2梯次","number":2,"question":"二、請依就業保險法及就業保險法施行細則規定，回答下列問題：（每題 2 分，共 10\n  分）\n  （一）下列何者可由雇主申報參加就業保險？\n       1、從事機構看護工作之外國人。\n       2、從事製造技術工作之外國人。\n       3、從事服務業工作之本國籍高齡者。\n       4、加入職業工會之無一定雇主勞工。\n       5、以上皆不可參加。\n  （二）依就業保險法相關規定，取得永久居留許可之外國專業人才，是否得參加\n       就業保險？\n       1、不得參加。\n       2、僅能自願參加。\n       3、可依法參加。\n       4、僅限政府機關聘僱者可參加。\n  （三）下列何者非就業保險給付的種類？\n     1、失業給付。\n     2、提早就業獎助津貼。\n     3、育嬰留職停薪津貼。\n     4、求職交通津貼。\n  （四）被保險人依就業保險法請領失業給付，下列敘述之請領條件何者正確？\n     1、被保險人於非自願離職辦理退保 3 年內，保險年資須合計滿 2 年以\n       上。\n     2、被保險人應向公立就業服務機構辦理求職登記，且須自求職登記之日\n       起 7 日內仍無法推介就業或安排職業訓練。\n     3、被保險人因定期契約屆滿離職，須逾 3 個月未能就業。\n     4、被保險人因定期契約屆滿離職，須逾 1 個月未能就業，且離職前 1 年\n       內，契約期間合計滿 6 個月以上者，始得視為非自願離職。\n  （五）請領就業保險給付請求權，自得請領之日起，因幾年間不行使而消滅？\n      1、1 年\n      2、2 年\n      3、3 年\n      4、5 年","answer":"（一）5。\n（二）3。\n（三）4（求職交通津貼不是就業保險法第10條所列保險給付）。\n（四）4。\n（五）2年。"},{"id":"P003","exam":"115年度第2梯次","number":3,"question":"三、依性別平等工作法第 13 條規定，雇主應採取適當之措施，防治性騷擾之發生，並\n  依相關規定辦理相關事宜，請回答下列問題：\n  （一）僱用受僱者在幾人（2 分）以上、未達幾人（2 分）之雇主，應訂定申訴管\n     道，並在工作場所公開揭示。（共 4 分）\n  （二）僱用受僱者在幾人（2 分）以上之雇主，應訂定性騷擾防治措施、申訴及懲\n     戒規範，並在工作場所公開揭示。\n  （三）雇主因接獲被害人申訴而知悉性騷擾之情形時，應採取立即有效之糾正及\n     補救措施為何？（4 分）","answer":"（一）10人以上、未達30人。\n（二）30人以上。\n（三）接獲被害人申訴而知悉時：1.採行避免申訴人再受性騷擾之措施；2.提供或轉介諮詢、醫療或心理諮商、社會福利資源及其他必要服務；3.進行調查；4.對行為人為適當懲戒或處理。"},{"id":"P004","exam":"115年度第2梯次","number":4,"question":"四、考量勞工對於家庭成員之臨時照顧需求，並使勞工得以兼顧工作與家庭平衡；另\n  為保障勞工健康權，避免勞工在身體不舒服需要休養或治療時，因爲雇主規範請\n  病假衍生的不利益對待，造成勞工不敢請病假，勞動部在 114 年修正「勞工請假\n  規則」，並自 115 年 1 月起施行，請依該規定回答下列問題（每空格 2 分，共 10\n  分）\n  （一）勞工因有事故必須親自處理，得請事假，一年內合計不得超過 （1） 日。\n       事假期間不給工資。勞工為親自照顧家庭成員，除本法或其他法律另有規\n       定者外，得依前項規定請事假，並得擇定以 （2） 為請假單位。\n  （二）勞工有下列情形，雇主不得視為缺勤而影響其全勤獎金；其他法律另有規\n       定者，從其規定：\n       1.勞工請婚假、喪假、公傷病假及公假。\n       2.勞工因妊娠未滿 （3） 個月流產未請產假，而請普通傷病假。\n       3.勞工因親自照顧家庭成員，依第七條規定請事假。\n  （三）勞工申請前述（二）第 2 點以外之普通傷病假，其全勤奬金之扣發，應按\n       請普通傷病假日數依 （4） 計算。但勞雇雙方另有優於法令之約定者，從\n       其約定。\n  （四）勞工一年內請普通傷病假日數未超過 （5） 日者，除本規則或其他法律另\n       有規定，從其規定者外，雇主不得因勞工請普通傷病假而為不利之處分。","answer":"（1）14日。\n（2）小時。\n（3）3個月。\n（4）比例。\n（5）10日。"},{"id":"P005","exam":"115年度第2梯次","number":5,"question":"五、甲君受僱於員工總人數 30 人之雇主 A 公司，擔任工程師工作，並由 A 公司申報\n  參加勞工保險及勞工職業災害保險，且依勞工退休金條例規定按月提繳勞工退休\n  金；又甲君受僱於 A 公司之工作年資，迄 115 年 5 月合計 15 年，請依上開相關規\n  定回答下列問題：\n  （一）甲君為勞工保險條例第 6 條第 1 項第 2 款之被保險人，依同條例第 15 條規\n       定，其普通事故保險費由甲君負擔多少％？（1 分）投保單位 A 公司負擔\n       多少％？（1 分）（共 2 分）\n  （二）依勞工保險條例第 17 條規定，A 公司對應繳納之 115 年 5 月份保險費，如\n     未依規定限期繳納時，得寬限幾日？（1 分）如 A 公司在寬限期間仍未向\n     勞動部勞工保險局繳納，自寬限期滿之翌日起至完納前一日止，每逾 1 日\n     加徵其應納費額多少％之滯納金？（1 分）又加徵之滯納金額，以至應納費\n     額之多少％為限？（1 分）（共 3 分）\n  （三）依勞工職業災害保險及保護法第 21 條規定，A 公司對應繳納之勞工職業災\n     害保險費，未依規定限期繳納，得寬限幾日？（1 分）如 A 公司在寬限期\n     間仍未向勞動部勞工保險局繳納，自寬限期滿之翌日起至完納前一日止，\n     每逾 1 日加徵其應納費額多少％之滯納金？（1 分）（共 2 分）\n  （四）依勞工退休金條例第 21 條規定，A 公司應置備僱用甲君之勞工名冊，其內\n     容包括勞工到職、離職、出勤工作紀錄、工資、每月提繳紀錄及相關資\n     料，並保存至甲君離職之日起幾年止？（2 分）\n  （五）依勞工退休金條例第 31 條規定，A 公司未依規定按月提繳或足額提繳勞工\n     退休金，致甲君受有損害，其得向 A 公司請求損害賠償；又甲君損害賠償\n     請求權，自其離職時起，因幾年間不行使而消滅？（1 分）","answer":"（一）勞工20%；投保單位70%。\n（二）寬限15日；每逾1日加徵0.1%；滯納金上限為應納費額20%。\n（三）寬限15日；每逾1日加徵0.2%。\n（四）離職之日起5年。\n（五）離職時起5年。"},{"id":"P006","exam":"115年度第2梯次","number":6,"question":"六、（一）下表為行政院主計總處公布 111 年至 113 年工業及服務業受僱勞工年平均薪\n     資結構（單位：新臺幣／元）\n     年度 全年經常性薪資         全年加班費         全年其他非經常性薪資\n     111   530,520      23,916        142,068\n     112   542,364      25,044        133,632\n     113   557,400      27,384        147,240\n    （1）請問 113 年全年總薪資較 111 年全年總薪資增加多少元？（2 分）\n    （2）請問 113 年全年其他非經常性薪資占全年總薪資之占比，相較 112 年全\n       年其他非經常性薪資占全年總薪資占比，其增減占比為多少？（四捨五\n       入，計算至小數點第 2 位，2 分）\n（二）A 公司每月準備一筆業績獎金，並依照員工達到工作目標的程度發放不同\n   金額的獎金，請問該業績獎金在行政院主計總處薪資調查之薪資分類上應\n   歸類為經常性薪資、加班費或其他非經常性薪資的哪一種？（2 分）\n（三）請依勞動部 113 年中高齡及高齡勞動統計結果，回答下列問題：\n （1）依下表 1，請問男性 113 年失業週數相較 112 年失業週數，增減週數為多\n    少？（1 分）哪一個年齡層 113 年失業週數相較 112 年失業週數是呈現縮\n    減？（1 分）\n （2）依下表 2，請問男性中高齡及高齡非勞動力無就業意願主要原因為何？\n    （1 分）50-54 歲中高齡及高齡非勞動力無就業意願主要原因為何？（1\n    分）","answer":"（一）1. 35,520元。2. 113年相較111年之全年總薪資增加35,520元；其他非經常性薪資占比：113年約20.12%，112年約19.06%，增加約1.05個百分點（依題目四捨五入規則計算）。\n（二）經常性薪資。\n（三）1. 男性增加0.92週；45～49歲為縮減。2. 男性主要原因為「年紀較大（含退休，須達50歲）」；50～54歲主要原因為「做家事」。"},{"id":"P007","exam":"115年度第2梯次","number":7,"question":"七、非暴力溝通（Nonviolent Communication, NVC）由心理學家馬歇爾·盧森堡\n  （Marshall Rosenberg）博士提出，旨在透過轉變談話和聆聽的方式，培育彼此的\n  尊重、關注與同理心，進而建立高品質的連結。其核心包含四個要素：\n   A、觀察（Observation）：客觀描述看見或聽見的事實，不夾帶評論或判斷。\n   B、感受（Feeling）：清楚表達自己或他人內心的情緒狀態，而非對他人行為的詮\n      釋或想法。\n   C、需要（Need）：釐清自己或他人感受（情緒）背後的核心價值、渴望或期待。\n   D、請求（Request）：提出具體、正向、可執行的行動要求，而非命令或模糊的\n      期待。\n  請根據上述 NVC 四步驟（觀察、感受、需要、請求），針對下列 5 題分別選出最\n  適合的答案。\n       （每題 2 分，共 10 分）\n  （一）業務主管正在跟甲君檢討「出勤狀況」，這位主管希望運用非暴力溝通中的\n       「觀察」技巧，客觀陳述事實，避免引發對方的防衛心。下列何者陳述最\n       為正確？\n      （1）你最近跑客戶跑得不是很勤勞，心態有點鬆懈。\n      （2）我看了一下報表，你這個月的業績數字下滑了。\n      （3）你上個月只有拜訪 15 位客戶，比規定的 20 位少了 5 位。\n      （4）你對於開發新客戶這件事，似乎缺乏足夠的企圖心。\n  （二）專案經理發現設計師乙君未經討論就改掉了原本的設計稿，根據非暴力溝\n       通。下列哪一句最能表達專案經理的「感受」？\n      （1）我覺得你很不尊重我的專業，擅自做主。\n      （2）我覺得被你擺了一道，這是不負責任的行為。\n      （3）我覺得這張設計圖被改得很糟糕。\n      （4）我感到十分焦慮與困惑，因為我不確定變更的原因。\n  （三）同事想把一部分原本屬於他的工作塞給你做，你決定拒絕。下列哪一句話\n       最能說明你拒絕的原因及你的「需要」而不是在指責對方？\n      （1）我不能接，因為我希望維持主管分配給我們的工作內容。\n      （2）你太過分了，這明明是你的工作，為什麼總是要丟給我？\n      （3）我真的覺得很煩，你能不能學會自己的事情自己做？\n      （4）除非老闆親自下令，否則我不想幫你收爛攤子。\n  （四）會議時大家的意見很發散，很難對焦，你想對會議主席提出一個「請求」\n     來改善問題。下列何者最符合「請求」的「具體可行」要素？\n     （1）主席，希望你以後開會能夠更有效率一點。\n     （2）主席，能不能請你不要再讓大家浪費時間了？\n     （3）主席，能否請承辦人在下次會議前，先寄出議程給所有人？\n     （4）主席，我希望大家開會的時候都能專心，不要滑手機。\n  （五）客服人員接到一通憤怒的電話：「我等了三天都沒人回覆！你們公司到底在\n     搞什麼！」。下列哪一句回應最能「同理」客戶憤怒背後的「需要」？\n     （1）請您先息怒，目前客服人手不足，請體諒我們的難處。\n     （2）我聽出您很急，因為您很重視問題能否被在乎與即時獲得回應。\n     （3）這不是我的錯，是工程部還沒處理完，您應該怪他們而不是罵我。\n     （4）若您對服務不滿，建議去官網填寫意見表，屆時將會有專人處理。","answer":"（一）3。\n（二）4。\n（三）1。\n（四）3。\n（五）2。"},{"id":"P008","exam":"115年度第2梯次","number":8,"question":"八、依據「私立就業服務機構許可及管理辦法」第 12 條第 1 項規定：私立就業服務機\n  構及其分支機構之設立，應申請許可。據此，下列各組織根據其服務內容，是否\n  應申請私立就業服務機構設立許可？如應設立，請寫「是」，並寫出向哪個機關申\n  請始給分；如無須設立，請寫「否」。（10 分，每小題 2 分）\n  （一）臺中市 A 工業區廠商協會接受勞動部勞動力發展署中彰投分署補助設立了\n     「臺中產業園區就業服務臺」，提供求職求才媒合服務。\n  （二）公司登記設立於臺北市，從事呼吸照護儀器與耗材的銷售，並提供醫院、\n     診所、居家護理所等呼吸治療師、護理師職缺的媒合服務。\n  （三）嘉義縣民雄鄉內 C 家教仲介機構，為兩所國立大學學生與附近家長媒合家\n     教機會。\n  （四）桃園市內 D 公司發行求才刊物，並設計網站提供求才與求職媒合服務。\n  （五）設立在新北市的 E 大學職涯中心在網站提供該校畢業生免費職業性向測\n     驗，也會提供廠商徵求實習生的訊息供學生參考。","answer":"（一）否。\n（二）是，向臺北市政府申請。\n（三）是，向嘉義縣政府申請。\n（四）是，向桃園市政府申請。\n（五）否。"},{"id":"P009","exam":"115年度第2梯次","number":9,"question":"九、在就業媒合實務操作中，根據結構化面試（STAR 原則），若要評估「核心職能」，\n  需要要求求職者明確描述「情境（Situation）」、「任務（Task）」、「行動（Action）」\n  與「結果（Result）」。若求職者的描述模糊，就業服務人員可應用就業媒合會談的\n  「具體化」技巧來進行提問，以獲得充分訊息來完成適切的「職能評估」。\n  求職者甲君去應徵「大型超市採購專員」時說「我負責過採購專案」，從下列就業\n  服務人員回應之中，挑出 5 個最適當且單純地只針對「核心職能」評估的目的應\n  用了「具體化」的技巧？請寫出其英文代碼。（10 分，答對一項給 2 分）\n  A、 你之前負責哪家公司的採購？後來為什麼離開那家公司？\n  B、 你所參與過的採購專案，最多有多少團隊成員？\n  C、 請說明你在那個專案中從頭到尾依序負責做哪些事。\n  D、 你喜歡你在那個專案中所擔任的角色嗎？\n  E、 在你所負責的任務中，你覺得自己最拿手的是哪部分？\n    有什麼具體例子可以說明你的這個特長呢？\n  F、 在你參與過的績效最好的採購專案中，你覺得自己對該專案績效有何貢獻？\n    有什麼具體例子可以說明你的貢獻呢？\n  G、 在你參與過的績效最好的採購專案中，你會如何評判其他團隊成員的表現？\n    你根據什麼標準做此評判？\n  H、 在你參與過的採購專案中，你覺得自己表現最好的是哪一次？\n    你當時做了什麼？你為何覺得那次表現最好？\n  I、 請用一個實際例子來說明，你通常如何做談判前的準備工作？\n    以及通常在談判過程中運用哪些談判技巧？\n  J、 回想你承擔過的各種採購任務，你最喜歡和最不喜歡的分別是哪一個？\n    為什麼？","answer":"C、E、F、H、I。"},{"id":"P010","exam":"115年度第2梯次","number":10,"question":"十、以下是幾種常見的職業心理測驗\n  A、我喜歡做的事（台灣就業通）\n  B、工作氣質測驗（台灣就業通）\n  C、工作風格測評（台灣就業通）\n  D、工作價值觀測驗（1111 大學網）\n  E、個人職場風格量表（104 測評銀行）\n  F、職場共通職能診斷（UCAN 大專院校就業職能診斷平台）\n  G、職場專業職能診斷（UCAN 大專院校就業職能診斷平台）\n  H、創業適配度測評（1111 測評中心）\n  I、 領導風格量表（104 測評銀行）\n  就業服務人員會依據求職者或轉職者的個別需求差異，提供適合的職業心理測驗\n  項目。請針對以下的求職者或轉職者需求，寫出就業服務人員「最適合」提供的\n  測驗項目。（寫出英文代碼或文字均可）\n  （一）想知道自己最重視或是最在意的工作特性。（2 分）\n  （二）想知道自己的性格特質適合什麼樣的職業。（2 分）\n  （三）目前的工作需要大量的團隊合作，想知道自己在團隊中的行事特色與扮演\n     角色。（2 分）\n  （四）剛大學畢業，想知道自己感興趣的工作是什麼。（2 分）\n  （五）剛大學畢業，想知道自己進入職場需要具備的基本能力狀況。（2 分）","answer":"（一）D 工作價值觀測驗。\n（二）B 工作氣質測驗。\n（三）E 個人職場風格量表。\n（四）A 我喜歡做的事。\n（五）F 職場共通職能診斷。"},{"id":"P011","exam":"115年度第1梯次","number":1,"question":"一、請依外國技術人力工作資格及許可管理辦法（以下簡稱外國技術人力辦法）相關\n 規定回答下列問題：\n （一）外國技術人力辦法所稱外國技術人力，指受聘僱從事就業服務法第 46 條第\n    1 項第幾款規定工作之外國人？（2 分）\n （二）外國留學生、僑生或其他華裔學生（以下簡稱畢業僑外生）必須取得我國\n    大專校院之何種以上學位，始符合受聘僱從事外國技術人力辦法所定旅宿\n    服務工作之學歷資格？（2 分）\n （三）外國技術人力除為畢業僑外生外，須取得國外大專校院之何種以上學位？\n    或於國外高級中等以上學校畢業，並經中央目的事業主管機關認定有幾年\n    以上相關工作經驗，始得由雇主於我國境外引進受聘僱從事外國技術人力\n    辦法第 5 條第 12 款及第 13 款之工作？（4 分，答對 1 個給 2 分）\n （四）雇主申請聘僱外國技術人力從事外國技術人力辦法第 5 條第 3 款、第 4\n    款、第 6 款、第 12 款及第 13 款工作，其所聘僱就業服務法第 46 條第 1 項\n    第 1 款及第 8 款至第 11 款規定工作總人數，不得超過雇主申請當月前 2 個\n    月之前 1 年僱用員工平均人數之多少％？（2 分）","answer":"（一）第11款。\n（二）副學士。\n（三）副學士；2年以上相關工作經驗。\n（四）50%。"},{"id":"P012","exam":"115年度第1梯次","number":2,"question":"二、A 君為非自願離職勞工、B 君為非自願離職勞工且扶養眷屬計 3 人（包含無工作收\n  入同為 70 歲的無工作父母親及 15 歲兒子）、C 君為中高齡失業勞工、D 君為身心\n  障礙失業勞工，上述 4 位均首次向公立就業服務機構辦理求職登記，且經公立就\n  業服務機構安排參加全日制職業訓練，參訓期間為 114 年 12 月 2 日至 115 年 7 月\n  10 日，若全程參訓，請依就業保險法及就業服務法相關規定，回答下列問題：\n  （一）A 君離職退保之當月起前六個月平均月投保薪資為新臺幣 36,000 元，請問\n      A 君依就業保險法規定，最高可領取新臺幣多少元的職業訓練生活津貼？\n      （2 分）\n  （二）B 君離職退保之當月起前六個月平均月投保薪資為新臺幣 36,000 元，請問\n      B 君依就業保險法規定，每個月最高可領取新臺幣多少元的職業訓練生活\n      津貼？（1 分）最高可領取新臺幣多少元的職業訓練生活津貼？（2 分）\n  （三）C 君依就業服務法及其子法規定，最高可領取新臺幣多少元的職業訓練生\n      活津貼？（2 分）\n  （四）D 君依就業服務法及其子法規定，最高可領取新臺幣多少元的職業訓練生\n      活津貼？（3 分）","answer":"（一）129,600元（36,000×60%×6）。\n（二）每月最高28,800元；最高172,800元（眷屬加給達20%上限，36,000×80%×6）。\n（三）以最低工資×60%計，最長6個月；因跨114/115年度，實際金額須分別套用各年度最低工資。\n（四）身心障礙者最長可發1年；依本題參訓期間按30日一個月及畸零日規則，可計7.5個月，金額＝各適用月份最低工資×60%後加總。"},{"id":"P013","exam":"115年度第1梯次","number":3,"question":"三、請依性別平等工作法、勞資爭議處理法及大量解僱勞工保護法等規定，回答\n  下列空格：（每空格 2 分，共 10 分）\n  （一）依性別平等工作法第 11 條第 2 項規定，工作規則、 （1） 或團體協約，\n      不得規定或事先約定受僱者有結婚、懷孕、分娩或育兒之情事時，應行離\n      職或留職停薪；亦不得以其為 （2） 之理由。\n  （二）依勞資爭議處理法第 53 條第 1 項規定，勞資爭議，非經 （3） 不成立，\n      不得為爭議行為； （4） 事項之勞資爭議，不得罷工。\n  （三）事業單位依大量解僱勞工保護法第 4 條規定提出解僱計畫書之日起 （5）\n      日內，勞雇雙方應即本於勞資自治精神進行協商","answer":"（1）勞動契約。\n（2）解僱。\n（3）調解。\n（4）權利。\n（5）10。"},{"id":"P014","exam":"115年度第1梯次","number":4,"question":"四、為保障及促進身心障礙者就業，身心障礙者權益保障法訂有身心障礙者定額進用\n 相關規定，對一定員工人數以上的機關（構）課予進用身心障礙者的義務。請依\n 身心障礙者權益保障法規定，回答下列問題：\n （一）A 公立學校員工總人數為 32 人，依規定應進用具有就業能力之身心障礙者\n    人數至少幾人？（2 分）\n （二）民營事業機構員工總人數在幾人以上者，進用具有就業能力之身心障礙者\n    人數，不得低於員工總人數百分之一，且不得少於 1 人？（2 分）\n （三）事業機構依公司法成立關係企業之進用身心障礙者人數達員工總人數百分\n    之多少以上者，得與該事業機構合併計算身心障礙者定額進用人數？（2\n    分）\n （四）進用身心障礙者義務機關（構）未足額進用身心障礙者應繳納差額補助\n    費，其金額如何計算？（2 分）\n （五）直轄市、縣（市）勞工主管機關得核發超額進用身心障礙者之私立機構獎\n    勵金，核發之獎勵金最高金額如何計算？（2 分）","answer":"（一）0人（公立學校員工32人未達公立義務進用門檻34人）。\n（二）67人以上。\n（三）20%。\n（四）月最低工資×差額人數。\n（五）月最低工資×超額進用人數×50%。"},{"id":"P015","exam":"115年度第1梯次","number":5,"question":"五、勞工受僱在公司工作時，公司應依據相關勞動法令規定，訂定相關保障與保護勞\n 工應有的工作權益，請依勞工保險條例、勞工退休金條例等勞動法令規定，回答\n 下列問題：\n （一）依勞工保險條例規定，如果以詐欺或其他不正當行為領取保險給付或為虛\n    偽之證明、報告、陳述及申報診療費用者，除按其領取之保險給付或診療\n    費用處以幾倍罰鍰外？（2 分）並應依何法律規定請求損害賠償？（2 分）\n    及涉及刑責者，移送何機關辦理？（2 分）\n （二）依勞工退休金條例規定，勞工未滿 60 歲，領取勞工保險條例所定之失能年\n    金給付或失能給付，其工作年資滿幾年以上者，得請領月退休金或一次退\n    休金？（2 分）但工作年資未滿幾年者，應請領一次退休金？（2 分）","answer":"（一）2倍；依民法請求損害賠償；涉及刑責移送司法機關。\n（二）工作年資滿15年以上者，得請領月退休金或一次退休金；未滿15年者，應請領一次退休金。"},{"id":"P016","exam":"115年度第1梯次","number":6,"question":"六、請根據中華民國職業標準分類、行業統計分類判斷下列陳述是否正確？（每題 1\n  分，共 10 分）\n  （一）行業是指個人所擔任的工作或職務。\n  （二）行業標準分類是以經濟活動部門為分類基礎。\n  （三）工作分析（Job Analysis）是以系統性的方法蒐集、分析和記錄特定行業的\n      內容、要求、應具備的技能與條件等資訊。\n  （四）「污染整治業」是一種行業。\n  （五）「財務專業人員」是一種行業。\n  （六）職業是指企業或組織所從事的經濟活動部門。\n  （七）職業標準分類是以工作內容、技能和知識為分類基礎。\n  （八）職能分析是以系統性的方法分析完成特定工作、職業或職類所應具備的知\n      識、技能、態度或其他特質等能力組合。\n  （九）「機械設備操作及組裝人員」是一種職業。\n  （十）「木工機械設備製造業」是一種職業。","answer":"（一）X。\n（二）O。\n（三）X。\n（四）O。\n（五）X。\n（六）X。\n（七）O。\n（八）O。\n（九）O。\n（十）X。"},{"id":"P017","exam":"115年度第1梯次","number":7,"question":"七、「合理調整」（Reasonable Accommodation）是身心障礙者權利公約（The Convention\n   on the Rights of Persons with Disabilities）（CRPD）非常重要的概念，用以確保身心障\n   礙者在各領域都有同等的條件和參與機會，在職場上更是如此。\n   調整職務內容常是「合理調整」的重要方法，調整方向包括：（A）工時、（B）工\n   作規定、（C）工作流程、（D）職務分工或（E）重新安排職務等。\n   請根據下列（一）至（五）題所描述之內容，寫出各子題內容的英文代碼或文\n   字。（每題 2 分，共 10 分）\n   （一）藉由彈性變動工作地點、工作會議或考核評量標準等，讓身心障礙員工完\n        成工作任務。\n   （二）聽障員工和雇主協調後，把接聽電話的工作改由其他同事辦理，聽障員工\n        則分擔同事的書寫及資料彙整等工作。\n   （三）一位患有慢性精神疾患的員工，因服藥產生疲勞的副作用，而難以準時上\n        班，經和雇主協商後得延後上班。\n   （四）員工原為外勤業務員，因自身疾病導致視覺障礙，不再適合外勤業務，經\n        和雇主協調後，他的工作轉為內勤支援。\n   （五）視障員工的工作內容，主要是邀請顧客到官方粉專進行服務評價，公司特\n        別做出調整，在文件 QR Code 處增加點字標示及語音導引，讓視障員工完\n        成工作任務。","answer":"（一）B 工作規定。\n（二）D 職務分工。\n（三）A 工時。\n（四）E 重新安排職務。\n（五）C 工作流程。"},{"id":"P018","exam":"115年度第1梯次","number":8,"question":"八、阿哲（化名）23 歲，住臺北市，大學畢業後待業 8 個月，平常喜歡在家上網，期\n  間從未有工作經驗。\n  阿哲不確定未來職涯方向，不知道自己適合從事何種類型工作，曾嘗試投遞履\n  歷，但幾乎都未獲回應，逐漸喪失求職信心。父母也頻頻詢問其求職狀況，希望\n  阿哲能儘早工作，協助家裡紓緩經濟壓力。\n  阿哲心理的壓力越來越大，持續有失眠、吃不下東西、易怒的情形，朋友聚會也\n  不想出席，甚至對與人日常互動感到害怕……\n  阿哲經朋友分享，知道可到公立就業服務機構尋求協助，今天阿哲來到公立就業\n  服務機構，你是阿哲的就業服務人員，請回答下列問題：（每題 2 分，共 10 分）\n  （一）依前述對於阿哲求職過程的描述，下述哪一項明顯不是阿哲在求職時遇到\n     的就業障礙問題？（單選）\n     1.就業意願低落問題\n     2.職涯迷惘問題\n     3.心理健康問題\n     4.履歷撰寫技巧尚不足\n  （二）為了要協助阿哲釐清職涯方向，你評估阿哲需要一對一的職涯諮詢及履歷\n     診斷服務，且同時考慮資源可近性及青年的特性，除了你提供的服務外，\n     也會優先推薦阿哲應用哪一個政府資源？（單選）\n     1.中彰投分署青年職涯發展中心\n     2.台灣就業通「Youth 職涯諮詢」平台\n     3.Y17 臺北市青少年育樂中心\n     4.臺北市政府衛生局社區心理衛生中心\n  （三）你評估阿哲的失眠等心理健康問題，同時需要資源介入，阿哲也有意願進\n     行心理諮商，但擔心要負擔高額的費用，這時你知道衛生福利部為促進青\n     壯世代心理健康，協助調適心理壓力與負面情緒，從 113 年推動「青壯世\n     代心理健康支持方案」，請問此方案一年提供幾次的免費心理諮商服務？\n（四）在阿哲釐清職涯方向後，發現自己希望投入到綠能科技這個領域；但有部\n  分的技能還需要提升，這時你會推荐他報名何種訓練課程？\n  1.產業人才投資方案\n  2.產業新尖兵計畫\n  3.大專青年預聘計畫\n  4.充電再出發訓練計畫\n（五）承上題，阿哲有意願參加就業服務人員推荐的訓練計畫，但他也擔心要負\n  擔昂貴的費用，就業服務人員告訴阿哲，為了協助青年參加訓練、提升技\n  能，這個訓練計畫會補助阿哲最高新臺幣多少萬元的訓練費用？參訓期間\n  還提供每月最高新臺幣多少千元的學習獎勵金？阿哲瞭解這樣的資源後，\n  決定投入職訓課程，以提升自己的就業競爭力。","answer":"（一）1。\n（二）2：台灣就業通「Youth職涯諮詢」平台。\n（三）3次。\n（四）2：產業新尖兵計畫。\n（五）最高10萬元訓練費；每月最高8千元學習獎勵金。"},{"id":"P019","exam":"115年度第1梯次","number":9,"question":"九、就業諮詢及媒合服務的功能主要有：\n A、需求評估及診斷：了解求職者的工作經歷、能力、態度、限制及職業期望。\n B、分析及規劃職涯：協助求職者自我探索、職涯分析及設定職業發展目標。\n C、推介就業及媒合：依據分析結果，提供適合的職缺，推介求職者就業。\n D、就業促進及輔導：提供履歷撰寫、面試技巧及心理支持，協助強化求職能力，\n   排除就業障礙。\n E、連結資源或轉介：提供創業諮詢服務、職業訓練、社政或衛政等相關資訊。\n 雖然對求職者來說，每一項功能都具有效益，但依據求職者現況差異，仍有不同\n 或適合的功能服務。請針對以下的求職者，回答就業服務人員最適合提供的功能\n 項目，每項功能不重覆：（每題 2 分，共 10 分）\n （一）在家照顧長輩 10 年，與就業市場脫節，目前結束照顧，想重返職場的求職\n     者。\n （二）父母經營的家中老店因時代變遷業績衰退，想接手家業，尋求老店轉型的\n     協助資源。\n （三）最近三份工作皆因工作表現不佳而離職，想釐清自己的工作能力落差及找\n     到可以勝任的工作。\n  （四）具專業技能之工作者，想轉職到離家近的地方工作。\n （五）清楚知道自己想做的工作，卻因缺乏工作經驗而裹足不前。","answer":"（一）A 需求評估及診斷。\n（二）E 連結資源或轉介。\n（三）B 分析及規劃職涯。\n（四）C 推介就業及媒合。\n（五）D 就業促進及輔導。"},{"id":"P020","exam":"115年度第1梯次","number":10,"question":"十、生 涯 建 構 理論 （ Career Construction Theory, CCT ） 由 薩維 卡 斯 （ Mark Savickas,\n   2013）提出，主張職涯是透過個人經驗與敘事建構出來的。在快速變動與不確定\n   的社會中，CCT 強調個體需要具備「生涯適應力」（Career Adaptability）來因應挑\n   戰與轉變。生涯適應力包含四個核心構面：\n   Ａ、生涯關注（Career Concern）：對個人職業前途的關注與規劃態度。\n   Ｂ、生涯控制（Career Control）：對個人職業未來的掌控。\n   Ｃ、生涯好奇（Career Curiosity）：對可能性的探索。\n   Ｄ、生涯自信（Career Confidence）：面對職涯挑戰的自我效能感。\n   請依下列（一）至（五）題情境對話，針對就業服務人員的回應，進行判斷最符\n   合上述生涯適應力中的哪一個核心構面？請寫出英文代碼或文字。（每題 2 分，共\n   10 分）\n   （一）求職者：「我常擔心自己能力不足，所以一直不敢行動。」\n         就業服務人員：「可以把任務拆成小步驟，每完成一次，你就更能肯定自\n         己。」\n   （二）求職者：「我不敢想未來，只想先找到一份工作。」\n         就業服務人員：「可以先描繪三年後的生活樣貌，幫助你設定清楚的職涯方\n         向。」\n   （三）求職者：「我一直覺得被錄取或升遷是別人決定的，我沒辦法影響。」\n         就業服務人員：「其實你能掌握的包括充分準備、主動表現與持續進修，這\n         些會大幅提升你的機會。」\n   （四）求職者：「我覺得自己沒有選擇權，什麼工作都只能接受。」\n         就業服務人員：「你還是可以決定要不要接受這些工作，以及如何準備下一\n         步，選擇權都在你手上。」\n   （五）求職者：「我只熟悉目前的工作領域，不知道外面有沒有適合我的機會。」\n         就業服務人員：「你可以試著參加就業促進研習，了解不同產業趨勢，或透\n         過測驗探索其他的就業發展機會。」","answer":"（一）D 生涯自信。\n（二）A 生涯關注。\n（三）B 生涯控制。\n（四）B 生涯控制。\n（五）C 生涯好奇。"},{"id":"P021","exam":"114年度第3梯次","number":1,"question":"一、請依外國人從事就業服務法第四十六條第一項第八款至第十一款工作資格及審查\n 標準（以下簡稱審查標準）相關規定，回答下列問題：\n （一）除農林漁牧有關之合作社或非營利組織得聘僱外國人從事審查標準第 5 條\n    第 5 款規定之外展農務工作外，還有哪 2 個單位亦得聘僱外國人從事外展\n    農務工作？（每個單位 2 分，共 4 分）\n （二）雇主經營蔬菜、花卉、種苗、果樹、雜糧、特用作物、草皮、芽菜與食用\n    菇蕈栽培，並聘僱外國人從事審查標準第 56 條附表 12 規定之農糧相關工\n    作，其僱用員工人數為幾人以下者，申請初次招募人數及所聘僱外國人人\n    數，不得超過中央目的事業主管機關核發認定函當月前 2 個月之前 1 年國\n    內僱用員工平均人數？（2 分）\n （三）雇主聘僱外國人從事審查標準第 5 條第 8 款之廢棄物及資源物回收處理工\n    作，其應取得環境保護主管機關核發之哪 3 種登記證或許可證之一？（請\n    依法令規定名詞作答，3 種中答對 1 種 1 分，答對 2 種以上 2 分，共 2 分）\n （四）雇主聘僱外國人從事審查標準第 5 條第 8 款之廢棄物及資源物回收處理工\n    作，其依審查標準第 56 條之 5 規定申請初次招募人數及所聘僱外國人人\n    數，合計不得超過雇主申請當月前 2 個月之前 1 年僱用員工平均人數之多\n    少％？（2 分）","answer":"（一）農會、漁會。\n（二）10人以下。\n（三）依考試當時審查標準，環保主管機關核發之「公民營廢棄物清除機構許可證」、「公民營廢棄物處理機構許可證」或「應回收廢棄物回收業登記證」等法定證照之一；作答時應依題目當時條文正式名稱。\n（四）20%。"},{"id":"P022","exam":"114年度第3梯次","number":2,"question":"二、依就業保險促進就業實施辦法規定，中央主管機關因景氣因素影響，致勞雇雙方\n  協商減少工時（又稱減班休息），經評估有必要時，得召開僱用安定措施諮詢會\n  議，辦理僱用安定措施。請回答下列問題：\n  （一）甲君於勞動部公告辦理僱用安定措施啟動後才受僱現職雇主並為就業保險\n     被保險人，請依就業保險促進就業實施辦法第 9 條規定，說明甲君如要領\n     取僱用安定措施之薪資補貼，應符合的 4 款資格規定為何？（每款資格規\n     定 2 分，共 8 分）\n  （二）就業保險促進就業實施辦法規定勞動部公告辦理僱用安定措施的辦理期\n     間，最長為幾個月？（2 分）","answer":"（一）四項：1.減班休息達30日以上並依法辦理；2.實施減班休息前，以現職雇主為投保單位參加就保達3個月以上；3.屬全時勞工或有固定工作日（時）數之部分工時勞工；4.不是事業單位代表人、負責人、合夥人、董事或監察人。\n（二）最長12個月。"},{"id":"P023","exam":"114年度第3梯次","number":3,"question":"三、乙君居住於新北市，平日搭捷運前往位於臺北市之 A 貿易公司上班，於發薪日檢\n  視其薪資明細，發現公司未依法將每月之全勤獎金及績效獎金納入加班費之計\n  算，經向公司人資部門反應無效後，向政府單位申請勞資爭議調解，請依勞資爭\n  議處理法規定，回答下列問題：\n  （一）依勞資爭議處理法第 5 條規定，所謂勞資爭議係指哪 2 種事項之勞資爭\n     議？（每種事項 2 分，共 4 分）\n  （二）乙君欲申請調解時，應向哪一個政府單位提出調解申請書？（2 分）\n  （三）承上，該政府單位受理調解之申請，應依申請人之請求，以指派調解人或\n     組成勞資爭議調解委員會進行調解，乙君經評估，決定請求依勞資爭議調\n     解委員會調解之，該政府單位於收到乙君之申請書後，應於調解委員完成\n     選定或指定之日起幾日內，組成調解委員會並召開調解會議？（2 分）又調\n     解委員會應指派委員調查事實，除有特殊情形外，該委員應於受指派後幾\n     日內，將調查結果及解決方案提報調解委員會？（2 分）","answer":"（一）權利事項、調整事項。\n（二）臺北市政府。\n（三）調解委員完成選定或指定之日起14日內組成並召開調解會議；受指派調查委員原則於10日內提出調查結果及解決方案。"},{"id":"P024","exam":"114年度第3梯次","number":4,"question":"四、請問下列人員是否適用「中高齡者及高齡者就業促進法」？（每題 1 分，共 10\n  分）\n  （一）阿明年滿 49 歲，是本國國民。\n  （二）阿雄年滿 75 歲，是本國國民。\n  （三）阿宰年滿 35 歲，是本國國民。\n  （四）阿俐年滿 45 歲，是大陸地區人民，與在本國境內設有戶籍之國民結婚，且\n       獲准在台灣地區居留。\n  （五）阿阮年滿 55 歲，未婚，是獲許可之越南籍家庭看護工，且獲准在台灣地區\n       居留。\n  （六）阿芝年滿 60 歲，是香港居民，與在本國境內設有戶籍之國民結婚，但離婚\n       了，而仍依法獲准在台灣地區繼續居留工作。\n  （七）阿玉年滿 65 歲，與未具我國國籍之外國人結婚，是獲准在台灣地區居留的\n       澳門居民。\n  （八）阿曼年滿 55 歲，是印尼籍，與在本國境內設有戶籍之國民結婚，且有獲准\n       在台灣地區居留。\n  （九）阿冪年滿 45 歲，是大陸地區人民，與在本國境內設有戶籍之國民結婚，但\n       其配偶死亡，而仍依法獲准在台灣地區繼續居留工作。\n  （十）阿藤年滿 35 歲，是日本籍，與在本國境內設有戶籍之國民結婚，獲准在台\n       灣地區居留。","answer":"依題目10人逐一判斷：1適用、2適用、3不適用、4適用、5不適用、6適用、7不適用、8適用、9適用、10不適用。判斷核心：年滿45歲，且須符合本國國民或法定外籍／陸港澳配偶等身分。"},{"id":"P025","exam":"114年度第3梯次","number":5,"question":"五、請依勞工職業災害保險及保護法第 43 條及第 69 條第 1 項規定，回答下列問題：\n  （一）僱用職業災害勞工之事業單位，除有僱用其他事業單位之職業災害勞工之\n       外，符合哪 3 種情形亦可向直轄市、縣（市）主管機關申請補助？（每種\n       情形 2 分，共 6 分）\n  （二）依勞工職業災害保險及保護法第 43 條規定，被保險人遭遇職業傷病，經治\n       療後，症狀固定，再行治療仍不能改善其治療效果，經全民健康保險特約\n       醫院或診所診斷永久失能，且符合勞工職業災害保險失能給付標準規定，\n       以及失能程度經評估符合以下情形之一，得請領失能年金，應各按平均月\n       投保薪資多少％發給？\n     1、 完全失能。（2 分）\n     2、 部分失能。（2 分）","answer":"（一）協助職災勞工恢復原工作、調整職務、安排其他工作。\n（二）完全失能：平均月投保薪資70%；部分失能：20%。（法條另規定嚴重失能為50%。）"},{"id":"P026","exam":"114年度第3梯次","number":6,"question":"六、\n  （一）依據 114 年上半年政府統計資訊，台灣的總人口為 2,335 萬人、15 歲以上民\n       間人口為 2,025 萬人、就業人數為 1,161 萬人、失業人數為 40 萬人，請依前\n       述數據，回答下列問題：（比率計算請四捨五入計算到小數點後第 1 位）\n     1、 勞動力人數是多少？（2 分）\n     2、 勞動力參與率是多少？（2 分）\n     3、 失業率是多少？（2 分）\n  （二）若某地區就業市場統計資料，在 113 年時的勞動力參與率為 60％，預估在\n       116 年的勞動力參與率為 61％，請回答下列問題是正確或錯誤：\n     1、 116 年較 113 年的勞動力參與率上升，表示 116 年的失業率必然低於 113 年\n       的失業率。（2 分）\n     2、 116 年較 113 年的勞動力參與率上升，表示 116 年的勞動人口總數必然多於\n       113 年的勞動人口總數。（2 分）","answer":"（一）勞動力1,201萬人；勞動力參與率59.3%；失業率3.3%。\n（二）1.錯誤。2.錯誤。"},{"id":"P027","exam":"114年度第3梯次","number":7,"question":"七、依據 Vilia M. Tarvydas 的諮詢倫理與決策模式中，在選擇最佳倫理方案前，有 5 個\n  要素需多加思考，請從下列的選項中，寫出該 5 個要素之英文代碼或文字。（每個\n  要素 2 分，共 10 分）\n  Ａ、思考爭取時效。\n  Ｂ、瞭解所蒐集到的相關資料。\n  Ｃ、思考所將採取的行動方案，會否違反倫理原則。\n  Ｄ、思考長官喜好的方向。\n  Ｅ、對於不同職位者，需個別考量。\n  Ｆ、勿太早做判斷。\n  Ｇ、需同時考量媒體和輿論的走向。\n  Ｈ、考慮該行動會產生的風險。\n  Ｉ、必要時向專業同儕諮詢。\n  Ｊ、首重成本效益。","answer":"B、C、F、H、I。"},{"id":"P028","exam":"114年度第3梯次","number":8,"question":"八、一般而言，政府與社會資源運用，包含公立及私立就業服務機構、社會福利機\n  構、職業訓練機構等社會資源，請依相關規定，回答下列問題：\n  （一）甲君因為搬家，需要在新家附近找工作，請任意列舉 4 項公立就業服務機\n      構掌理提供服務的項目？（每項 1 分，共 4 分）\n  （二）乙君因為住家是在較為偏遠的郊區，附近沒有就業服務機構，只有社會福\n      利服務機構，一般而言，社會福利服務機構可否提供相關的就業服務工\n      作？（2 分）\n  （三）丙君想提升自己的工作職能，因而想參加職能提升的職業訓練，請依就業\n      保險之職業訓練及訓練經費管理運用辦法第 5 條規定，任意列舉該辦法得\n      辦理之 4 種職類名稱？（每種 1 分，共 4 分）","answer":"（一）公立就業服務機構可提供：求職／求才登記及推介、就業諮詢、職業輔導、職業訓練諮詢與推介等（依題目要求列4項）。\n（二）依題目所列社福／就業資源之服務對象配對。\n（三）依規定職訓經費可運用之工作／職類，列符合題意之4類。詳見該梯次解題來源頁。"},{"id":"P029","exam":"114年度第3梯次","number":9,"question":"九、常見之就業媒合會談技巧，包括下列項目：\n Ａ、重新框架（Reframing）。\n Ｂ、總結/摘要（Summaries）。\n Ｃ、開放式提問（Open-ended Questions）。\n Ｄ、澄清（Clarification）。\n Ｅ、肯定（Affirmations）。\n Ｆ、量尺技術（Scaling）。\n Ｇ、建議（Advice-giving）。\n Ｈ、自我揭露（Self-disclosure）。\n Ｉ、面質（Confrontation）。\n 下列（一）至（五）題對話案例呈現就業服務人員與 1 位欲轉換工作的求職者之\n 間的媒合會談內容。請依各題對話情境，判斷並寫出就業服務人員所運用的最相\n 符的 1 項會談技巧之英文代碼或文字。（每題 2 分，共 10 分）\n （一）就業服務人員：「在你考慮轉換工作的過程中，最讓你感到挑戰或困難的是\n      什麼？」\n      求職者：「我覺得投了很多履歷，但回應很少，真的很挫折。」\n （二）就業服務人員：「如果以 0 到 10 分來表示你對轉換到理想工作的信心，0 代\n      表完全沒信心，10 代表非常有信心，你會給自己幾分？」\n      求職者：「大概是 4 吧。」\n （三）求職者：「我不太確定要不要換工作」\n      就業服務人員：「你的意思是，你還在考慮要不要換，還是其實已經想換\n      了，只是還沒下定決心？」\n      求職者：「應該是後者，我想換，但有點怕失敗。」\n （四）就業服務人員：「即使遇到挫折，你仍然持續投履歷，這展現了你的毅力和\n      堅持。」\n      求職者：「對，我覺得自己至少有不怕辛苦的特質，這應該是我的優勢。」\n （五）就業服務人員：「所以我們今天這樣的討論下來，你雖然覺得轉職不容易、\n      也有些擔心，但仍希望找到一份能兼顧成長和穩定收入的工作。」\n      求職者回應：「嗯，對的，這正是我現在最想要的。」","answer":"（一）C 開放式提問。\n（二）F 量尺技術。\n（三）D 澄清。\n（四）E 肯定。\n（五）B 總結／摘要。"},{"id":"P030","exam":"114年度第3梯次","number":10,"question":"十、甲君 20 歲女性，因為大學成績不佳、對就讀科系也沒興趣，決定退學打工重考。\n  請參考她的工作風格測驗結果與公關企劃、電話行銷兩個職業的對照折線圖，回\n  答下列問題：\n         個人分數 職業期待(公關- 職業期待(銷售-\n  工作風格    /PR 值 公關企劃人員) 電話行銷人員)         職業期待比較\n   向度\n                                    1   2   3   4   5\n  溫和寬厚     3.0/9    4.4       4.7\n  關懷他人     4.0/65   3.5       3.1\n  團隊合作     3.0/22   4.2       3.9\n   挑戰      4.2/84   4.2       4.3\n  謹慎條理     3.6/32   4.8       4.2\n   自律      2.4/3    3.9       4.2\n   社交      1.6/4    3.7       2.8\n   剛強      2.0/7    4         2.8\n  沉著應對     3.8/86   4.4       4.2\n  心平氣和     3.0/53   4.4       4.5\n   洞察力     5.0/94   3.5       2.9\n   美感      3.6/61   4.3       4.3\n  創意思考     4.0/85   3.6       2.7\n（一）「關懷他人」和「創意思考」的原始分數都是 4.0，PR 值卻分別 65、85，\n   請判斷以下各子題陳述是否正確？\n 1、 就甲君個人的工作風格來看，「關懷他人」和「創意思考」一樣強。（2 分）\n 2、 和他人比較起來，甲君的「創意思考」比「關懷他人」強。（2 分）\n（二）根據折線圖，整體來看，甲君與電話行銷的折線型態相似性比公關企劃\n   高，請判斷以下各子題陳述是否正確？\n 1、 甲君對電話行銷的客觀契合度比公關企劃高。（2 分）\n 2、 若應用工作調適理論的現代取向適配觀點來看，電話行銷的潛在雇主可能\n   會比公關企劃的潛在雇主更覺得甲君是值得聘用的員工。（2 分）\n 3、 若應用敘事取向生涯理論的後現代取向觀點來看，在挑選工作時，甲君看\n   重的「挑戰」、「洞察力」兩個工作風格特質上的契合度會比其他工作風格\n   特質更為重要。（2 分）","answer":"依題目工作風格測驗情境逐一配對；本題屬測驗向度判讀題，應以題幹各向度定義為準。參考解題來源頁列有各子題配對答案。"},{"id":"P031","exam":"114年度第2梯次","number":1,"question":"一、甲君為中低收入戶，家中經濟拮据，甲君父親高齡 78 歲且患有口腔癌，日前不慎\n  於浴室跌倒，需要有人全天候照顧，甲君欲聘僱外籍家庭看護工，請依就業服務\n  法及相關規定，回答下列問題：\n  （一）依 114 年 1 月 20 日修正公布之就業服務法第 46 條規定，聘僱外籍家庭看護\n     工，被看護者得免經醫療機構之專業評估需符合二要件其中之一，請問，\n     其二要件分別為何？（每要件 2 分，共 4 分）\n  （二）甲君欲聘僱外國人從事家庭看護工作，經濟是重要考量，如其順利聘僱外\n     國人從事家庭看護工作，需負擔該外國人之薪資、健保費用及向政府繳納\n     就業安定費用，請問，甲君需向政府繳納多少金額之就業安定費？（2 分）\n  （三）承上，甲君擔任雇主除前揭給付義務外，亦需負擔該外國人之生活照顧責\n     任，且需於外國人入國後幾個工作日內，安排其至指定醫院接受健康檢\n     查？（2 分）並自聘僱許可生效日起，工作滿 6 個月、18 個月及 30 個月之\n     日前後幾日內，即需再安排其至指定醫院接受定期健康檢查？（2 分）","answer":"（一）免經醫療機構專業評估之二要件：1.被看護者年滿80歲以上；2.70～79歲且患癌症二期以上。\n（二）中低收入戶聘僱家庭看護工之就業安定費依當時標準為每月600元。\n（三）入國後3個工作日內健康檢查；工作滿6、18、30個月之日前後30日內辦理定期健檢。"},{"id":"P032","exam":"114年度第2梯次","number":2,"question":"二、依就業保險法規定，中央主管機關得於就業保險年度應收保險費百分之十及歷年\n  經費執行賸餘額度之範圍內提撥經費，辦理哪些事項？（每項 2 分，共 8 分）就\n  業保險業務之監理單位為何？（2 分）","answer":"依題目就業保險法各子題：就保促進就業經費可辦理在職訓練、失業後職訓／創業協助及其他促進就業措施、僱用安定措施、雇主僱用失業勞工之獎助；爭議案件先向勞工保險監理委員會申請審議，再得訴願及行政訴訟。其餘數字依題目所引條文作答。"},{"id":"P033","exam":"114年度第2梯次","number":3,"question":"三、\n  （一）請分別回答下列 3 個法律規定的主管機關為何？\n      1、 性別平等工作法。（1 分）\n      2、 勞資爭議處理法。（1 分）\n      3、 大量解僱勞工保護法。（1 分）\n  （二）當勞資雙方發生「性騷擾」及「解僱」等相關爭議事項時，應如何處理：\n      1、 勞資雙方當事人應本哪 2 種原則，解決勞資爭議？（每種 1 分，共 2 分）\n      2、 事業單位依大量解僱勞工保護法規定提出解僱計畫書之日起多少日內？（2\n       分）勞雇雙方應即本於何種精神進行協商？（2 分）\n      3、 依據性別平等工作法規定，最高負責人或僱用人經地方主管機關認定有性\n       騷擾者，處新臺幣 1 萬元以上多少萬元以下罰鍰？（1 分）","answer":"（一）三法主管機關均為：中央勞動部；直轄市為直轄市政府；縣（市）為縣（市）政府。\n（二）大量解僱協商強調誠實信用、勞資自治。\n（三）解僱計畫提出後10日內協商。\n（四）性別平等工作法相關性騷擾申訴及裁罰依題目當時條文作答；最高罰鍰題以100萬元為重點。"},{"id":"P034","exam":"114年度第2梯次","number":4,"question":"四、Ａ公司近期因為美國關稅措施的影響致訂單大量減少，面臨財務危機，Ａ公司在\n     考慮幾種可以採取的應對方式。請依勞動基準法及勞工退休金條例規定，回答下\n     列問題：\n  （一）因資深有經驗的員工難尋，Ａ公司希望先不要資遣員工，因此依法定程序\n       與本國員工甲君完成協商，並經甲君同意後議定，近期先採取暫時縮減工\n       作時間及減少工資的方式（以下簡稱減班休息），實施期間為 3 個月；又因\n       甲君屬於按月計酬的全時勞工，則在這段協商減班休息的期間內，對於Ａ\n       公司與甲君議定後的每月工資有何規範？（2 分）\n  （二）本國員工乙君由於不同意Ａ公司採取減班休息方式，在Ａ公司未能依原勞\n       動契約給付工資的情形下，乙君是否得依勞動基準法規定終止勞動契約？\n       （2 分）是否得請求資遣費？（2 分）\n  （三）在與勞工協商實施減班休息一段期間後，Ａ公司認為業務緊縮的情形將會\n       持續一段時間，因此Ａ公司與本國員工丙君終止勞動契約，以精簡人力來\n       維持營運，丙君在Ａ公司工作剛好滿 1 年，則Ａ公司給丙君的資遣費應如\n       何發給？（2 分）Ａ公司應於幾日前預告丙君將終止勞動契約？（2 分）","answer":"（一）減班休息期間工資可按實際減少工時比例減少，但不得低於最低工資。\n（二）依勞基法終止契約須符合第11條等法定事由。\n（三）工作滿1年之新制資遣費為0.5個月平均工資；預告期間20日。"},{"id":"P035","exam":"114年度第2梯次","number":5,"question":"五、請依勞工保險條例、勞工職業災害保險及保護法相關規定，回答下列問題：\n （一）依「勞工保險條例」第 19 條第 6 項規定，被保險人失蹤滿幾年或受死亡宣\n     告判決確定死亡時，得依同條例第 64 條規定，請領死亡給付？（2 分）\n （二）依「勞工保險條例」第 20 條第 1 項規定，被保險人在保險有效期間發生傷\n     病事故，於保險效力停止後幾年內，得請領同一傷病及其引起之疾病之傷\n     病給付、失能給付、死亡給付或職業災害醫療給付？（2 分）\n （三）依「勞工保險條例」第 31 條第 1 項規定，被保險人參加保險滿幾日後分娩\n     者，得請領生育給付？（2 分）\n （四）依「勞工職業災害保險及保護法」第 15 條第 3 項規定，投保單位應備置所\n     屬勞工名冊、出勤工作紀錄及薪資帳冊，並自被保險人離職、退會或結\n     （退）訓之日起保存幾年？（2 分）\n （五）依「勞工職業災害保險及保護法」第 28 條第 1 項規定，以現金發給之保險\n     給付，其金額按被保險人平均月投保薪資及給付基準計算。同條第 2 項規\n     定，平均月投保薪資，應按被保險人發生保險事故之當月起前幾個月之實\n     際月投保薪資，平均計算；未滿者，按其實際投保期間之平均月投保薪資\n     計算？（2 分）","answer":"（一）死亡給付「失蹤」情形依題目法規須失蹤滿1年。\n（二）勞工職災保險相關給付及投保義務依題目所引條文作答；職災保險不因勞工逾65歲而免除投保。"},{"id":"P036","exam":"114年度第2梯次","number":6,"question":"六、\n  （一）勞參率全名為勞動力參與率，其定義為何？（2 分）\n  （二）請問由哪一個機關統籌規劃、各縣（市）政府執行實地訪查作業，按月辦\n      理人力資源調查，並定期彙整調查結果，編製人力資源統計月報，以明瞭\n      臺灣地區及各縣（市）人力供應情形，勞動力之數量、品質、就業、失業\n      狀況與人力發展趨勢？（2 分）\n  （三）國內景氣好壞影響勞動市場，以下為國家發展委員會 2024 年 4 月至 2025 年\n      3 月每月所發布景氣對策信號，請問有哪幾個月呈現「紅燈」，表示景氣熱\n      絡？（2 分，月份全對才給分）\n        年-月       景氣對策信號（分）\n        2024-04       35\n        2024-05       36\n        2024-06       38\n        2024-07       35\n        2024-08       39\n        2024-09       34\n        2024-10       32\n        2024-11       34\n        2024-12       38\n        2025-01       35\n        2025-02       37\n        2025-03       34\n  （四）公共汽車客運業者及居住型長期照顧業者分別反映大客車駕駛員及照顧服\n      務員缺人嚴重，請回答下列問題：\n     1、 依主計總處行業統計分類之 19 個大類，公共汽車客運業及居住型長期照顧\n      業分別屬於哪一個大類行業名稱？（各 1 分，共 2 分）\n     2、 依主計總處職業標準分類之 10 個大類，大客車駕駛員及照顧服務員分別屬\n      於哪一個大類職業名稱？（各 1 分，共 2 分）","answer":"（一）勞參率＝勞動力÷15歲以上民間人口×100%。\n（二）行政院主計總處。\n（三）紅燈月份：2024年6月、8月、12月。\n（四）公共汽車客運業：H運輸及倉儲業；居住型長期照顧業：Q醫療保健及社會工作服務業。大客車駕駛員及照顧服務員之職業分類依職業標準分類配對。"},{"id":"P037","exam":"114年度第2梯次","number":7,"question":"七、職場應遵守的職業道德與倫理重點主要包括：（A）保障就業機會平等、（B）資料\n  取得應尊重求職者意願、（C）禁止不實徵才與欺騙行為、（D）誠信原則與不得收\n  取保證金、（E）禁止指派違反善良風俗之工作、（F）保障弱勢族群的就業權益、\n  （G）資料使用應保密並尊重個人資料、（H）拒絕性騷擾與職場暴力、（I）誠實申\n  報與配合主管機關檢查等。\n  請根據下列（一）至（五）題之情境描述，寫出就業服務機構或公司「違反」或\n  「未違反」職業道德與倫理，並寫出與各子題所對應最相符的 1 項職業道德與倫\n  理重點之英文代碼或文字。（每題 2 分，共 10 分）\n  （一）公立就業服務機構協助甲君求職時，經書面同意其資料使用後，應用保密\n     防護機制，僅在工作媒合所需範圍內，將其履歷與聯絡方式提供合法企業\n     徵才使用，以確保資料安全，不得作其他用途。\n  （二）某外籍移工向私立就業服務機構反映遭雇主性騷擾；惟該機構人員未通報\n     主管機關或司法機關，僅口頭安撫當事人。\n  （三）Ａ公司於徵才廣告中表明「歡迎各年齡層人士應徵」，並於面試過程中本於\n     職務條件與應徵者能力，進行客觀且一致性之評估。\n  （四）Ｂ公司明確要求應徵者提供學歷證明、工作經驗及聯絡方式，並說明這些\n     資料為審查錄取資格所必須，僅在徵才程序中依法蒐集。\n  （五）Ｃ公司在網路上刊登徵才廣告，宣稱「月薪保證新台幣 5 萬元起，另有高\n     額獎金」。求職人乙君錄取後發現實際月薪僅為新台幣 3 萬 5,000 元，主管\n     則解釋：「這是吸引人才的策略，實際薪資依績效調整。」","answer":"（一）未違反。\n（二）違反。\n（三）未違反。\n（四）未違反。\n（五）違反。"},{"id":"P038","exam":"114年度第2梯次","number":8,"question":"八、依據就業服務法第 34 條規定，私立就業服務機構及其分支機構，應向主管機關申\n  請設立許可，未經許可，不得從事就業服務業務。請依下列各子題情況回答是否\n  為合法可從事就業服務？（每題 2 分，共 10 分）\n  （一）Ａ私立科大未申請就業服務機構設立許可，為其畢業生辦理免費求職媒\n     合。\n  （二）Ｂ非營利機構未申請就業服務機構設立許可，接受某市政府委託辦理失業\n     者職業訓練後為其受訓學員辦理免費小型就業媒合會。\n  （三）Ｃ私立家教中心未申請就業服務機構設立許可，為民眾媒介家教。\n  （四）Ｄ企業依法附設職業訓練中心，未申請就業服務機構設立許可，自行對外\n     招收學員辦理訓練後，為其受訓學員辦理免費求職服務。\n  （五）Ｅ網路平台未申請就業服務機構設立許可，為雇主及求職者辦理居間配對\n     及就業媒合。","answer":"（一）合法。\n（二）合法。\n（三）不合法。\n（四）合法。\n（五）不合法。"},{"id":"P039","exam":"114年度第2梯次","number":9,"question":"九、甲君因求職面試問題求助於就業服務人員。甲君說：「我去年高職資訊科畢業至今\n  10 個月了，但我前後應徵過的工作好幾十個了，大部分投了履歷就沒下文，只有\n  7 個有叫我去面試，但他們問的都是一些無關緊要的問題，像是住哪裡、會不會騎\n  車、能不能趕急件，還有的問個性什麼的，然後就都通知說沒錄取。我實在搞不\n  懂問題在哪，大家都說資訊科的不愁沒工作，我們班同學沒升學的也大部分都找\n  到工作了，怎麼我就一直找不到，到底是我不行？還是我運氣太背！我現在接到\n  信都很怕，不敢打開來，怕又是不錄取通知。請教教我，到底該怎麼辦。」\n  請寫出下列哪一種會談技巧最能貼切且充分反映出下列（一）至（五）題之就業\n  服務人員的回應所欲達成的會談效果，每個會談技巧只能使用一次。（每題 2 分，\n  共 10 分）\n  技巧 A：同理，或情感反映。\n  技巧 B：鼓勵，或支持，或正向增強。\n  技巧 C：聚焦。\n  技巧 D：立即性。\n  技巧 E：面質，或挑戰。\n  技巧 F：建議，或提供訊息。\n  技巧 G：重新框架，或重新架構、再框架、換框法。\n  5 位就業服務人員的回應分別如下：\n  （一）乙君說：「10 個月來，面試屢屢受挫，讓你非常沮喪，甚至開始懷疑自己是\n      不是有問題。」\n  （二）丙君說：「儘管還沒成功，但你依然堅持不放棄，一次次地重新投出履歷，\n      現在還來這裡尋求諮詢，相信你這種契而不捨的精神，可以成為你未來成\n      功的優勢力量。」\n  （三）丁君說：「我很樂意幫助你。不知道你現在最希望我提供的是哪方面的協\n      助？」\n  （四）戊君說：「求職確實需要一些技巧。既然你投了很多履歷都沒得到回應，我\n      們不妨一起來研究看看你的履歷可以如何改善。」\n  （五）己君說：「雖然應徵沒上很讓人遺憾，但，現在的你其實已經有了非常豐富\n      的求職經驗，而且其中還有 7 次已經獲邀面試，算是小小成功經驗。」","answer":"（一）A 同理／情感反映。\n（二）B 鼓勵／支持／正向增強。\n（三）C 聚焦。\n（四）F 建議／提供訊息。\n（五）G 重新框架。"},{"id":"P040","exam":"114年度第2梯次","number":10,"question":"十、二十世紀的前半世紀，生涯發展與規劃的主張，是較單純的考慮到職業議題，\n 1950 年代以後，Donald Super 為生涯規劃加入了「自我發展」的概念，並進一步拓\n 展、融入人的生命歷程，將之分為：（A）生長期、（B）探索期、（C）建立期、\n （D）維持期、（E）衰退期等 5 個時期。\n 請根據下列（一）至（五）題所描述之內容，寫出各子題之時期的英文代碼或文\n 字。（每題 2 分，共 10 分）\n （一）累積職業經驗與技能。\n （二）開始思考並規劃未來的減量工作、增加休閒、健康慢活等想法。\n （三）保持工作動力、實現生活平衡，以及應對未來轉變。\n （四）發展並察覺自己的興趣、能力、工作人格。\n （五）思考自己想成為什麼樣的人，想做什麼樣的工作。","answer":"（一）建立期。\n（二）衰退期。\n（三）維持期。\n（四）探索期。\n（五）成長期。"},{"id":"P041","exam":"113年度第3梯次","number":1,"question":"一、雇主甲君經勞動部自 113 年 8 月 1 日起，許可聘僱首次入國工作之印尼籍外國人 A\n  君從事家庭看護工作，聘僱許可期間 3 年；雇主乙君經勞動部自 113 年 8 月 1 日\n  起，許可聘僱菲律賓籍外國人 B 君從事製造工作；雇主丙君經勞動部自 113 年 8\n  月 1 日起，許可聘僱印尼籍外國人 C 君從事海洋漁撈工作。請依規定回答下列問\n  題：\n  （一）依「外國人從事就業服務法第四十六條第一項第八款至第十一款工作資格\n       及審查標準」第 8 條規定，A 君於 113 年 8 月 1 日入國時，應於勞動部指定\n       地點，接受幾小時以上之講習，並取得完訓證明？（2 分）\n  （二）依就業服務法第 58 條規定，A 君於 113 年 10 月 1 日經雇主甲君同意轉換雇\n       主或工作，並經勞動部廢止聘僱許可後，逾幾個月未由新雇主接續聘僱，\n       雇主甲君即得申請遞補？（2 分）\n  （三）依「雇主聘僱外國人許可及管理辦法」第 24 條規定，A 君經新雇主接續聘\n       僱後，雇主甲君依就業服務法第 58 條第 2 項第 3 款規定，向勞動部申請遞\n       補，其應於新雇主接續聘僱 A 君之日起幾個月內提出申請？（2 分）\n  （四）依就業服務法第 57 條及第 68 條規定，雇主乙君未經許可，指派 B 君變更\n       工作場所，最低應處新臺幣多少元罰鍰？（2 分）\n  （五）依就業服務法第 57 條及第 67 條規定，雇主丙君未依「受聘僱外國人健康\n       檢查管理辦法」第 5 條規定，自 C 君聘僱許可生效日起，工作滿 6 個月之\n       日前後 30 日內，安排其至指定醫院接受定期健康檢查，最低應處新臺幣多\n       少元罰鍰？（2 分）","answer":"依題目外國人聘僱案例：家庭看護工首次入國應接受法定講習並取得完訓證明；製造、海洋漁撈等後續轉換、聘僱及申報程序依題目所引就服法／審查標準逐項作答。數字與條件以113年第3梯當時法規為準，詳見本梯次公開解析。"},{"id":"P042","exam":"113年度第3梯次","number":2,"question":"二、\n  （一）依據中高齡者及高齡者就業促進法規定，下列敘述何者「錯誤」？（複選\n        題，全對才給分，2 分）\n       （A） 雇主因受僱之中高齡者及高齡者提出中高齡者及高齡者就業促進法之\n           申訴或協助他人申訴，為利調查，可以將提出申訴之受僱中高齡或高\n           齡者予以調職。\n       （B） 雇主對於所僱用之中高齡者及高齡者之家屬需長期照顧時，得依其需\n           要轉介適當之長期照顧服務資源。\n       （C） 雇主對求職或受僱之中高齡者及高齡者，不得以年齡為由予以差別待\n           遇。但薪資之給付，係基於年資、獎懲、績效或其他非因年齡因素之\n           正當理由者，不在此限。\n       （D） 求職或受僱之中高齡者及高齡者除應釋明差別待遇之事實，並應就差\n           別待遇之非年齡因素，負舉證責任。\n     （二）依據中高齡者及高齡者就業促進法規定，下列敘述何者「正確」？（複選\n        題，全對才給分，2 分）\n       （A） 65 歲以上勞工，雇主得以定期勞動契約僱用之。\n       （B） 雇主為使所僱用之中高齡者與高齡者傳承技術及經驗，促進世代合\n           作，得採同一工作分工合作等方式為之。\n       （C） 中央主管機關應會商中央目的事業主管機關及地方主管機關，至少每\n           5 年訂定中高齡者及高齡者就業計畫。\n       （D） 為傳承中高齡者與高齡者智慧經驗及營造世代和諧，主管機關應推廣\n           世代交流，支持雇主推動世代合作。\n     （三）依據中高齡者及高齡者就業促進法規定，請回答下列問題：\n      1、 求職或受僱之中高齡者及高齡者發現雇主違反中高齡者及高齡者就業促進\n       法第 12 條第 1 項規定時，得向哪個機關申訴？（2 分）\n      2、 違反中高齡者及高齡者就業促進法第 12 條第 1 項規定者，最低應處新臺幣\n       多少元罰鍰？（2 分）\n      3、 求職或受僱之中高齡者及高齡者，因中高齡者及高齡者就業促進法第 12 條\n       第 1 項之情事致受有損害，雇主應負賠償責任。前述之損害賠償請求權，\n       自請求權人知有損害及賠償義務人時起，幾年間不行使而消滅？（2 分）","answer":"（一）錯誤選項依題目為A等違反中高齡者反報復保護之敘述；不得因申訴而解僱、調職或為其他不利處分。\n（二）中高齡就業歧視／正當差別待遇依第12條判斷。\n（三）違反年齡歧視禁止規定之罰鍰為30萬～150萬元；損害賠償請求權自知有損害及賠償義務人起2年不行使而消滅（自違反行為起逾10年亦同）。"},{"id":"P043","exam":"113年度第3梯次","number":3,"question":"三、\n  （一）依個人資料保護法第 3 條規定，關於當事人就其個人資料依個人資料保護\n      法規定行使之下列權利，不得預先拋棄或以特約限制之，下列何者「錯\n      誤」？（複選題，全對才給分，2 分）\n      （A） 不得請求停止蒐集、處理或利用。\n      （B） 請求製給複製本。\n      （C） 請求補充或更正。\n      （D） 查詢或請求閱覽。\n      （E） 不得請求刪除。\n （二）依個人資料保護法第 8 條第 1 項規定，公務機關或非公務機關依個人資料\n      保護法第 15 條或第 19 條規定向當事人蒐集個人資料時，應明確告知當事\n      人之事項中，下列何者「錯誤」？（複選題，全對才給分，2 分）\n      （A） 公務機關或非公務機關名稱及個人資料之類別。\n      （B） 非屬蒐集之目的。\n      （C） 個人資料利用之期間、地區、對象及方式。\n      （D） 當事人依個人資料保護法第 3 條規定得行使之權利及方式。\n      （E） 當事人不得自由選擇提供個人資料，不提供將對其不利之處分。\n  （三）承上，有下列情形之一者，得免為前項之告知：（填空題，每空格 3 分，共\n      6 分）\n     1、 依法律規定得免告知。\n     2、 個人資料之蒐集係公務機關執行         （1）   或非公務機關履行   （2）   所\n      必要。（請依法律條文作答，未依法律條文作答不給分。）\n     3、 告知將妨害公務機關執行法定職務。\n     4、 告知將妨害公共利益。\n     5、 當事人明知應告知之內容。\n     6、 個人資料之蒐集非基於營利之目的，且對當事人顯無不利之影響。","answer":"（一）錯誤：A、E。\n（二）錯誤：B、E。\n（三）法定職務；法定義務。"},{"id":"P044","exam":"113年度第3梯次","number":4,"question":"四、甲君於觀光老街與家人一同做小吃店生意，賣的是午、晚餐，每天都一大早 6 點\n     就起床備料，一直忙到晚上 9 點清掃整理完成後，才能休息。7 月進入暑假後，觀\n     光人潮多到總是天天忙不過來，有天，看到隔壁已於 6 月中旬國中畢業剛滿 15 歲\n     的鄰居乙君閒賦在家，於是甲君就詢問乙君是否有意願接受聘僱到店裡工作。請\n     依勞動基準法規定，回答下列問題：\n  （一）乙君為應屆國中畢業生，未滿 18 歲，若甲君聘僱乙君為員工，除需置備勞\n        工名卡、勞工工資清冊、勞工出勤紀錄外，依勞動基準法第 46 條規定，甲\n        君尚需置備乙君之哪 2 種書件？（各 2 分，共 4 分）\n  （二）甲君每天從早上 6 點備料，工作到晚上 9 點清掃整理完成後休息，若聘僱\n        剛滿 15 歲乙君為員工，則乙君早上最早幾點才能出勤上班工作？（2 分）\n        最晚只能工作到晚上幾點？（2 分）又整日工作時間不得超過幾小時？（2\n        分）","answer":"（一）未滿18歲者訂立勞動契約，應備法定代理人同意書及年齡證明文件。\n（二）童工／未滿18歲勞工之工時與夜間工作限制依題目當時勞基法：每日不得超過8小時、每週不得超過40小時，並有夜間時段禁止規定；題目空格依原題填入。"},{"id":"P045","exam":"113年度第3梯次","number":5,"question":"五、\n  （一）請判斷下列情形有無違反勞工職業災害保險及保護法規定？如有違反，請\n        寫「有」，並寫出涉及違反之條文規定內容始給分（不用寫出條次）；如無\n        違反，請寫「無」即可。\n      1、 Ａ公司近日新僱用了一名 66 歲的本國籍勞工，由於該勞工已逾 65 歲，因\n        此Ａ公司沒有為該名員工投保勞工職業災害保險。前述沒有為勞工投保勞\n        工職業災害保險的行為有無違法？如有違反請寫出規定內容。（2 分）\n      2、 Ｂ公司共有 3 名員工，近日經取得勞動部核發之聘僱許可後，新僱用一名\n        25 歲的外國籍員工，由於公司屬於僱用員工未滿 5 人的事業單位，且該員\n        工為外國籍，因此Ｂ公司沒有為該名員工投保勞工保險及勞工職業災害保\n        險。前述沒有為勞工投保勞工職業災害保險的行為有無違法？如有違反請\n        寫出規定內容。（2 分）\n  （二）請依據勞工職業災害保險及保護法規定，回答下列問題：\n      1、 甲君是在多家外送平台接單外送餐飲的自營作業者，並參加外送員職業工\n        會，工作期間由外送員職業工會為其投保勞工職業災害保險，則依據勞工\n        職業災害保險及保護法第 19 條規定，甲君參加勞工職業災害保險的保險費\n        負擔，甲君負擔多少百分比？（2 分）中央政府補助多少百分比？（2 分）\n   2、 乙君為實際從事勞動之人員，因其不得依勞工職業災害保險及保護法第 6\n    條至第 9 條規定參加勞工職業災害保險，為了加強保障，依同法第 10 條第\n    1 項規定，得由乙君本人辦理參加勞工職業災害保險，乙君需負擔的保險費\n    為多少百分比？（2 分）","answer":"（一）66歲本國籍勞工仍應參加勞工職業災害保險，未投保「有違法」。\n其餘各情境均應以「有／無」加上違反內容作答；原則包括到職當日申報職災保險、職災保險涵蓋法定受僱勞工等。"},{"id":"P046","exam":"113年度第3梯次","number":6,"question":"六、認知障礙者在職場遇到工作困難而無法達到雇主的要求時，可嘗試透過職務再設\n 計服務或專業諮詢輔導等方法，幫助其克服工作困難。\n 其中有關職務再設計服務可概分 5 大項：（A）改善職場工作環境、（B）改善工作\n 設備或機具、（C）提供就業所需輔具、（D）改善工作條件、（E）調整工作方法。\n 請根據下列各題情境描述中所做的職務再設計，依序寫出題號及上述服務之英文\n 代碼或名稱。\n （一）從事洗車工作的甲君，有時會有恍神、分心的情形，在車子進入車道時，\n    會造成危險，所以雇主在車道入口明顯處，加裝幾盞日光燈，強化照度；\n    並裝設一個大閃燈，車子要進來時，會閃燈以提醒之。（2 項，各 2 分，共\n    4 分）\n （二）從事作業員的乙君，除了有認知障礙，也有聽力的問題，所以每當生產線\n    有新產品時，經理總是找一位會手語的工作人員作手語翻譯，以確保乙君\n    完全瞭解新產品製作的流程和內容。（1 項，2 分）\n （三）丙君在手搖飲料店服務，由於很難掌握配料的多寡，所以浪費不少食材，\n    職務再設計專家特別為他設計不同的空杯標線及顏色，用以提醒加入各種\n    配料時應加到的高度與份量，之後他就很少出錯。（1 項，2 分）\n （四）丁君是一位障礙程度較重的青年，但庇護工場仍然願意給他機會，幫助他\n    有收入，提升自立的程度，在職場上，庇護工場將丁君和另外 2 位員工原\n    本的工作重新分配，其中將流程和內容較簡單、重複的部分，由丁君來操\n    作，其他 2 位則負責較有變化的部分，所以他們 3 位在職場上分工得宜、\n    工作愉快。（1 項，2 分）","answer":"（一）A、B。\n（二）D。\n（三）C。\n（四）E。（依題目職務再設計分類配對）"},{"id":"P047","exam":"113年度第3梯次","number":7,"question":"七、一般而言，就業服務專業人員在服務過程中，所聽到、看到或蒐集到的當事人相\n  關資訊或資料，都必須謹守為當事人保密的責任與義務。請列舉 5 個應為當事人\n  保密的原則。（每個 2 分，共 10 分）","answer":"就業服務專業人員辦理個案資料應遵守保密原則，非依法令或經當事人同意不得任意揭露；並須符合必要性、目的特定與專業倫理。依題目要求列出5項保密／例外原則。"},{"id":"P048","exam":"113年度第3梯次","number":8,"question":"八、舒波（Super）提出發展取向的生涯理論，強調生涯發展是一個歷程，他將歷程分\n  為：成長、探索、建立、維持及衰退（褪離）等 5 個生涯發展階段，並主張每個\n  人在其生涯發展歷程都需扮演不同角色，但角色分量因年齡階段而有不同。此一\n  理論並提及：「生活廣度」、「生活空間」、「生涯彩虹圖」、「生涯拱門」、「生涯凸\n  顯」、「生涯成熟」及「生涯組型」等概念。請根據下列各題情境的提問，依序寫\n  出題號及最適合的答案作回答。\n  （一）甲君在自己的職業領域，逐漸穩固地位，不僅有良好的工作創意而且表現\n     優良。任職同一公司的乙君，雖然持續做事，但漸漸減少工作時數，而且\n     思考退休之後的生活，並發展職業以外的新角色。請分別寫出甲君、乙君\n     的生涯發展階段名稱？（各 2 分，共 4 分）\n  （二）承上，從 Super 的「生涯彩虹圖」來看，甲君與乙君的生涯發展階段是屬於\n     「生活廣度」還是「生活空間」？（2 分）\n  （三）丙君熱衷美食研究，並選擇餐飲作為大學主修科系，他花大部分時間訓練\n     自己的廚藝，並參與各式烹調比賽，屢獲佳績，甚至在休息時間也會關注\n     餐飲報導。他期許自己成為一名名廚。丙君將餐飲學習擺在目前生活的主\n     要位置，最適合以 Super 理論的哪一概念做解釋？（2 分）\n  （四）丙君出席一場職涯分享會，對著與他年齡相仿的青年朋友說：「我清楚自己\n     的興趣、技能與價值觀，並確定以廚師為職志，同時也為自己後續的技能\n     精進與職場適應做好準備及因應。」丙君對自己的生涯任務已做好認知及\n     態度的準備，最適合以 Super 理論的哪一概念做解釋？（2 分）","answer":"（一）甲：建立階段；乙：衰退階段。\n（二）甲：生活廣度；乙：生活空間。\n（三）生涯凸顯。\n（四）生涯成熟。"},{"id":"P049","exam":"113年度第3梯次","number":9,"question":"九、影響面談效果有許多錯誤的方式，根據學者摩根和史密斯（1996）提出下列 5 種\n  錯誤：\n  （A） 面試者刻板印象：指面試者對應徵者某些特徵產生偏見。\n  （B） 面試內容未集中在工作有關的特質：主要在於面試者不了解甄選職位需具\n      備的 KSAO，而提出確知何種類型的應徵者適合此一職位的問題。\n  （C） 太早下判斷：面試者以一開始與應徵者交談，並根據某些資訊而以第一印\n      象做判斷。\n  （D） 應徵者外表與行為影響：面試者僅根據應徵者在面談中的行為表現判斷適\n      合職務與否。\n  （E） 應徵者對比誤差：面談者容易將前一位和後者比較後評分較高或較低，而\n      非以各項指標的真實和公平做判斷。\n  Ｃ公司為改善面試過程的錯誤，舉行內部面試檢討會，請根據下列 5 位面試者面\n  談之描述，依序寫出題號及其於面談時，犯了上述哪 1 種錯誤之英文代碼或名\n  稱。（每題 2 分，共 10 分）\n  （一）甲君說：我們公司每次一梯都排很多人面試，人資部門都有給測驗成績，\n      人進來問個兩、三題就可以給分了。\n  （二）乙君說：工廠實在不好留人，我只要看到通勤超過 60 公里，都不會給太高\n      分數。\n  （三）丙君說：我看到面試者進來沒有打招呼就坐下，離開時沒有將座椅復原，\n      都覺得他不適合需要與人互動的工作。\n  （四）丁君說：人很多的時候，第 1 個的分數大略打，問到第 3 個若整體很優，\n      再來調整，但常常下幾個碰到整體不好，要等到真的很好的才會分數再拉\n      上來。\n  （五）戊君說：我們廠要的人很多種，讓別人先問，問差不多了我再補聊幾句，\n      反正工廠要留人嘛，每次我都問喜歡去哪個夜市啦、愛聽誰的歌？","answer":"依題目「面談常見錯誤」各情境配對：應避免首因／月暈、刻板印象、相似性偏誤、對比效果及過度主觀等面談偏誤；以題幹所列代碼逐一配對。"},{"id":"P050","exam":"113年度第3梯次","number":10,"question":"十、甲君高中畢業後一直在新北大型企業擔任會計工作，他在 49 歲以 20 年期貸款購\n  買一棟大坪數電梯大樓住宅，月繳 25,000 元。他在 51 歲被以專業訓練不足為由資\n  遣。之後，他依序採取了下列 4 項行動：\n  （一）甲君持續修改履歷、分析工作市場職缺，並應徵多項會計工作。他每次應\n     徵被拒後，都致電詢問被拒理由。根據生涯混沌理論，這樣的失業後因應\n     行動，展現出下列哪 1 種思維模式？（2 分）\n     （A） 關注秩序和穩定，偏重理性邏輯的聚斂思維（convergent thinking）。\n     （B） 關注機會和變化，偏重創造力和直覺的湧現思維（emergent thinking）\n                                                。\n  （二）甲君考慮轉行，想到自己平日經常喜歡做烹飪和品嘗美食，就請就業諮詢\n     人員做測驗，以便確定自己是否適合做廚師。就業諮詢人員的第 1 個回應\n     最適合採用下列哪 1 種？（3 分）\n     （A） 好主意，做測驗確實最能幫助你確認自己是否適合做廚師。\n     （B） 其實你已經知道自己喜歡也經常做烹飪，要想確定自己是否適合做廚\n          師，需要的不是做興趣測驗，而是去蒐集廚師工作的多元職業資料。\n  （三）雖然甲君真正想做的是廚師，但因沒證照，就先去應徵餐廳外場服務生，\n     既可得到迫切需要的每月收入，還可藉機熟悉餐廳人脈與廚房工作樣貌。\n     根據機緣學習理論，這樣的生涯轉換行動規劃，最能展現出下列哪 1 種偶\n     發力（planned happenstance skills）？（2 分）\n     （A） 堅持（Persistence），不畏挫折而努力。\n     （B） 彈性（Flexibility），改變態度和環境。\n     （C） 樂觀（Optimism），將新的機會視為可達到的。\n     （D） 冒險（Risk Taking），面對不確定的結果仍採取行動。\n  （四）甲君說：「我知道做廚師要找到跟以前一樣薪水的工作很難，但每月的房屋\n     貸款就是這麼高，再怎麼難我也得設法繼續找薪水好的工作。」\n     就業諮詢人員說：「要大房子就有掙錢壓力，要做喜歡的廚師工作就養不起\n     大房子，你 2 個都不放手，恐怕很難啊！」\n     甲君說：「其實，我根本不需要那麼大坪數的房子，要是換個小坪數無電梯\n     公寓住宅，就可開心做廚師、過日子。」\n     在此，就業諮詢人員所言最契合下列哪 1 個就業會談技巧？（3 分）\n     （A）同理。      （B）解釋。       （C）面質。         （D）鼓勵。","answer":"依題目三部分作答：聚斂／湧現思維依情境配對；機緣學習理論特質包括好奇、堅持、彈性、樂觀、冒險；題末會談技巧為C「面質」。"},{"id":"P051","exam":"113年度第2梯次","number":1,"question":"一、請依私立就業服務機構許可及管理辦法（以下簡稱本辦法）規定回答下列問題：\n （一）依本辦法第 15 條之 1 規定，中央主管機關應定期於每年              （1）   月、\n     （2）   月、    （3）   月及   （4）   月，依規定查核私立就業服務機構。\n     （答案不限順序，每空格 1 分，共 4 分）\n （二）依本辦法第 15 條之 1 規定，私立就業服務機構接受委任引進之外國人入國\n     3 個月內發生行蹤不明之情事，並於 1 年內達一定之人數及比率者，係指接\n     受委任引進之外國人於下列哪些期間發生行蹤不明情事達第 15 條相關規定\n     之人數及比率者？（複選題，全對才給分，2 分）\n     (A) 入國第 31 日至第 90 日。\n     (B) 入國 30 日內，因私立就業服務機構及其分支機構未善盡受任事務所\n        致。\n     (C) 入國 60 日內，因私立就業服務機構及其分支機構未善盡受任事務所\n        致。\n （三）依本辦法第 31 條之 1 規定，中央主管機關應定期依第 31 條相關規定查核\n     外國人力仲介公司接受委任仲介其本國人或其他國家人民至中華民國境內\n     工作，其所仲介之外國人入國           （1）    日內發生行蹤不明情事之人數及比\n     率。（1 分）\n （四）承上，中央主管機關經依此規定查核後發現，外國人力仲介公司達第 31 條\n     相關規定人數及比率之次數，應通知外交部及駐外館處，依下列規定日\n     數，暫停其接受外國人委任辦理申請簽證：（每空格 1 分，共 3 分）\n   1、 第 1 次：暫停   （1）   日。\n   2、 第 2 次以上：暫停日數按次增加        （2）   日，最長為    （3）   日。","answer":"（一）3月、6月、9月、12月。\n（二）入國第31～90日；以及入國30日內因私立就服機構未善盡受任事務所致之行蹤不明。\n（三）30日。\n（四）第一次暫停7日；第二次以上按次增加7日；最長28日。"},{"id":"P052","exam":"113年度第2梯次","number":2,"question":"二、\n  （一）請判斷下列情形有無違反就業服務法規定？如有違反，請寫「有」，並寫出\n      涉及違反之條文規定內容始給分（不用寫出條次）；如無違反，請寫「無」\n      即可。\n     1、 某私立大學為該校的畢業生，免費提供與該校合作企業職缺的就業媒合活\n      動，該媒合活動有無涉及違法？（2 分）\n     2、 某公司向新北市政府登記取得私立就業服務機構許可後，從事仲介本國人\n      至臺灣地區以外之地區工作，該仲介行為有無涉及違法？（2 分）\n     3、 Ａ公司在某求才網站徵求軟體工程師，甲君看到該徵才訊息前往面試，當\n      天由Ｂ公司人員進行面試，且Ｂ公司預定與甲君簽訂勞動契約，甲君進一\n      步詢問，Ｂ公司表示與Ａ公司有合作關係，Ａ公司招募行為有無涉及違\n      法？（2 分）\n  （二）請判斷下列情形有無違反就業保險法規定？如有違反，請寫「有」，並寫出\n      涉及違反之條文規定內容始給分（不用寫出條次），如無違反，請寫「無」\n      即可。\n     1、 Ｃ公司原有員工共 3 名，近期新僱用一名 25 歲的本國籍員工，由於公司屬\n      於僱用員工未滿 5 人的事業單位，該公司的人事人員即沒有為該名新進員\n      工投保勞工保險及就業保險。前述沒有為勞工投保就業保險的行為有無涉\n      及違法？（2 分）\n     2、 Ｄ公司為響應政府近期鼓勵僱用高齡者的政策，新僱用一名 67 歲的本國籍\n      員工，但由於該員工過去是公務人員，已經領取養老給付，因此Ｄ公司沒\n      有為該名員工投保就業保險。前述沒有為勞工投保就業保險的行為有無涉\n      及違法？（2 分）","answer":"依題目各案例：1.僱用未滿5人事業單位之25歲本國籍員工仍應參加就業保險，未加保「有違法」。2.67歲且已領公務人員養老給付者不屬就保強制對象，未加保「無違法」。其餘就服法招募／仲介案例依是否有真正雇主、是否從事未經許可就服業務判斷。"},{"id":"P053","exam":"113年度第2梯次","number":3,"question":"三、甲君任職於Ｅ公司，該公司為一聘僱 25 人之美妝商品貿易公司，負責人乙君上班\n  時，經常走過甲君的座位就會對著她說：「妳這麼漂亮一定是用了我們自己的產\n  品，漂亮到我下班回家還一直想著妳………」，甲君深感不舒服且倍感壓力，可是\n  又不想這樣自行離職，於是找上公司的人事人員丙君，詢問公司是否有性騷擾申\n  訴的相關管道及規定，丙君回應甲君：「本公司規模不大，僅聘僱 25 人，非法規\n  強制規定需設性騷擾申訴管道之事業單位………」，請依新修正之性別平等工作法\n  規定回答下列問題：\n  （一）Ｅ公司人事人員丙君回應員工甲君：「本公司規模不大，僅聘僱 25 人，非\n     法規強制規定需設性騷擾申訴管道之事業單位………」，丙君以上所言為未\n     修法前之性別工作平等法規定，請問依新修正之性別平等工作法規定，雇\n     主僱用受僱者達多少人以上者，即應訂定申訴管道，並在工作場所公開揭\n     示？（2 分）\n  （二）員工甲君熱愛這份工作，不想因受性騷擾而離職，又考量乙君為公司負責\n     人，即便向公司提出申訴，可能亦得不到妥善處理，因此，甲君猶疑是否\n     依法逕向地方主管機關提出申訴。請依性別平等工作法規定，甲君自知悉\n     性騷擾時起，逾多少年提起者，地方主管機關不予受理？（2 分）自該行為\n     終了時起，逾多少年者，亦同？（2 分）\n  （三）承上，若甲君決定逕向地方主管機關提出申訴，地方主管機關調查後發現\n     Ｅ公司確實聘僱員工 25 人，且確實無訂定性騷擾申訴管道等。請依性別平\n     等工作法規定，雇主違反第 13 條第 1 項第 1 款規定，經限期改善，屆期未\n     改善者，處新臺幣     （1）   元以上   （2）   元以下罰鍰。（每空格 2 分，\n     共 4 分）","answer":"（一）僱用10人以上未達30人，即應訂定性騷擾申訴管道並公開揭示。\n（二）雇主接獲申訴知悉性騷擾時，應立即採取避免再發生、提供／轉介必要服務、調查、對行為人懲戒或處理。\n（三）違反第13條第1項第1款，經限期改善仍未改善：1萬元以上10萬元以下。"},{"id":"P054","exam":"113年度第2梯次","number":4,"question":"四、請依勞動基準法及其相關子法規定，回答下列問題：\n  （一）依勞動基準法第 26 條規定，雇主不得預扣勞工工資作為哪二種之用途？\n       （各 2 分，共 4 分）\n  （二）依勞動基準法施行細則第 6 條規定，季節性工作之定期契約，最長不得超\n       過幾個月？（2 分）臨時性工作之定期契約，最長不得超過幾個月？（2\n       分）\n  （三）依勞動基準法施行細則第 36 條規定，雇主招收技術生訓練，其所實施學科\n       訓練的時間是否包含於工作時間內？（2 分）","answer":"（一）違約金、賠償費用。\n（二）季節性工作最長9個月；臨時性工作最長6個月。\n（三）技術生之學科訓練時間包含於工作時間。"},{"id":"P055","exam":"113年度第2梯次","number":5,"question":"五、甲君受僱於員工總人數 10 人之Ｋ公司，擔任作業員工作，請依規定回答下列問\n  題：\n  （一）依「勞工保險條例」第 14 條第 2 項規定，甲君之薪資如在 112 年 2 月至 7\n       月調整時，投保單位Ｋ公司應於 112 年幾月底前將調整後之月投保薪資通\n       知勞動部勞工保險局？（2 分）如在 112 年 8 月至 113 年 1 月調整時，應於\n       113 年幾月底前通知勞動部勞工保險局？（2 分）\n  （二）依「勞工保險條例」第 30 條規定，甲君因休假期間外出遊玩時跌倒住院 10\n       天接受治療不能工作，致未能取得原有薪資，欲申請普通傷害補助費，應\n       自得請領之日起幾年間申請，否則領取該項給付之請求權即消滅？（2 分）\n  （三）依「勞工職業災害保險及保護法」第 42 條第 1 項規定，甲君因工作期間執\n       行職務受傷，住院 4 個月接受治療不能工作，致未能取得原有薪資，自不\n       能工作之日起算第幾日起，得請領職業災害保險傷病給付？（2 分）\n  （四）承上，依「勞工職業災害保險及保護法」第 42 條第 2 項規定，甲君所請領\n       職業災害保險傷病給付，前 2 個月按其平均月投保薪資發給，第 3 個月起\n       按其平均月投保薪資百分之多少發給？（2 分）","answer":"依題目勞保／職保案例：勞保強制投保門檻與職災保險投保義務不同；職災保險原則上僱用1人即須依法申報。各保險費負擔比例及給付條件按題目當時法條計算。"},{"id":"P056","exam":"113年度第2梯次","number":6,"question":"六、請依據行政院主計處（現改制為行政院主計總處）於民國 99 年編印之「中華民國\n  職業標準分類（第 6 次修訂）」，回答下列問題：\n  （一）職業之分類原則主要建構在工作內容及所需技術上。所謂「技術」係指執\n      行特定工作的能力，可由「技術層次（skill level）」加以分類。請分別寫出\n      下述工作所屬技術層次的數字：（各 1 分，共 4 分）\n    1、操作或維修電子與機械設備。\n    2、以專業領域之理論及實務應用知識為基礎，以解決複雜問題並作決策。\n    3、單純及例行性勞力工作。\n    4、執行複雜的技術性及實務性工作。\n  （二）承上，請分別寫出下述職業大類所對應技術層次的數字：（各 1 分，共 6\n      分）\n    1、技術員及助理專業人員。\n    2、事務支援人員。\n    3、服務及銷售工作人員。\n    4、農、林、漁、牧業生產人員。\n    5、技藝有關工作人員。\n    6、機械設備操作及組裝人員。","answer":"（一）2、4、1、3。\n（二）技術員及助理專業人員＝3；事務支援＝2；服務及銷售＝2；農林漁牧生產＝2；技藝有關＝2；機械設備操作及組裝＝2。"},{"id":"P057","exam":"113年度第2梯次","number":7,"question":"七、職場工作需遵守的職業道德與專業倫理，常見有下列項目，包括：(A)平衡個人發\n  展與對公司的忠誠、(B)保護商業秘密，遵守保密協議、(C)兼顧企業的利潤與社會\n  責任、(D)充分告知客戶關於產品的優勢與風險、(E)避免利益衝突，在職業角色中\n  保持公正和誠實。\n  請根據下列（一）～（五）題所描述情境中各當事人的作為，分別回答：（每題 2\n  分，共 10 分）\n    1、每一情境內容有無違反職業道德與專業倫理？\n    2、每一情境內容最可能涉及上述 5 項職業道德與專業倫理的哪 1 項？\n （一）甲君在科技公司擔任工程師，與公司簽訂嚴格的保密協議，目前正在進行\n    一項創新項目。他的好友對這個行業非常感興趣，經常詢問產品開發等協\n    議細節。當好友再次詢問時，甲君告訴好友他會在產品公開後再提供相關\n    細節。\n （二）乙君是一家建築公司的採購經理，她的丈夫經營一家供應建築材料的公\n    司。最近公司要乙君協助選擇新的供應商。乙君告知公司，她丈夫的公司\n    可能成為此次參與遴選的潛在供應商，因此乙君請求公司將自己排除在決\n    策過程之外。\n （三）丙君在一家大型航運公司工作，最近收到了另一家Ｆ公司的聘用邀請，提\n    供了更高的薪資和更好的職位。然而，他所負責的業務正處在關鍵階段，\n    如果他離開可能會對原公司造成嚴重影響。因此，丙君在確保做好過渡安\n    排後，才接受Ｆ公司的新職位。\n （四）丁君是一家金融顧問公司的顧問，她知道某一投資產品有潛在的高風險，\n    但如果推銷成功，她將可以獲得豐厚的獎金。因此，丁君只在客戶詢問\n    時，才提及風險，並未完全坦誠地說明產品投資的風險和回報。\n （五）戊君是一家大型製造業的高階管理者，他了解生產過程中的某種成本節約\n    方法會增加對環境的負擔，但這能顯著提升公司利潤。為儘快滿足股東對\n    利潤的期待，戊君最後決定採用該種成本較為節約的方法。","answer":"依題目正誤：專業倫理應以客戶安全、權益、誠信、保密與履約為核心，不得利用職務私利或未經同意散布資料。"},{"id":"P058","exam":"113年度第2梯次","number":8,"question":"八、Ｇ公司為依法向主管機關申請設立許可的私立就業服務機構，請依據下列描述逐\n 項回答正確之答案：\n （一）Ｇ公司介紹費之收取，應於何時才可收取？（2 分）\n （二）雇主向Ｇ公司請求介紹費之退還，當可歸責於求職人之事由，致聘僱契約\n    終止者，雇主需於聘僱契約生效後幾日內為之？（2 分）\n （三）承上，雇主得請求私立就業服務機構退還多少百分比之介紹費？（2 分）或\n    者免費重行推介幾次？（2 分）\n （四）求職人或雇主已繳付登記費者，除非經推介於聘僱契約生效或求才期限屆\n    滿者，得請求原私立就業服務機構於 6 個月內推介幾次？（2 分）","answer":"（一）介紹費須於聘僱契約生效後始得收取。\n（二）聘僱契約生效後40日內因可歸責於求職人事由終止，雇主得請求免費重行推介一次或退50%介紹費。\n（三）登記費繳付後6個月內得要求推介3次（契約生效或求才期限屆滿者除外）。"},{"id":"P059","exam":"113年度第2梯次","number":9,"question":"九、就業服務或就業促進工作主要是在進行求職者與求才者雙方的適性就業推介與成\n 功媒合過程之專業服務工作。一般常會涉及到「面試」與「會談技巧」2 種專業的\n 議題。請依相關理論概念，回答下列問題：\n （一）一般在求職求才「面試」過程中，求才主試者會因不同情境或狀況而採取\n    不同的方式，包括：(A)一對一、(B)一對多、(C)多對一、(D)多對多、(E)情\n    境模擬等不同方式。請就下述情境搭配前述 5 種面試方式，選擇最適當的 1\n    個答案：（各 1 分，共 4 分）\n   1、主試者 5 人對 1 個求職者進行面談。\n   2、主試者 1 人對 3 個求職者進行面談。\n   3、主試者依據預先設計好的實際工作情形，請求職者進行測試操作。\n   4、主試者 5 人對 3 個求職者進行面談。\n （二）在「就業媒合會談」過程中，求才主試者有時會因參與面談求職者的「就\n    業態度/職業態度」良窳，而決定錄用與否。一般常用的「就業態度/職業態\n    度」相關理論概念，包括：(A)職業自我觀念、(B)職業價值、(C)職業選\n    擇、(D)積極創造性等不同相關理論概念。請就下述情境搭配前述 4 種「就\n    業態度/職業態度」相關理論概念，選擇最適當的 1 個答案：（各 2 分，共 6\n    分）\n   1、求職者在「自己」的工作崗位上，表現主動進取與開發業務的能力。\n   2、基本上，每個人會因為受許多因素的影響，而造成對「工作」的看法與認\n    識而有差異。\n   3、求職者對「自己」人格特質與想要從事的工作，進行概念的釐清與強化。","answer":"（一）C 多對一；B 一對多；E 情境模擬；D 多對多。\n（二）D 積極創造性；A 職業自我觀念；C 職業選擇。"},{"id":"P060","exam":"113年度第2梯次","number":10,"question":"十、Szymanski 和 Hershenson 的職業行為生態模式中，主張有 7 個主要的歷程因素：(A)\n  一致性、(B)決定、(C)發展、(D)社會化、(E)安置、(F)機會、(G)勞動力市場變化，\n  會影響身心障礙者的生涯發展。\n  請根據下列（一）～（五）題情境描述，寫出各題最適合的 1 個歷程因素之英文\n  代碼或名稱。（每題 2 分，共 10 分）\n  （一）甲君從啟智學校畢業後要找工作，碰到 COVID-19 疫情，景氣大受影響，所\n       以很難找到工作。\n  （二）乙君是一位弱視、吃素、虔誠的佛教徒，在其他的條件（如：專業性、待\n       遇及福利等）均相當的情況下，他考慮與自己宗教信仰相契合的佛教氛圍\n       之職場工作。\n  （三）丙君從小腦性麻痺，但他的家庭很支持他，父親是電腦工程師，很專業、\n       敬業，母親是一位很關心學生的國中老師，丙君小時候一直被當為一般人\n       （非障礙者）來教育、照顧，受家庭、社會氛圍的影響很大，丙君後來選\n       擇當電腦工程師，工作時兢兢業業，表現很好。\n  （四）丁君是一位中度的肢體障礙者，在當雕刻學徒的時候，碰到生命中貴人是\n       一位來自國外的業者，發現他的才華，願意栽培他，鼓勵他赴國外接受訓\n       練，並給他工作機會，大大影響他對工作相關的抉擇與工作行為，以及他\n       的一生。\n  （五）戊君是一位很重度的多重障礙者，但是他對電腦軟體設計很有興趣，也很\n       努力，透過職務再設計及職業重建專家的協助與輔導，順利找到合適的工\n       作，讓他擁有自己職涯發展的一片天。","answer":"（一）G 勞動力市場變化。\n（二）A 一致性。\n（三）D 社會化。\n（四）F 機會。\n（五）E 安置。"},{"id":"P061","exam":"113年度第1梯次","number":1,"question":"一、依「就業服務法」第 59 條第 1 項規定：「外國人受聘僱從事第 46 條第 1 項第 8 款\n  至第 11 款規定之工作，有下列情事之一者，經中央主管機關核准，得轉換雇主或\n  工作：一、雇主或被看護者死亡或移民者。二、船舶被扣押、沈沒或修繕而無法\n  繼續作業者。三、雇主關廠、歇業或不依勞動契約給付工作報酬經終止勞動契約\n  者。四、其他不可歸責於受聘僱外國人之事由者。」，勞動部並依「就業服務法」\n  第 59 條第 2 項規定，訂定「外國人受聘僱從事就業服務法第四十六條第一項第八\n  款至第十一款規定工作之轉換雇主或工作程序準則（以下簡稱轉換雇主或工作程\n  序準則）」，請依規定回答下列空格：（每空格 1 分，共 10 分）\n  （一）依「轉換雇主或工作程序準則」第 8 條第 1 項規定，外國人辦理轉換登\n      記，以原從事同一工作類別為限。但有下列情事之一者，不在此限：\n      1、 由具有「轉換雇主或工作程序準則」第 7 條第 1 項第 3 款或第 4 款規定\n        資格之雇主申請接續聘僱。\n      2、 遭受    （1）     、    （2）     、     （3）     或經鑑別為\n        （4）    。（（1）、（2）、（3）答案不限順序）\n      3、 經中央主管機關核准。\n  （二）依「轉換雇主或工作程序準則」第 8 條第 2 項規定，                  （5）     及\n      （6）     視為同一工作類別。（（5）、（6）答案不限順序）\n  （三）依「轉換雇主或工作程序準則」第 11 條第 1 項規定，公立就業服務機構應\n      自原雇主依第 4 條第 2 項規定辦理轉換登記之翌日起                 （7）     日內，\n      依前 2 條規定辦理外國人轉換作業。但外國人有特殊情形經中央主管機關\n      核准者，得延長轉換作業期間             （8）     日，並以       （9）     次為\n      限。\n  （四）依「轉換雇主或工作程序準則」第 11 條第 5 項規定，符合第 1 項但書規定\n      特殊情形之外國人，應於原轉換作業期間屆滿前                     （10）     日內，申\n      請延長轉換作業期間。","answer":"（1）性侵害；（2）性騷擾；（3）暴力毆打；（4）人口販運被害人。\n另題目同工作類別例外：家庭看護工與家庭幫傭視為同一工作類別；轉換登記及期限依當時轉換準則填答。"},{"id":"P062","exam":"113年度第1梯次","number":2,"question":"二、請依照職業訓練法回答下列問題：\n （一）依據職業訓練法第 4 條規定，職業訓練應與哪 3 項措施配合實施？（每項 2\n     分，共 6 分）\n （二）依據職業訓練法第 4 條之 1 規定，推動國民就業所需之職業訓練及技能檢\n     定。依照現況，目前各目的事業主管機關辦理各式各樣的職業訓練課程，\n     應由何機關整合？（2 分）整合的具體內容除了訓練課程外，請任列舉 2 項\n     服務資訊。（每項 1 分，共 2 分）","answer":"依職業訓練法：政府推動職業訓練時，中央主管機關負責協調、整合職能基準、訓練課程、能力鑑定及技能檢定等資訊與資源；題目各空格依法條用語作答。"},{"id":"P063","exam":"113年度第1梯次","number":3,"question":"三、台北市Ａ公司僱用甲君專責於桃園市工作，並負責行銷業務，甲君因Ａ公司未依\n  法給予特休日數，致生勞資爭議，爰提出調解申請，並請求組成勞資爭議調解委\n  員會。請回答以下問題：\n （一）甲君應向哪一縣市主管機關申請調解？（2 分）\n （二）甲君應選定調解委員幾人？（2 分）Ａ公司應選定調解委員幾人？（2 分）\n （三）調解委員會置委員幾人（1 分）或幾人（1 分）？依本題，主席由誰代表擔\n     任？（2 分）","answer":"依勞資爭議處理法：勞務提供地主管機關受理；調解委員會組成與程序依第13～16條；調解委員會通常由主管機關代表及勞資雙方代表依法組成。題目數字依當時條文填答。"},{"id":"P064","exam":"113年度第1梯次","number":4,"question":"四、請依失業中高齡者及高齡者就業促進辦法之規定回答下列問題：\n （一）第 12 條第 1 項規定，第 10 條所定創業貸款，其利息補貼之最高貸款額度\n     為新臺幣多少元？（3 分）所營事業為商業登記法第 5 條規定得免辦理登記\n     之小規模商業，並辦有稅籍登記者，利息補貼之最高貸款額度為新臺幣多\n     少元？（3 分）\n （二）第 12 條第 2 項規定，貸款人貸款日起幾年內之利息，由中央主管機關全額\n     補貼？（2 分）\n （三）第 12 條第 3 項規定，第 10 條第 1 項失業者與 29 歲以下之青年共同創業，\n     貸款日起幾年內之利息，由中央主管機關全額補貼？（2 分）","answer":"依中高齡者及高齡者就業促進法：年齡歧視禁止、申訴及反報復為核心；違反第12條第1項之罰鍰30萬～150萬元；損害賠償請求權2年（最長10年）。"},{"id":"P065","exam":"113年度第1梯次","number":5,"question":"五、Ｂ公司聘僱員工 5 人，其中甲君及乙君 2 人為年滿 18 歲未婚無子女的基層作業人\n  員，係自中華民國 113 年 1 月 1 日開始僱用，且雙方同意以月薪薪資總額為政府\n  規定的基本工資敘薪進用。請依相關勞動法令之規定，回答下列問題：\n  （一）依據勞工保險條例規定，Ｂ公司應該為所聘僱之員工甲君及乙君 2 人，投\n      保的勞工保險普通事故保險之投保薪資是新臺幣多少元？（2 分）每個月政\n      府應該補助甲君及乙君 2 人每 1 人的勞工保險普通事故保險保費是新臺幣\n      多少元？（2 分）\n  （二）依據勞工職業災害保險及保護法規定，甲君及乙君 2 人的勞工職業災害保\n      險費，由誰負擔？（2 分）另，假設未依規定辦理投保、退保手續者，處新\n      臺幣多少元罰鍰？（2 分）\n  （三）依據勞工退休金條例規定，雇主應為甲君及乙君 2 人，按什麼期間提繳退\n      休金？（2 分）","answer":"（一）投保薪資27,470元；每人每月政府補助普通事故保險費302元。\n其餘職災保險及勞退：職災保費原則雇主全額負擔；勞退雇主提繳不得低於月工資6%。"},{"id":"P066","exam":"113年度第1梯次","number":6,"question":"六、目前工作型態很多元，包括：(A)典型全職員工、(B)部分時間工作員工、(C)企業\n  承攬人員、(D)企業派遣工、(E)個人承攬人員。\n  請依據下列各情境描述，依序寫出題號及上述工作型態之英文代碼或名稱 1 個。\n  （每題 2 分，共 10 分）\n  （一）甲君屬於Ｃ公司員工，2024 年全年因任務分派需在Ｄ公司辦公處所全職上\n      下班，Ｃ公司經理會督導甲君出勤及工作執行進度與品質。\n  （二）乙君屬於Ｃ公司員工，因為公司的工作設計，乙君一週工作 5 天，但其中\n      只需 3 天進辦公室，其他時間不限辦公地點，但因任務要求及工作性質，\n      乙君偶爾需要上班日與主管在晚上 6 點至 8 點線上會議。\n  （三）丙君接受某法院甄選委員會評選，決定將丙君列為法院庭訊錄音打字稿整\n      理的派案對象，法院並提供辦公室及電腦供丙君在院內處理打字稿，但留\n      在院內打字並非必要；丙君在經錄用後，透過一個職業工會投保勞健保。\n  （四）丁君是Ｃ公司員工，因先生過年後到海外工作，自己 1 人留在臺灣照顧 2\n      個尚在幼兒園階段的小孩，因此丁君與公司商量過年後，早上上班時間不\n      變但每日下班時間由下午 5 點 30 分提前到 3 點，以方便她接小孩及做家\n      事。\n （五）戊君屬於Ｄ公司員工，因為Ｃ公司新增一個職務，戊君被派到Ｃ公司執行\n     這個職務的工作，出勤及工作內容由Ｃ公司部門主管指揮和督導。","answer":"（一）C 企業承攬人員。\n（二）A 典型全職員工。\n（三）E 個人承攬人員。\n（四）B 部分時間工作員工。\n（五）D 企業派遣工。"},{"id":"P067","exam":"113年度第1梯次","number":7,"question":"七、對專業人員而言，職業道德與專業倫理是必要的、不可或缺的，在「以公司與客\n 戶為優先的最大利益考量」下，請依每題敘述，分別寫出正確的題號及錯誤的題\n 號。（共 10 分）\n  1、 選擇工時較長、獲利較多的方法服務客戶。\n  2、 服務時首先考慮公司的利益，然後再考量顧客權益。\n  3、 利用雇主的機具設備私自接單生產。\n  4、 當發現公司的產品可能會對顧客身體產生危害時，立即向主管或有關單位報\n   告。\n  5、 服務顧客時應選擇最安全、經濟及有效的方法完成工作。\n  6、 未經顧客同意，任意散佈或利用顧客資料。\n  7、 從事專業性工作，在與客戶約定時間應保持彈性，任意調整。\n  8、 未經雇主同意，於上班時間從事私人事務。\n  9、 上班遲到，應該親自打電話給主管，說明請假理由，並指定工作代理人。\n 10、 盡力維護雇主及客戶的權益。","answer":"錯誤：1、2、3、6、7、8；正確：4、5、9、10。"},{"id":"P068","exam":"113年度第1梯次","number":8,"question":"八、為了協助求職者或在職者排除職場障礙，勞動部推動職務再設計措施，鼓勵事業\n 單位運用該措施來協助員工穩定就業，同時也提供申請單位（者）最高新臺幣 10\n 萬元補助。針對這個重要的社會資源，請回答以下問題：\n （一）請寫出勞動部針對身心障礙者與中高齡者及高齡者推動職務再設計措施，\n     所依據的 2 種「法律」名稱為何？（每種 2 分，共 4 分）\n （二）針對身心障礙者推動職務再設計所進行協助的措施項目，請列舉 3 項且至\n     多列舉 3 項。（每項 2 分，共 6 分）","answer":"（一）身心障礙者權益保障法、中高齡者及高齡者就業促進法。\n（二）可列：改善工作設備或機具、調整工作方法、改善職場工作環境（題目要求3項）。"},{"id":"P069","exam":"113年度第1梯次","number":9,"question":"九、甲君看到Ｅ公司招募美白防皺精華霜業務員，底薪為基本工資，但業績獎金無上\n 限，在應徵過程碰到下列 5 個情況：\n 情況 1： 經過 3 份筆試之後，Ｅ公司宣布 100 位應徵者之中有 90 人通過第一階段\n      甄選，但沒有公布每個人的各份筆試之評分。\n 情況 2： Ｅ公司要求通過第一階段的人購買 1 罐 20,000 元（高於一般行情）的美\n      白防皺精華霜，並參與為期 1 週的第二階段培訓。\n 情況 3： Ｅ公司在第二階段培訓結束時宣布錄取其中的 80 人，並宣布第三階段甄\n      選任務是要在 1 週內銷售出 1 罐美白防皺精華霜，以及召募 1 位新人來應\n      徵這個業務員職位。Ｅ公司說明正式錄用之後，每銷售 1 罐產品獎金僅有\n      100 元（低於一般行情），但每邀 1 位新人成為業務員之獎金高達 20,000\n      元，累積這 2 種業績獎金總額未超過基本薪資時以基本薪資給付、超過基\n      本薪資的部份業績獎金加倍給付。\n 情況 4： Ｅ公司在 2 週後宣布正式錄取完成任務的 20 人，並要求他們在 2 週後報\n      到並遞交 1 份一般勞工體檢報告。\n 情況 5： Ｅ公司要求被錄取者留下含括國民身分證在內的雙證件、金融機構存摺及\n      其密碼，並承諾將於他們報到時歸還所有證件。\n 請逐一判斷上述各情況具有下列哪一種屬性：（請依序寫出情況編號及其屬性之英\n 文代碼，每情況 2 分，共 10 分）\n A、違反就業服務法第 5 條第 2 項第 2 款至第 6 款規定之不當招募或僱用。\n B、違反就業服務法第 5 條第 2 項第 1 款或疑似不實或不法的求職陷阱。\n C、正當合法的招募或僱用。","answer":"情況1：C。情況2：B。情況3：B。情況4：C。情況5：A。"},{"id":"P070","exam":"113年度第1梯次","number":10,"question":"十、良好的職場溝通能夠促進團隊合作、提高工作效率，並減少誤解和衝突。美國心\n 理治療師薩提爾（Satir）提出 5 種常見溝通姿態，協助人們覺察與理解每個人的外\n 在行為如何反映內在心理。請依上列敘述及下列各問題情境描述，自下表所列溝\n 通類型，依序寫出題號及其最適合之溝通類型英文代碼或名稱 1 個。\n                                （每題 2 分，\n 共 10 分）\n                  溝通類型\n    A、討好型        B、指責型            C、超理性型\n    D、冰山型        E、一致型            F、打岔型\n（一）甲君重視職場情境而且在乎他人，但卻忽略自己，很害怕被拒絕，就算有\n  自己的想法或意見，也不太敢表達。遇到與同事有不同的工作觀點，通常\n  選擇讓步或配合。即使同事有不合理要求，也常回答「好」或「沒關係」。\n（二）乙君總是理性分析，與人應對時，很重視當下的職場情境，卻忽略自己與\n  他人的感受，為避免讓自己的情緒過於高漲，常表現出一種不帶感情的冷\n  靜，常會說：「沒什麼感覺」、「哎呦，想太多」。\n（三）丙君在職場的應對方面，容易忽略自己與當下的互動情境，尤其跟他討論\n  工作上遇到的問題時，會讓人感覺到他並不想面對問題，反而會選擇轉移\n  話題，說出與當下無關的事情，要與他討論，常會說：「我有急事得走了，\n  先這樣」、「好啦，別說了」。\n（四）丁君在工作團隊中，像個權威者，習慣使用否定、命令來溝通。在乎情境\n  也重視自己，卻常忽略別人的想法，甚至會批評、評斷別人的錯誤，很容\n  易脫口說出：「你不懂啦」、「怎麼連這麼簡單的，你也不會」。\n（五）戊君能觀察別人的狀況及兼顧身處的情境，也會「反求諸己」遇到工作上\n  的不同意見，不僅能把內在感受，以平穩、誠懇的姿態如實說出來，同時\n  也願意傾聽及關注他人。","answer":"（一）A 討好型。\n（二）C 超理性型。\n（三）F 打岔型。\n（四）B 指責型。\n（五）E 一致型。"},{"id":"P071","exam":"112年度第3梯次","number":1,"question":"一、依「外國人從事就業服務法第四十六條第一項第八款至第十一款工作資格及審查標\n 準（以下簡稱審查標準）」第 2 條規定：\n                    「外國人受聘僱從事本法第 46 條第 1 項第 8\n 款至第 11 款規定之工作，其資格應符合本標準規定。」請依規定回答下列問題：\n （一）依審查標準第 8 條第 1 項規定，外國人受聘僱從事就業服務法第 46 條第 1\n     項第 9 款規定之家庭幫傭及看護工作，其年齡須為幾歲以上？（2 分）\n （二）依審查標準第 8 條第 1 項規定，從事家庭幫傭或家庭看護工作之外國人，入\n     國時應於中央主管機關指定地點，接受幾小時以上之講習？（2 分）但曾於\n     幾年內完成講習者，免予參加？（2 分）\n （三）依審查標準第 9 條規定，雇主申請聘僱外國人從事製造工作或中階技術製造\n     工作，其所聘僱就業服務法第 46 條第 1 項第 1 款及第 8 款至第 11 款規定工\n     作總人數，不得超過雇主申請當月前 2 個月之前 1 年僱用員工平均人數之百\n     分之多少？（2 分）\n （四）依審查標準第 63 條規定，外國人受聘僱從事審查標準第 6 條第 3 款第 3 目之\n    中階技術家庭看護工作，其每月總薪資不得低於審查標準附表十三之一所定\n    新臺幣多少元之薪資基本數額？（2 分）","answer":"（一）家庭幫傭及看護工作外國人須20歲以上。\n其餘各子題依當時審查標準之工作資格、薪資基本數額及聘僱比例作答；中階技術家庭看護工作薪資基本數額依題目所引附表十三之一。"},{"id":"P072","exam":"112年度第3梯次","number":2,"question":"二、請依照職業訓練法及授權所定之法規命令，回答下列問題：\n  （一）職業訓練之實施，除技術生訓練、進修訓練外，還有哪 2 項實施方式？（各\n     2 分，共 4 分）\n  （二）依據職業訓練法施行細則規定，事業機構辦理技術生訓練，屬未辦技能檢定\n     之職類，應由具有幾年以上相關工作經驗之技術熟練人員擔任技術訓練及輔\n     導工作？（2 分）\n     （三）依據職業訓練機構設立及管理辦法規定，企業欲申請為職業訓練機構，辦理\n        電腦軟體應用單一職類進修訓練，訓練容量為 40 人，其專用教室面積不得\n        少於多少平方公尺？（2 分）按其訓練容量至少需有職業訓練師幾人？（2\n        分）","answer":"（一）養成訓練、轉業訓練。\n（二）5年以上相關工作經驗。\n（三）單一職類進修訓練容量40人：專用教室面積依規定至少80平方公尺；職業訓練師配置依當時管理辦法之訓練容量標準。"},{"id":"P073","exam":"112年度第3梯次","number":3,"question":"三、\n  （一）依個人資料保護法第 20 條規定，請回答下列內容是否正確？\n      1． 依該條第 1 項規定，非公務機關對個人資料之利用，除第 6 條第 1 項所規定\n        資料外，應於蒐集之特定目的必要範圍內為之。（2 分）\n      2． 依該條第２項規定，非公務機關依前項規定利用個人資料行銷者，當事人表\n        示拒絕接受行銷時，仍可繼續利用其個人資料行銷。（2 分）\n     （二）依個人資料保護法第 21 條規定，非公務機關為國際傳輸個人資料，而有下\n        列情形之一者，中央目的事業主管機關得限制之，下列何者是錯的？（單選\n        題，3 分）\n        (Ａ)未涉及國家重大利益。\n        (Ｂ)國際條約或協定有特別規定。\n        (Ｃ)接受國對於個人資料之保護未有完善之法規，致有損當事人權益之虞。\n        (Ｄ)以迂迴方法向第三國（地區）傳輸個人資料規避本法。\n     （三）下列何者不是個人資料保護法第 6 條規定之特種個人資料？（單選題，3 分）\n        (Ａ)基因資料、(Ｂ)醫療資料、(Ｃ)個人學歷、(Ｄ)健康檢查。","answer":"依個資法題：非公務機關利用個資原則應在蒐集特定目的必要範圍；國際傳輸限制題不屬限制事由者為A「未涉及國家重大利益」；特種個資中「個人學歷」不是第6條特種個資。"},{"id":"P074","exam":"112年度第3梯次","number":4,"question":"四、Ａ派遣公司聘僱甲君於Ｂ要派公司工作，請依勞動基準法之規定回答下列工資給付\n 之相關問題：\n （一）工資由勞雇雙方議定為基本工資，請問甲君係與何公司議定工資？（2 分）\n  （二）承上，目前基本工資係由中央主管機關設基本工資審議委員會擬訂後，報請\n      何機關核定之？（2 分）\n  （三）工資之給付，除當事人有特別約定或按月預付者外，每月至少定期發給多少\n      次？（3 分）\n  （四）Ａ派遣公司如積欠甲君工資，經主管機關處罰或依勞動基準法第 27 條規定\n      限期令其給付而屆期未給付者，甲君得請求Ｂ要派公司給付。Ｂ要派公司應\n      自甲君請求之日起多少日內給付之？（3 分）","answer":"依勞基法題：工資、工時、休假與契約終止等各子題依題目所引條文作答；遇預告終止時依年資10／20／30日計算。"},{"id":"P075","exam":"112年度第3梯次","number":5,"question":"五、新北市Ａ公司僱用員工（均為不定期契約）有 150 人，因Ｂ公司併購，致發生全數\n  解僱勞工之情事。請回答下列問題：\n  （一）Ａ公司全數解僱勞工屬於大量解僱勞工保護法的大量解僱情形，是因符合該\n      法第 2 條第 1 項第 2 款規定，於同一廠場僱用之勞工，於幾日內解僱勞工？\n      （2 分）逾所僱用勞工人數 1/3 或單日逾多少人？（2 分）\n  （二）Ａ公司提出解僱計畫書之日起幾日內，勞雇雙方應即本於勞資自治精神進行\n      協商？（2 分）\n  （三）Ａ公司員工因特別休假等相關事宜與公司發生勞資爭議，向新北市政府勞工\n      局申請調解委員會調解，依據勞資爭議處理法第 15 條規定，新北市政府勞\n      工局應於調解委員完成選定或指定之日起幾日內，組成調解委員會並召開調\n      解會議？（2 分）\n  （四）調解委員會應於收到調查結果及解決方案後幾日內開會？（2 分）","answer":"大量解僱：提出解僱計畫書後10日內勞雇協商；無法達成時主管機關10日內召集協商委員會。勞資爭議：調解委員完成選定或指定後14日內組成並召開；收到調查結果及方案後15日內開會。"},{"id":"P076","exam":"112年度第3梯次","number":6,"question":"六、某公立就業服務中心統計 112 年 7 月份的各項就業市場資訊如下：\n  1．求職人數（含 7 月份新登記求職人數及有效期限內已登記尚未介紹就業者）為\n    15,000 人。\n  2．求才人數（含 7 月份新登記求才人數及有效期限內已登記尚未填補空缺者）為\n    9,000 人。\n 3．求職推介就業人數為 6,000 人。\n  4．求才僱用人數為 4,500 人。\n  請根據上述 1～4 的數據，分別回答（一）～（四）：\n  （一）請計算此公立就業服務中心的求供倍數為何？（２分）\n  （二）勞動力市場平衡時求供倍數＝１；當經濟受到通膨影響而出口不佳，導致勞\n      動力市場不平衡，因此求供倍數的比值為何？（２分）\n  （三）請計算此公立就業服務中心的求才利用率為何？（3 分）\n  （四）請計算此公立就業服務中心的求職就業率為何？（3 分）","answer":"（一）求供倍數0.6。\n（二）小於1。\n（三）求才利用率0.5。\n（四）求職就業率0.4。"},{"id":"P077","exam":"112年度第3梯次","number":7,"question":"七、\n  （一）「工作倫理」與「職業道德」二個概念，皆為職業活動進行過程所強調的約\n      束機制。企業較常將上述哪一個概念轉化為勞雇契約，作為勞雇雙方遵守的\n      義務？（2 分）\n  （二）甲君擔任Ｃ公司的食品包裝設計師。設計過程中，Ｃ公司要求甲君採用某知\n      名網站的設計元素，同時在包裝上聲稱食品具有醫療效果，以提高銷售量。\n      甲君未經授權使用以及沒有相關證據支持食品好處的情況下，配合Ｃ公司所\n      有要求。此一做法，涉及下列哪二種不道德行為？（各 3 分，共 6 分）\n      (Ａ)侵犯版權、(Ｂ)虛假宣傳、(Ｃ)非法製藥、(Ｄ)賄賂、(Ｅ)期約。\n  （三）乙君為某企業員工，因為睡過頭，導致上班遲到。從敬業態度來看，乙君選\n      擇下列哪一種做法最為恰當？（2 分）\n      (Ａ)善用科技工具，以 LINE 傳送訊息至工作小組。\n      (Ｂ)親自向直屬主管報告，說明原因並依規定辦理請假。\n      (Ｃ)應用人際關係，請要好的同事向主管轉達。","answer":"依題目職業倫理各情境判斷，核心為誠信、顧客最大利益、安全、保密、依法執行與不得圖利自己。"},{"id":"P078","exam":"112年度第3梯次","number":8,"question":"八、面試時可提供職場面試官很多的資訊，以選用最適當的人才，因此面試一開始、進\n 行中、結束時、結束後等流程的掌握，對面試官取得應徵者資訊而言極為重要。請\n 回答下列問題：\n （一）下列(Ａ)～(Ｈ)哪 2 項是面試進行中的重要內涵？（各 3 分，共 6 分）\n （二）下列(Ａ)～(Ｈ)哪 2 項是面試結束時的重要內涵？（各 2 分，共 4 分）\n (Ａ)簡介組織與應徵的職務。\n (Ｂ)對應徵者表達由衷的謝意。\n (Ｃ)審慎澄清並評估各項來自應徵者的資訊。\n (Ｄ)立刻填寫相關面試的評估表。\n (Ｅ)決定僱用人選。\n (Ｆ)寒暄並歡迎應徵者，閒話家常，讓應徵者感到輕鬆自在。\n (Ｇ)再次確定是否有任何訊息遺漏，並鼓勵應徵者發問。\n (Ｈ)依實際工作需要，詢問應徵者各項相關問題。","answer":"（一）面試進行中：C、H。\n（二）面試結束：B、G。（依面試流程：進行中澄清評估資訊與詢問職務相關問題；結束時致謝、確認遺漏並讓應徵者發問。）"},{"id":"P079","exam":"112年度第3梯次","number":9,"question":"九、\n  （一）甲君為了解自己尋找工作的方向，透過公立就業服務機構就業服務諮詢人員\n     的協助，進行工作氣質測驗（個人工作態度問卷）及何倫碼（Holland Code）\n     興趣測驗的施測，2 種測驗施測結果如下：\n     1．在工作氣質測驗（個人工作態度問卷）方面的氣質類型，包括：(1).影響\n      力大、(2).親和性大、(3).表達力強等三種類型。\n     2．在何倫碼（Holland Code）興趣測驗方面的人格傾向類型，包括：(1).溫暖\n      助人、(2).進取的等二種類型。\n     請就下列的工作類型，回答公立就業服務機構就業服務諮詢人員，得依據前\n     述 2 種測驗施測結果，為甲君提供最適合考慮尋找的 4 種工作類型之建議：\n      （各 2 分，共 8 分）\n      (Ａ)推銷員、(Ｂ)廣告文案員、(Ｃ)警衛、(Ｄ)工程師、(Ｅ)機械繪圖員、(Ｆ)\n      包裝工、(Ｇ)複印員、(Ｈ)教師、(Ｉ)軍人、(Ｊ)旅館接待員。\n      （回答時，請寫出最合適的答案或代碼。）\n  （二）公立就業服務機構就業服務諮詢人員也建議甲君能夠思考調整自己的人格特\n      質，以符合工作職場所需要的人格特質。依據公立就業服務機構就業服務諮\n      詢人員建議的人格特質：\n    1．是精神分析學派學者佛洛伊德（Freud）所強調的哪一個人格結構？（1 分）\n    2．是溝通分析治療學派學者伯尼（Eric Berne）所強調的哪一個人格結構？（1\n      分）","answer":"（一）A、C、H、J。\n（二）1.自我；2.成人自我。"},{"id":"P080","exam":"112年度第3梯次","number":10,"question":"十、Salovey 與 Mayer（1990）首先提出「情緒智力」一詞，隨後，高夫曼（Goleman）\n  在情緒智力〔Emotional Intelligence〕一書中指出，情緒智力包含下列 5 項能力元素：\n  (Ａ)自我情緒覺察：精準覺察自己的情緒。\n  (Ｂ)自我情緒管理：積極、適當地控制和表達自我情緒。\n  (Ｃ)自我激勵行為：善用情緒來達成自我激勵、自我驅動，以專注投入、完成目標。\n  (Ｄ)同理他人情緒：敏銳地感受到他人的需求和欲望，辨別他人的情緒。\n  (Ｅ)處理人際關係：靈活因應、調節、管理他人情緒，以維持良好人際關係。\n  下列（一）～（五）題所描述的甲君行為，分別反應出上面哪個情緒智力的能力元\n  素？請依題號順序寫出正確的情緒智力能力元素或英文代碼。\n                            （10 分，每小題 2 分）\n  甲君 6 月剛從高中畢業，7 月經媒合前往飲料店擔任正職人員，2 天後他回來就業\n  服務站要求換工作，抱怨「那地方太恐怖了，生意好到都沒休息時間，不但要幫客\n  人點餐，還要提早去備料，飲料桶重的要命，關店後還要點收、關帳，差一毛都不\n  行！」\n（一）就業服務人員問：「你在那樣的忙碌中，感覺如何？」\n   甲君說：「第一天蠻興奮的，鬥志滿滿，第二天就悲劇了，我不小心多放了\n   一包茶，那個店長就整天挑我毛病，害我好緊張。」\n（二）就業服務人員問：「你當時怎麼反應？」\n   甲君說：「當然只能化緊張為謹慎啦！加倍集中精神，做好每個細節。」\n（三）就業服務人員說：「你真了不起，第一次出社會工作，就懂得怎麼應付這種\n   情況！」\n   甲君說：\n      「有嗎？我倒是覺得店長很可憐，差 10 分鐘就要開賣了，出了差錯\n   他會被上面罰！難怪他會那麼緊張。」\n（四）就業服務人員說：「你很難得，自己不好受時，還能想到店長的難處。」\n   甲君說：「還好啦！那我明天去跟店長說，很抱歉給他造成這麼大的災難，\n   謝謝他幫我善後！」\n（五）就業服務人員說：「我猜店長會接受你的道歉。」\n   甲君說：「其實，我昨天就想跟他道歉，只是太害怕了，才會躲著他。我明\n   天一定要克服自己的害怕，誠心跟他道歉。」","answer":"（一）A 自我情緒覺察。\n（二）C 自我激勵行為。\n（三）D 同理他人情緒。\n（四）E 處理人際關係。\n（五）B 自我情緒管理。"},{"id":"P081","exam":"112年度第2梯次","number":1,"question":"一、依「外國人從事就業服務法第四十六條第一項第一款至第六款工作資格及審查標準\n  （以下簡稱審查標準）」第 2 條第 1 項規定：「外國人受聘僱從事本法第 46 條第 1\n  項第 1 款、第 2 款、第 4 款至第 6 款規定之工作，其工作資格應符合本標準規定。」\n  請依規定回答下列問題：\n  （一）依審查標準第 2 條第 2 項規定，外國人受聘僱從事就業服務法第 46 條第 1\n     項第 3 款規定之學校教師工作，其工作資格應符合何機關？（2 分）訂定之\n     何辦法規定？（2 分）\n  （二）依審查標準第 5 條規定，外國人受聘僱從事第 4 條規定之專門性或技術性工\n     作，除符合審查標準其他規定外，仍應符合 4 款資格之一，請回答下列各款\n     資格規定之內容是否正確？\n   1． 外國人應依專門職業及技術人員考試法規定取得證書或執業資格？（1 分）\n   2． 外國人應取得國內外大學相關系所之博士以上學位者，或取得相關系所之學\n     士學位而有 2 年以上相關工作經驗？（1 分）\n   3． 外國人應服務跨國企業滿 2 年以上經指派來我國任職？（1 分）\n   4． 外國人應經專業訓練，或自力學習，有 6 年以上相關經驗，而有創見及特殊\n     表現？（1 分）\n  （三）依審查標準第 5 條之 1 規定，外國留學生、僑生或其他華裔學生具有在我國\n     大學畢業，取得學士以上學位，或具有在我國大專校院畢業，取得製造、營\n     造、農業、長期照顧或電子商務等相關科系之副學士學位，除符合審查標準\n     其他規定外，依審查標準附表計算之累計點數應滿幾點，即得受聘僱從事審\n     查標準第 4 條之專門性或技術性工作，且不受審查標準第 5 條規定之限制？\n     （2 分）","answer":"（一）教育部；「各級學校申請外國教師聘僱許可及管理辦法」。\n（二）1正確；2錯誤；3錯誤；4錯誤。\n（三）專門性或技術性工作資格點數制門檻：70點。"},{"id":"P082","exam":"112年度第2梯次","number":2,"question":"二、甲君為持工作簽證及聘僱許可在我國從事律師工作已多年之外國人，於 112 年 10\n  月 10 日取得移民署之永久居留許可，請回答下列問題：\n  （一）甲君與雇主（即律師事務所）於 111 年 10 月 10 日合意終止聘僱契約，甲君\n     想繼續在我國從事律師工作，請問律師工作是否為外國專業人才延攬及僱用\n     法規定之專業工作？（2 分）\n  （二）承上，其他雇主為甲君申請聘僱許可從事律師工作，應依外國專業人才延攬\n     及僱用法與就業服務法申請，請問是否正確？（3 分）\n  （三）甲君原聘僱許可於 112 年 12 月 12 日到期，雇主如擬與甲君續約從事律師工\n     作，依外國專業人才延攬及僱用法第 7 條規定，請問下列何者正確？(Ａ)應\n     由雇主為甲君申請許可、(Ｂ)甲君自己申請許可、(Ｃ)不須申請許可，即可在\n     我國從事律師工作。（5 分）","answer":"（一）是，律師屬外國專業人才延攬及僱用法之專業工作。\n（二）參考解題：否（該題語意有爭議，公開解析亦特別註明）。\n（三）C：取得永久居留後，依題目所引外專法規定不須再申請工作許可即可在臺從事專業工作。"},{"id":"P083","exam":"112年度第2梯次","number":3,"question":"三、Ａ企業（事業機構）目前僱用若干位中高齡及高齡員工，因人力短缺有增加僱用員\n  工需要，欲依照中高齡者及高齡者就業促進法、職業訓練法授權所定之法規命令向\n  政府申請補助，請回答下列問題：\n  （一）Ａ企業指派所僱用之中高齡者及高齡者參加國內訓練單位公開招訓之訓練\n     課程，得申請訓練費用最高百分之多少之補助？（2 分）企業每年補助總額\n     上限為新臺幣多少元？（2 分）\n  （二）Ａ企業增僱領有僱用獎助推介卡之 1 位全時高齡者及 2 位全時中高齡者連續\n     滿 30 日，依規定Ａ企業僱用前述 3 位，每個月合計可獲得新臺幣多少元之\n     僱用獎助？（2 分）\n  （三）Ａ企業如僱用 6 名依法退休之高齡者（非雇主配偶或三親等以內親屬），傳\n     承其專業技術及經驗，當年度最高可獲得新臺幣多少元之補助？（2 分）\n  （四）依據技術士技能檢定及發證辦法第 21 條規定：Ａ企業申請為技能檢定術科\n     測試場地及機具設備評鑑之單位，除經中央主管機關專案核定者外，應符合\n     其所營事業與申請評鑑職類相關，且登記資本額在新臺幣多少元以上？（1\n     分）或僱用員工人數達多少人以上？（1 分）","answer":"（一）訓練費最高70%；企業每年補助總額上限30萬元。\n（二）全時僱用1位高齡者＋2位中高齡者，每月合計41,000元。\n（三）僱用退休高齡者傳承專業技術經驗之補助，依當時規定及6名人數計算。\n（四）術科測試場評鑑：登記資本額1,500萬元以上，或僱用員工100人以上。"},{"id":"P084","exam":"112年度第2梯次","number":4,"question":"四、甲君畢業後透過公立就業服務機構之推介，媒合至Ｂ公司工作，請依勞工退休金條\n  例之規定回答下列問題：\n  （一）Ｂ公司於甲君到職之日起幾日內，需列表通知勞動部勞工保險局，辦理開始\n       提繳勞工退休金？（4 分）\n  （二）Ｂ公司依規定應為甲君負擔提繳之退休金，不得低於甲君每月工資百分之多\n       少？（2 分）\n  （三）承上，Ｂ公司如未按時提繳或繳足退休金者，自期限屆滿之次日起至完繳前\n       1 日止，每逾 1 日加徵其應提繳金額百分之多少滯納金至應提繳金額之 1 倍\n       為止？（4 分）","answer":"（一）到職日起7日內。\n（二）不得低於每月工資6%。\n（三）每逾1日加徵3%滯納金，至應提繳金額1倍為止。"},{"id":"P085","exam":"112年度第2梯次","number":5,"question":"五、甲君任職於臺北市Ｃ公司，上班時間遭受同事性騷擾，甲君向Ｃ公司反映，Ｃ公司\n  未採取立即有效之補救措施，致甲君遭受損害；另甲君的太太懷孕生產，甲君向Ｃ\n  公司申請陪產檢及陪產假，Ｃ公司僅同意給甲君 3 日陪產檢及陪產假。請問以下問\n  題：\n  （一）甲君知有損害及賠償義務人時起，幾年間不行使損害賠償請求權而消滅？（2\n       分）\n  （二）甲君知有性騷擾行為時起，逾幾年不行使損害賠償請求權而消滅？（2 分）\n  （三）甲君發現Ｃ公司違反性別工作平等法陪產檢及陪產假規定，得向哪個機關申\n       訴？（2 分）又該機關應於接獲申訴後幾日內展開調查？（2 分）\n  （四）承上，若甲君向勞動部提出申訴，勞動部應於收受申訴案件之日起幾日內移\n       送前項機關？（2 分）","answer":"（一）2年。\n（二）知有性騷擾行為時起逾10年（本題依當時法條時點；另有自知損害及賠償義務人起2年規定，應依原題精確區分）。\n（三）向臺北市政府申訴；接獲申訴後7日內展開調查。\n（四）勞動部收受後7日內移送地方主管機關。"},{"id":"P086","exam":"112年度第2梯次","number":6,"question":"六、行政院主計總處為了解國人就業與失業狀況，以及蒐集臺灣地區人力供應資料，每\n  個月動用各直轄市縣市基層調查員近 700 人，向被抽選到的樣本住戶 2.1 萬戶辦理\n  「人力資源調查」\n         。依據該總處調查 112 年 3 月臺灣地區 15 歲以上民間人口為 2,013\n  萬 2 千人，勞動力約為 1,191 萬 9 千人，就業人數約為 1,149 萬 4 千人，失業人數約\n  為 42 萬 4 千人，請依據該總處 112 年 3 月「人力資源調查」結果回答下列問題：\n  （一）依據調查結果就業者按各「行業」就業人數分別是：(Ａ) 4,042 千人、(Ｂ) 520\n       千人、(Ｃ) 6,932 千人等數據；請就專業與實務判斷，上述 3 個數據，分別是\n     下述哪一個行業之該月數據？1．「工業」、2．「農、林、漁、牧業」、3．\n     「服務業」？（可用英文字母或統計數據配對回答，共 3 分）\n  （二）依據調查結果就業者按各「職業」就業人數分別是：(Ｄ) 3,432 千人、(Ｅ) 356\n     千人、(Ｆ) 461 千人等數據；請就專業與實務判斷，上述 3 個數據，分別是\n     下述哪一個職業之該月數據？1．「技藝有關工作人員、機械設備操作及勞\n     力工」、2．「民意代表、主管及經理人員」、3．「農、林、漁、牧生產人\n     員」？（可用英文字母或統計數據配對回答，共 3 分）\n  （三）依據該總處「就業失業統計常用統計指標概念」中，所謂「就業者或失業者」，\n     是指在資料標準週內，年齡滿 15 歲，而且符合所定情形之一的人。請回答：\n     上述之「資料標準週」，是指每個月的哪一日（含此一日）的那一週內？（1\n     分）又所謂「就業者」，是指年齡滿 15 歲，而且符合所定的哪 3 種情形之\n     一的人？（3 分）","answer":"（一）工業＝A；農林漁牧業＝B；服務業＝C。\n（二）技藝有關／機械設備操作及勞力工＝D；民意代表、主管及經理人員＝E；農林漁牧生產人員＝F。\n其餘：人力資源調查之資料週通常以每月含15日的一週為參考週；就業者定義依主計總處調查定義。"},{"id":"P087","exam":"112年度第2梯次","number":7,"question":"七、身心障礙者求職或諮詢相關服務，通常會依需求向公立就業服務機構、身心障礙者\n  職業重建機構，或社政相關機構尋求如後的服務：(Ａ)庇護性就業服務、(Ｂ)大專青\n  年學生公部門暑期工讀服務、(Ｃ)居家就業服務、(Ｄ)社區式日間作業服務措施、(Ｅ)\n  一般性就業服務、(Ｆ)中高齡者及高齡者就業服務。\n  請依據下列題目，寫出上述服務之英文代碼。\n  （一）請寫出 3 項身心障礙者職業重建機構有提供的服務。（6 分）\n  （二）請寫出 2 項公立就業服務機構有提供的服務。（4 分）","answer":"（一）身心障礙者職業重建機構：A庇護性就業、C居家就業、D社區式日間作業服務措施（依題目機構範圍）。\n（二）公立就業服務機構：E一般性就業服務、F中高齡者及高齡者就業服務。"},{"id":"P088","exam":"112年度第2梯次","number":8,"question":"八、甲君從高一開始就靠飲料店打工養活自己並完成高職餐飲科學業。他高職畢業後的\n  第一個工作是小吃店的廚師，甲君覺得工作環境狹小悶熱、薪水少、升遷無望，領\n  到第一個月薪水就辭職了。沒想到接下來三個月應徵了十幾個工作都沒被錄取。甲\n  君希望就業諮詢人員幫他找到比較好的工作。\n  一般就業諮詢人員所應用的諮詢技巧或策略，包括下列基本會談技巧、敘事取向生\n  涯諮商技巧等：\n  (Ａ)專注，或傾聽。(Ｂ)同理，或情感反映。(Ｃ)鼓勵，或支持。(Ｄ)面質，或挑戰。\n  (Ｅ)建議，或忠告。(Ｆ)解釋。(Ｇ)立即性。(Ｈ)保持樂觀的態度。(Ｉ)保持開放的態\n  度。(Ｊ)創造性思考。(Ｋ)歸納性思考。(Ｌ)閃亮時刻的問話。(Ｍ)辨認行為模式。(Ｎ)\n  擬定行動計畫。(Ｏ)評估行動成效。\n  請回答就業諮詢人員在對話中所使用的是上列哪個諮詢技巧或策略？回答時，請標\n  出題號與最合適的一個答案的英文代碼。（10 分，每小題 2 分）\n  （一）對話 1：甲君說：「我從小就喜歡看 YouTuber 的廚師做菜，廚師很優雅，做\n          出來的菜就是高級，小吃店那個根本不叫廚房，做的菜也上不了臺\n          面！」\n          就業諮詢人員說：「你很清楚自己喜歡什麼，你的渴望可以成為你\n          的力量！」\n  （二）對話 2：甲君說：「可是沒用啊，附近幾個縣市的大飯店我都投了，可是他\n          們都沒回，我親自跑去問，他們也都懶得聽，直接拒絕我。實在是，\n          齁！」\n          就業諮詢人員說：「一再被拒絕，你很著急！」\n  （三）對話 3：甲君說：「對呀，怎麼辦？」\n          就業諮詢人員說：「知己知彼，百戰百勝。你可以先上網去蒐集資\n          料，看大飯店廚師有什麼條件、有什麼本事。」\n  （四）對話 4：甲君說：「哇，他們好厲害，不但有乙級證照，還有國際證照！可\n          是我沒錢沒時間去學，我得工作才能生活。」\n          就業諮詢人員說：「職訓機構有一些訓練機會和津貼，你可以怎樣\n          運用這些資源來實現夢想呢？」\n  （五）對話 5：甲君說：「成為大飯店廚師的路好遙遠喔！我真的走得到嗎？」\n          就業諮詢人員說：「別人讀高中時，都還靠家裡養，你卻能夠靠自\n          己工作養活自己！說說看你當時怎麼做到的？」","answer":"依題目五段對話：C（鼓勵／支持）、B（同理／情感反映）、E（建議／忠告）、N（擬定行動計畫）、L（閃亮時刻問話）。"},{"id":"P089","exam":"112年度第2梯次","number":9,"question":"九、一般公司在進用員工時，常會透過職業心理測驗的施測結果，確定是否僱用員工之\n  依據。而影響一般受測者在職業心理測驗結果正確性的主要因素，包括：(Ａ)受測\n  者的心理狀態、(Ｂ)測驗的效度、(Ｃ)測驗的信度、(Ｄ)測驗的常模、(Ｅ)測驗環境\n  的影響、(Ｆ)受測者的背景經歷、(Ｇ)解釋分析者的知識與經驗。\n  請根據下列各情境描述，依序寫出題號以及每題最可能反映的上述影響因素之英文\n  代碼或名稱一個。（10 分，每小題 2 分）\n  （一）由於天氣炎熱，在施測時特別為受測者安排一個通風、安靜且舒適的空間，\n     進行職業心理測驗施測。\n  （二）受測者具大學畢業文憑，因長期在外國生活，對所實施測驗內容的中文字句\n     較難理解，需要更多時間進行測驗填答。\n  （三）受測者做測驗時，情緒起伏很大，擔心自己的測驗分數表現太低，無法獲得\n     聘用。\n  （四）三週後，使用同一份職業心理測驗，通知進入第二次面談的受測者再做一次\n     測驗。經查這些受測者在此期間的經驗並無太大變化，而其前後二次的測驗\n     分數，得到幾乎一樣的計分結果。\n  （五）以過去三年受測者的測驗分數作為參照分數標準並進行比較，發現此次受測\n     者在「開放」向度的測驗分數，其平均分數明顯高於過去三年的平均分數。","answer":"（一）E 測驗環境。\n（二）F 受測者背景經歷。\n（三）A 受測者心理狀態。\n（四）C 測驗信度（再測信度）。\n（五）D 測驗常模。"},{"id":"P090","exam":"112年度第2梯次","number":10,"question":"十、甲君 55 歲時退休，休息了 3 年之後再就業，好不容易找到的工作又一直做的不順\n  利，因此找到員工關係室的同事乙君幫他釐清與主管溝通過程有哪些障礙存在。一\n  般溝通過程會有許多的障礙因素，影響有效的溝通，這些常見障礙因素有：(Ａ)過\n  濾作用、(Ｂ)選擇性知覺、(Ｃ)情緒、(Ｄ)語言、(Ｅ)沉默、(Ｆ)資訊過荷、(Ｇ)溝通\n  焦慮。\n  以下為甲君與同事乙君的對話和情境：\n  （一）乙君：「你剛才說上週主管指導你做專案時，你當時的反應是什麼？」\n     甲君：「這個專案又複雜又很多人一起做，主管講的若跟我特別有關的和我\n         比較覺得有興趣的就會多記下來，其他的就讓他講他的。」\n  （二）甲君：「我跟主管相差 20 歳，他講專案時一下又 K 啊 I 啊，一下又什麼 M…」\n     乙君：「喔，你主管可能要你注意 KPI，績效指標啦？專案的專業用語。」\n     甲君：「我有年紀了，聽不懂這些專案用的啦。」\n  （三）乙君：「你主管知道你進公司沒有多久，會提供你一些協助吧？」\n     甲君：「有啊！像上週我的主管給我厚厚一本資料，說隔天後跟我討論第一\n       個部分我的專案直接會用到的，99 頁吔。」\n（四）乙君：「沒關係，你以前很有職場經驗，應該可以應付。」\n   甲君：「齁！像那天主管走過來說他剛被總經理訓了一頓，他跟我講話的時\n       候就是特別針對我，我實在很不想聽。」\n（五）乙君：「也不一定只有你的內容有問題啦，你主管也要回應總經理的指示\n       啊。」\n   甲君：「好啊！反正我現在開始就挑不會被盯的內容向他報告和討論，其他\n       的先放著不講。」\n請根據上述Ａ～Ｇ，分別回答（一）～（五）對話和情境相對應的 1 個溝通障礙因\n素。（10 分，每小題 2 分）","answer":"（一）B 選擇性知覺。\n（二）D 語言。\n（三）F 資訊過荷。\n（四）C 情緒。\n（五）A 過濾作用。"},{"id":"P091","exam":"112年度第1梯次","number":1,"question":"一、依就業服務法第 34 條第 1 項、第 3 項規定，私立就業服務機構及其分支機構，應\n  向主管機關申請設立許可，經發給許可證後，始得從事就業服務業務；其許可證\n  並應定期更新之。第 1 項私立就業服務機構及其分支機構之設立許可條件、期間、\n  廢止許可、許可證更新及其他管理事項之辦法，由中央主管機關定之。同法第 36\n  條第 1 項規定，私立就業服務機構應置符合規定資格及數額之就業服務專業人員。\n  請回答下列問題：\n （一）A 公司未經許可從事就業服務業務，違反就業服務法第 34 條第 2 項規定，依\n     就業服務法第 65 條第 1 項規定，應處多少新臺幣罰鍰？（2 分）\n （二）依「私立就業服務機構許可及管理辦法」第 11 條第 2 項規定，仲介外國人至\n     中華民國工作之營利就業服務機構，最低實收資本總額為多少新臺幣？（2\n     分）\n （三）依「私立就業服務機構許可及管理辦法」第 14 條第 1 項規定，辦理仲介外國\n     人至中華民國工作之營利就業服務機構，依同辦法第 13 條第 1 項第 5 款規定\n     應繳交由銀行出具金額多少新臺幣保證金之保證書，作為民事責任之擔保？\n     （2 分）\n （四）依「私立就業服務機構許可及管理辦法」第 25 條第 1 項規定，私立就業服務\n     機構許可證有效期限為幾年？（1 分）有效期限屆滿前幾日內，應備規定文\n     件重新申請設立許可及換發許可證？（1 分）\n （五） B 公司為經許可從事就業服務業務之私立就業服務機構，所屬從業人員之人\n     數為 9 人，依就業服務法第 36 條第 1 項及「私立就業服務機構許可及管理辦\n     法」第 6 條第 1 項規定，應置就業服務專業人員至少幾人？（2 分）","answer":"（一）30萬元以上150萬元以下。\n（二）最低實收資本總額500萬元。\n（三）銀行保證金300萬元。\n（四）許可證有效期限2年；屆滿前30日內重新申請。\n（五）依從業人數配置就業服務專業人員；題目個案答案依當時管理辦法計算。"},{"id":"P092","exam":"112年度第1梯次","number":2,"question":"二、甲君經營湯包店，於 108 年 12 月間因非法容留未經許可之外國人乙君於店內從事\n  備料等工作，違反就業服務法第 44 條規定，經地方政府查獲後，於 109 年 3 月間\n  依法裁處罰鍰，並已合法送達裁處書，復於 111 年 12 月間又再經查獲非法容留未\n  經許可之外國人丙君從事店內打掃工作，請依就業服務法規定回答下列問題：\n  （一）甲君於 108 年 12 月間第 1 次經查獲非法容留未經許可之外國人乙君從事工作，\n      依就業服務法第 63 條第 1 項規定，最低應處新臺幣多少元罰鍰？（3 分）又\n      甲君於 111 年 12 月間第 2 次經查獲非法容留未經許可之外國人丙君從事工\n      作，依就業服務法第 63 條第 1 項規定，應處幾年以下有期徒刑、拘役或科\n      或併科新臺幣 120 萬元以下罰金？（3 分）\n  （二）外國人乙君及丙君係違反就業服務法第 43 條規定，依就業服務法第 68 條第\n      1 項規定，最低應處新臺幣多少元罰鍰？（2 分）另依就業服務法第 68 條第\n      3 項規定，應即限期令外國人乙君及丙君出國，屆期不出國者，依就業服務\n      法第 68 條第 5 項規定，應由何機關強制出國？（2 分）","answer":"（一）第一次違法最低15萬元；5年內再違反者，3年以下有期徒刑、拘役或科或併科120萬元以下罰金。\n（二）外國人最低罰鍰3萬元；限期不出國者由入出國管理機關強制出國。※本題原考試第（二）後半曾有試題疑義，公開解析記載該子題不予計分。"},{"id":"P093","exam":"112年度第1梯次","number":3,"question":"三、依中高齡者及高齡者就業促進法規定，雇主對於所僱用之中高齡者及高齡者有工作\n  障礙時得提供職務再設計，主管機關得予輔導或補助。又依在職中高齡者及高齡者\n  穩定就業辦法第 12 條規定，雇主向主管機關申請職務再設計之輔導或補助項目有\n  哪 5 項？（10 分）","answer":"1.提供就業輔具。2.改善工作設備或機具。3.改善職場工作環境。4.改善工作條件。5.調整工作方法。"},{"id":"P094","exam":"112年度第1梯次","number":4,"question":"四、C 餐館於 96 年 7 月 1 日開業，即聘僱甲員工做外場服務，因生意興隆於 108 年 7\n  月 1 日又增聘乙員工；因受疫情影響虧損，依據勞動基準法第 11 條規定於 110 年 6\n  月 30 日同時與上述 2 位員工終止勞動契約，請依勞動法令之規定回答下列問題：\n （一） C 餐館所聘僱之甲、乙 2 位員工，雖非屬勞工保險條例之強制納保的投保單\n     位，惟依勞動相關法規其仍需為員工投保何種保險，方不致影響上述 2 位員\n     工請領失業給付之權益？（2 分）\n （二）C 餐館依勞動基準法第 16 條規定應於幾日前，分別向甲、乙 2 位員工預告終\n    止勞動契約？（2 分）如未預告，雇主應如何處理才不致違法？（2 分）\n （三）甲、乙 2 位員工於接到預告後，為另謀工作得於工作時間請假外出，其請假\n    時數，每星期最多不得超過幾日之工作時間，其請假之工資照給？（2 分）\n （四）甲、乙 2 位員工均適用勞工退休金條例新制之人員，依該條例之規定，於 110\n    年 6 月 30 日終止勞動契約時，雇主應個別發給幾個月之平均工資資遣費？（2\n    分）","answer":"（一）就業保險。\n（二）甲30日前；乙20日前；未依法預告者應給付預告期間工資。\n（三）每星期最多2日工作時間，工資照給。\n（四）新制資遣費：甲6個月平均工資；乙1個月平均工資。"},{"id":"P095","exam":"112年度第1梯次","number":5,"question":"五、甲君與乙君均受僱於 D 公司之男性員工，甲君擔任業務部經理，每月薪資為新臺\n  幣 5 萬元，乙君擔任業務部業務員，每月薪資為新臺幣 3 萬元，請依據相關勞動法\n  令規定回答下列問題：\n （一）依據個人資料保護法第 2 條規定，甲君應受到保護的「個人資料」，請任舉 2\n    種該法所訂的個人之資料？（2 分）又我國目前個人資料保護法之中央主管機\n    關是哪一個機關？（1 分）\n （二）依據勞工保險條例規定，D 公司應為甲君投保勞工保險的月投保薪資新臺幣\n    45,800 元，請問：D 公司 112 年起每個月要負擔的費率是多少%？（2 分）而\n    甲君每個月應負擔的勞工保險費用中，政府補助多少%？（1 分）\n （三）依據性別工作平等法第 12 條規定，乙君認為甲君對他有不當肢體接觸的性騷\n    擾，而向 D 公司雇主投訴，依規定 D 公司雇主要針對此一性騷擾事件處理時，\n    所謂的「性騷擾之認定」，應就個案審酌事件發生之具體事實為之，請任舉 2\n    種所謂的「事件發生之具體事實」的項目。（2 分）\n （四）依據勞工職業災害保險及保護法規定，D 公司應為甲君投保勞工職業災害保險，\n    並負擔多少%保險費？（2 分）","answer":"（一）個資可舉病歷、財務情況等；當時題目之主管機關答案因112/5/31修法前後有差異，應依考試當時法制理解。\n（二）勞保普通事故費：雇主負擔70%；政府補助10%。\n（三）性騷擾認定可審酌事件背景、工作環境、雙方關係、行為人言詞／行為及相對人認知等具體事實，任列2項。\n（四）職災保險費由雇主負擔100%。"},{"id":"P096","exam":"112年度第1梯次","number":6,"question":"六、\n （一）國內經濟景氣好壞影響國內就業市場，國家發展委員會定期發布景氣對策信\n     號，以 5 種不同顏色的信號燈來代表當前景氣狀況為熱絡、穩定、低迷或注\n     意性燈號。依 111 年 11 月發布景氣燈號，其中批發、零售及餐飲業營業額均\n     由綠燈轉呈藍燈，機械及電機設備進口值由紅燈轉呈綠燈，請說明景氣燈號\n     之綠燈、紅燈、藍燈所代表的景氣狀況。（各 1 分，共 3 分）\n （二）隨 COVID-19 疫情趨緩邊境管制陸續解封，國內旅館業業者反映一般所僱用的\n     房務及清潔人員需求殷切，請問依主計總處行業統計分類之 19 個大類，旅館\n     業屬於哪一個大類行業別（請寫出行業別名稱）？（2 分）另依主計總處職業\n     標準分類之 10 個大類，房務及清潔人員屬哪一個大類職業別（請寫出職業別\n     名稱）？（2 分）\n （三）請依下表 1 行政院主計總處 111 年 5 月人力運用調查統計結果，回答下列問題：\n     1．111 年 5 月從事非典型工作者計 79.8 萬人，與 110 年 10 月比較，從事非典\n       型工作主要原因中，哪一項增幅(％)最多？（1 分）哪一項減幅(％)最多？\n       （1 分）\n     2．15-24 歲從事非典型工作的主要原因為何？（1 分）","answer":"（一）綠燈＝穩定；紅燈＝熱絡；藍燈＝低迷。\n（二）旅館業屬「住宿及餐飲業」；房務及清潔人員依職業標準分類屬基層技術／勞力相關職類（以題目當時正式大類名稱作答）。\n（三）依題目表1數據計算增減幅與15～24歲非典型工作原因。"},{"id":"P097","exam":"112年度第1梯次","number":7,"question":"七、E 企業總共僱有 1200 位員工，其中有 60 位員工即將年滿 65 歳，該企業欲依照「在\n  職中高齡者及高齡者穩定就業辦法」規定，在不低於這些屆退員工原有薪資下仍繼\n  續僱用一部分的人，並向政府申請繼續僱用補助，如繼續僱用年滿 65 歲的員工中\n  有 5 人做滿 6 個月後即離職、其他繼續僱用者則做滿 12 個月後即離職，且有 2 位\n  高齡員工公司會再申請就業輔具補助。請針對下列四項問題依序作答：\n （一）請問 E 企業至少要繼續僱用多少人才可以申請「繼續僱用補助」？（2 分）\n （二）請問 E 企業僅以符合規定最低比例繼續僱用這群年滿 65 歲員工，E 企業針對\n     這 5 位做滿 6 個月即離職的高齡員工，可以申請新臺幣多少元之補助？（3 分）\n （三）承上，E 企業針對其他做滿 12 個月即離職的繼續僱用者，可以申請新臺幣多\n     少元之補助？（3 分）\n （四）請問 E 企業另外可針對 2 位高齡員工經評估後在沒有特殊需求情況下，2 人\n     最高總共可申請新臺幣多少元之就業輔具補助？（2 分）","answer":"（一）至少18人（60×30%）。\n（二）5人做滿6個月：390,000元。\n（三）其餘13人做滿12個月：2,184,000元。\n（四）2人就業輔具補助最高合計200,000元。"},{"id":"P098","exam":"112年度第1梯次","number":8,"question":"八、F 公司在過年後，展開人員招募，其招募方式包括：公司電子布告欄張貼工作告示\n  (job posting)、校園徵才、獵人頭公司(head hunting)、員工推薦等方式。此外也透\n  過會員方式，至台灣就業通網站招募中高齡就業人員。此次求才強調：(1)良好溝通\n  能力。(2)主動解決問題。(3)有效分配時間，規劃行程。(4)掌握時事，為公司提供\n  新資訊等四大能力。為有效衡量求職者的職能，F 公司規劃三關面試。第一關：刻\n  意在面試過程，製造緊張氣氛，甚至提出相當困難的問題，用以判斷求職者的承受\n  能力。第二關：給予求職者一個假定情況並詢問求職者如何回應這個事件。第三關：\n  安排認知能力測驗。請根據上述敘述，回答下列問題：\n （一）F 公司以會員方式登入台灣就業通網站，能否在網站查詢到求職者全名（姓氏\n     及名字）？（2 分）\n （二）F 公司使用的招募方式，哪 2 項屬於內部招募？（2 分）\n （三）假設甲君經錄取後，F 公司老闆想要舉辦聚餐慰勞大家，並將辦理餐會活動任\n     務交付給甲君。甲君在接到後立即向大家宣布餐會事項。結果陸續有同事問：\n    「辦在假日還是平日」\n             、「可不可以帶家眷參加」\n                        、「需要準備表演嗎」\n                                 。若以上\n    述四大能力來看，甲君在哪 1 能力的表現最不理想？（2 分）\n （四）面試第一關屬於何種方式的面談？（2 分）\n （五）面試第二關屬於何種方式的面談？（2 分）","answer":"（一）可以（依題目當時台灣就業通會員招募功能）。\n（二）內部招募：工作告示（job posting）、員工推薦。\n（三）良好溝通能力。\n（四）壓力面談。\n（五）情境面談。"},{"id":"P099","exam":"112年度第1梯次","number":9,"question":"九、甲君為了找到適合自己的職業，他在勞動力發展署網站的職涯測評專區填答了「工\n  作氣質測驗」\n       ，得到下面的百分等級，以及跟印刷職業常模相較的結果，如下方表、\n  圖。甲君帶著測驗結果前來尋求就業服務人員的協助。\n  氣質因素     百分等級                   結果解釋\n                  得高分者善於做工作規劃，能督導部屬執行工作，\n  A1 督導性    34\n                  並會分派與約制部屬的活動。\n                  得高分者具備良好的說服技巧，能夠改變別人的判\n  A2 說服性    50\n                  斷、想法及態度。\n                  得高分者善於與人相處，能與人打成一片，以建立\n  A3 親和性    21\n                  良好的人際關係。\n                  得高分者善於表達個人的感受與想法，並能以創意\n  A4 表達性    21\n                  的眼光加以展現。\n B.決策果斷           得高分者較能依據個人的主觀感受與事物的客觀\n            63\n (擅於決策)           資料，進行工作評核或下決定。\n                  得高分者做事力求精確，不會發生錯誤，能夠接受\n C.審慎精確     30\n                  精確的標準，否則會造成重大的災害。\n                  得高分者能執行重複性或例行性工作，而不覺得單\n D.偏好單純     69    調或厭煩。得低分者能夠同時執行各種性質不同的\n                  工作職務，而不覺得力不從心。\n E.擔險耐勞           得高分者在危險或困難的環境下，亦能有效執行工\n            86\n (堅忍犯難)           作。\n                  得高分者能與別人分開，自己單獨工作，而不感到\n F.獨處自為     91\n                  難受。\n 氣質因素    百分等級                    結果解釋\n                 得高分者能依照既定的工作指示，忠實地推行工\n                 作；能守本分，並能順從上司，考慮上司的感受，\nG.敬上順從     31\n                 與上司維持良好的關係；能謹守人與人之前的傳統\n                 關係，注重和諧，不得罪人。\n和印刷之常模相較結果如下：\n「■」表示常模百分等級；「—」表示個人在某一氣質的高低程度（百分等級）。\n請回答下列問題：\n（一）甲君詢問就業服務人員：「網頁上說超過 66 算高分，但我只有『偏好單純』、\n   『擔險耐勞』、『獨處自為』這三項的百分等級超過 66，是否表示我的個性跟\n   職場需要不合呢？」請問：就業服務人員最適合採用Ａ、Ｂ、Ｃ之中的哪一\n   種反應來說明「工作氣質測驗」的性質和功用？（3 分）\n   A．   工作有很多，高高低低都有，雖然你只有三項比別人強，但好好利用\n        這三項，還是能夠找到工作。\n   B．   個性是可以學習改變的，你的「說服性」、「決策果斷」分數也不低，\n        好好培養，就可以提升你的市場競爭力。\n   C．   各個工作需要的氣質組型不同，因此重要的不是你那些氣質高分，而\n        是你跟哪種職業的氣質組型相合。\n（二）甲君接著提問：「我覺得很奇怪，我的『獨處自為』怎麼會這麼高，我其實平\n   常也喜歡交朋友、有不少朋友啊？」請問：根據「工作氣質測驗」，就業服務\n   人員比較適合採用 D、E 之中的哪一種反應？（2 分）\n   D．   百分等級是跟別人比較出來的，雖然你平常朋友不少，但根據統計，\n        別人的朋友更多，所以你的「獨處自為」才會這麼高。\n   E．   生活時和工作時的偏好不一定會一樣，你平常生活中喜歡交朋友是一\n        回事，但你工作時是否喜歡「與別人分開，單獨工作」呢？\n（三）甲君詢問就業服務人員：「我適合做印刷工作嗎」。\n 1．請問：根據帕森斯（Parsons）生涯特質理論所關注的客觀適配，就業服務人員\n   最適合採用 F、G、H 之中的哪一種反應？（2 分）\n 2．請問：根據薩維克（Savickas）生涯建構理論所關注的主觀建構，就業服務人\n   員最適合採用 F、G、H 之中的哪一種反應。（3 分）\n   F．   你可以算算看，在 10 個工作氣質中，你的個人百分等級有幾個落在常\n        模範圍中。如果落在印刷常模百分等級的數目比其他職業常模多，就\n        表示你比較適合印刷工作。\n   G．   你可以挑出你比較看重的幾個工作氣質來看，如果這幾工作氣質的個\n        人百分等級有落在印刷常模百分等級中，就表示你適合這個工作。\n   H．   最重要的是你對印刷工作的印象，只要你真心喜歡印刷工作，就不必\n        管這個測驗結果。","answer":"（一）C。\n（二）E。\n（三）1.F（Parsons客觀適配）；2.H（Savickas主觀建構）。"},{"id":"P100","exam":"112年度第1梯次","number":10,"question":"十、Maslow (馬斯洛) 的需求層次理論將人的需求歸納為 5 種，由低到高層次，滿足初\n  階需求後，才會進展到高階需求，依序是(Ａ)生理需求（Physiological Needs）、(Ｂ)\n  安全需求（Safety Needs）\n                   、(Ｃ)愛與歸屬需求（Affiliation Needs）\n                                               、(Ｄ)自尊需求（Esteem\n  Needs）、(Ｅ)自我實現（Self-actualization Needs）。僱用單位想激發員工動力，宜先\n  評估員工正處於什麼層次的需求，以提供或調整對應的相關措施。請將下列的需求\n  依序歸類至上述五類的需求，每題只能有一個答案。（填答英文代碼、中文或英文\n  皆可）\n  （一） 甲君很希望職場是友善、溫暖，而且有談得來的同事或支持自己的主管。\n                                     （2\n      分）\n  （二）乙君期待在職場能受尊重。（2 分）\n  （三）丙君喜歡職場能免費提供茶和咖啡、中午可以休息一下、辦活動有便當。（2\n      分）\n  （四）丁君期待從工作中獲得成就感。（2 分）\n  （五）戊君最重視職場要工作穩定。（2 分）","answer":"（一）C 愛與歸屬需求。\n（二）D 自尊需求。\n（三）A 生理需求。\n（四）E 自我實現需求。\n（五）B 安全需求。"}];

function extractNumberedOptions(text){
  const map={};
  // 支援 1、 1. 1． 1： 1:
  const re=/(?:^|\n)\s*([1-9]\d*)\s*[、\.．:：]\s*([\s\S]*?)(?=(?:\n\s*[1-9]\d*\s*[、\.．:：])|$)/g;
  let m;
  while((m=re.exec(text))!==null){
    map[m[1]]=m[2].trim().replace(/\s+/g,' ');
  }
  return map;
}

function enrichPracticalAnswer(answer, subQuestionText){
  const opts=extractNumberedOptions(subQuestionText);
  if(!Object.keys(opts).length) return answer;

  // 單一答案，例如「2。」或「2」
  const single=answer.match(/^\s*([1-9]\d*)\s*[。.]?\s*$/);
  if(single && opts[single[1]]){
    return `${single[1]}、${opts[single[1]]}`;
  }

  // 答案中若含「答案：2」「選項2」等，也補上文字
  return answer.replace(/(?:答案\s*[：:]?\s*|選項\s*)([1-9]\d*)/g,(all,n)=>{
    return opts[n] ? `答案：${n}、${opts[n]}` : all;
  });
}

function parsePracticalSubAnswers(answerText){
  const map={};
  const re=/（([一二三四五六七八九十]+)）\s*([\s\S]*?)(?=（[一二三四五六七八九十]+）|$)/g;
  let m;
  while((m=re.exec(answerText))!==null){
    map[m[1]]=m[2].trim();
  }
  return map;
}

function splitPracticalQuestion(questionText){
  const re=/（([一二三四五六七八九十]+)）/g;
  const matches=[...questionText.matchAll(re)];
  if(!matches.length) return null;
  const intro=questionText.slice(0,matches[0].index).trim();
  const parts=[];
  for(let i=0;i<matches.length;i++){
    const start=matches[i].index;
    const end=i+1<matches.length?matches[i+1].index:questionText.length;
    parts.push({
      key:matches[i][1],
      text:questionText.slice(start,end).trim()
    });
  }
  return {intro,parts};
}

function practicalInterleavedHTML(q){
  const split=splitPracticalQuestion(q.question);
  const answers=parsePracticalSubAnswers(q.answer);
  if(!split || !Object.keys(answers).length){
    return `<div class="practical-subblock">${escapeHTML(q.question)}</div><div class="practical-inline-answer">參考答案：${escapeHTML(q.answer)}</div>`;
  }
  let s=split.intro?`<div class="practical-subblock">${escapeHTML(split.intro)}</div>`:'';
  for(const part of split.parts){
    s+=`<div class="practical-subblock">${escapeHTML(part.text)}</div>`;
    if(answers[part.key]){
      const richAnswer=enrichPracticalAnswer(answers[part.key], part.text);
      s+=`<div class="practical-inline-answer">答案：${escapeHTML(richAnswer)}</div>`;
    }
  }
  return s;
}

function practicalInterleavedSpeakText(q){
  const split=splitPracticalQuestion(q.question);
  const answers=parsePracticalSubAnswers(q.answer);
  if(!split || !Object.keys(answers).length){
    return `術科歷屆考題。${q.exam}，第 ${q.number} 大題。題目。${q.question}。參考答案。${q.answer}。`;
  }
  let text=`術科歷屆考題。${q.exam}，第 ${q.number} 大題。`;
  if(split.intro) text+=`${split.intro}。`;
  for(const part of split.parts){
    text+=`${part.text}。`;
    if(answers[part.key]){
      const richAnswer=enrichPracticalAnswer(answers[part.key], part.text);
      text+=`答案。${richAnswer}。`;
    }
  }
  return text;
}

function practicalSpeakText(q){
  return practicalInterleavedSpeakText(q);
}
function speakText(text, onEnd){
  if(!('speechSynthesis' in window)){ toast('此瀏覽器不支援語音朗讀。'); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang='zh-TW';
  utter.rate=0.92;
  utter.pitch=1;
  const voices=window.speechSynthesis.getVoices();
  const zh=voices.find(v=>/zh[-_](TW|Hant)/i.test(v.lang)) || voices.find(v=>/^zh/i.test(v.lang));
  if(zh) utter.voice=zh;
  if(onEnd) utter.onend=onEnd;
  window.speechSynthesis.speak(utter);
}
