<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8f9a8b">
<title>就業服務乙級學科＋術科測驗 App</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root { --bg:#f5f0e9; --card:#fffaf3; --ink:#3d3a35; --muted:#7e766d; --primary:#8f9a8b; --primary-deep:#687665; --accent:#c6a49a; --soft:#e5ddd3; --good:#7d9b76; --bad:#b87f73; --warn:#c5a15d; --line:#ddd2c7; --shadow:0 18px 48px rgba(61,58,53,.12); }
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; color:var(--ink); background:linear-gradient(160deg,#f7f2ec 0%,#eee7de 100%); font-family: STSong-Light, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Heiti TC", serif; font-size:17px; line-height:1.6; min-height:100vh; }
.app { width:min(960px,100%); margin:0 auto; padding:18px 14px 86px; }
.hero { border-radius:28px; padding:22px; background:linear-gradient(135deg,#8f9a8b,#c6a49a); color:#fff; box-shadow:var(--shadow); }
.hero h1 { margin:0 0 6px; font-size:clamp(26px,7vw,42px); line-height:1.15; letter-spacing:.04em; }
.hero p { margin:0; opacity:.95; }
.pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.24); margin-top:12px; font-size:14px; }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0; }
.stat { background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.45); border-radius:20px; padding:12px; }
.stat b { display:block; font-size:22px; color:var(--primary-deep); }
.card { background:var(--card); border:1px solid var(--line); border-radius:26px; padding:18px; margin-top:14px; box-shadow:0 10px 30px rgba(61,58,53,.07); }
.card h2 { margin:0 0 12px; font-size:22px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.field label { display:block; color:var(--muted); font-size:14px; margin-bottom:5px; }
select,input { width:100%; border:1px solid var(--line); border-radius:16px; padding:13px 14px; font-size:17px; color:var(--ink); background:#fffdf9; font-family:inherit; }
button { border:0; border-radius:18px; padding:13px 16px; font-size:17px; font-family:inherit; cursor:pointer; transition:.18s transform,.18s opacity,.18s background; min-height:48px; }
button:active { transform:scale(.985); }
.primary { background:var(--primary); color:white; font-weight:700; box-shadow:0 8px 20px rgba(104,118,101,.22); }
.secondary { background:var(--soft); color:var(--ink); }
.ghost { background:transparent; color:var(--primary-deep); border:1px solid var(--line); }
.actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
.actions button { flex:1; }
.hidden { display:none !important; }
.muted { color:var(--muted); font-size:15px; }
.progress-wrap { position:sticky; top:0; z-index:10; margin:-18px -14px 14px; padding:12px 14px; background:rgba(245,240,233,.92); backdrop-filter:blur(10px); }
.progress { width:100%; height:10px; border-radius:999px; background:#ded6cd; overflow:hidden; }
.progress > div { height:100%; width:0; background:linear-gradient(90deg,var(--primary),var(--accent)); transition:.25s width; }
.topline { display:flex; justify-content:space-between; gap:10px; font-size:14px; color:var(--muted); margin-bottom:8px; }
.q-meta { color:var(--muted); font-size:14px; margin-bottom:8px; }
.q-text { font-size:clamp(20px,5.2vw,28px); font-weight:800; line-height:1.55; margin:8px 0 14px; }
.hint { padding:10px 12px; background:#f1ebe2; border-radius:16px; color:#6d665e; font-size:15px; }
.options { display:grid; gap:10px; margin-top:14px; }
.option { display:grid; grid-template-columns:auto auto 1fr; gap:10px; align-items:start; text-align:left; background:#fffdf9; border:2px solid var(--line); color:var(--ink); border-radius:20px; padding:14px; min-height:62px; }
.option.selected { border-color:var(--primary); background:#f4f7f1; }
.option.correct { border-color:var(--good); background:#eef5ec; }
.option.wrong { border-color:var(--bad); background:#fbefed; }
.option-label { width:28px; height:28px; display:grid; place-items:center; border-radius:50%; background:var(--soft); font-weight:800; }
.option-mark { color:var(--primary-deep); font-size:20px; line-height:1.2; }
.option-content { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.option-img { max-width:96px; max-height:96px; border-radius:12px; background:#fff; border:1px solid var(--line); padding:6px; }
.mini-img { width:48px; max-height:48px; vertical-align:middle; margin-right:8px; border:1px solid var(--line); border-radius:8px; }
.feedback { border-radius:18px; padding:14px; margin-top:14px; }
.feedback.good { background:#edf5eb; border:1px solid #c9dbc4; color:#496343; }
.feedback.bad { background:#faeeec; border:1px solid #e5c9c4; color:#7d4f47; }
.result-box { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.result-num { text-align:center; background:#f2ebe4; border-radius:22px; padding:18px; }
.result-num b { display:block; font-size:34px; color:var(--primary-deep); }
details { border:1px solid var(--line); border-radius:18px; padding:10px 12px; background:#fffdf9; margin:8px 0; }
summary { cursor:pointer; font-weight:700; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); opacity:0; background:#3d3a35; color:#fff; padding:12px 18px; border-radius:999px; transition:.2s; z-index:20; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.footer-note { text-align:center; margin-top:20px; color:var(--muted); font-size:13px; }
@media (max-width:720px){ .grid { grid-template-columns:repeat(2,1fr); } .form-grid { grid-template-columns:1fr; } .card { border-radius:22px; padding:16px; } .actions { flex-direction:column; } .actions button { width:100%; } body { font-size:18px; } }

/* ===== 莫蘭迪滿版即時判題版 ===== */
:root {
  --bg: #ece7df;
  --card: #f8f4ee;
  --ink: #4d4a45;
  --muted: #827b73;
  --primary: #909b8a;
  --primary-deep: #667261;
  --accent: #b99e96;
  --soft: #ddd5ca;
  --good: #82977b;
  --good-bg: #e4ece1;
  --good-deep: #53674e;
  --bad: #b58279;
  --bad-bg: #f0dfdc;
  --bad-deep: #7f554e;
  --line: #d2c8bd;
  --shadow: 0 14px 36px rgba(77, 74, 69, .10);
}

body {
  background: linear-gradient(155deg, #f1ede7 0%, #e5dfd6 100%) !important;
  color: var(--ink) !important;
}

.hero {
  background: linear-gradient(135deg, #8f9a8b 0%, #aaa091 52%, #b99e96 100%) !important;
}

.primary { background: var(--primary) !important; }
.secondary { background: #ddd6cc !important; }
.ghost { color: var(--primary-deep) !important; border-color: var(--line) !important; }
.progress > div { background: linear-gradient(90deg, #87937f, #b69b94) !important; }

.option {
  background: #faf7f2 !important;
  border-color: var(--line) !important;
  box-shadow: 0 5px 14px rgba(77, 74, 69, .045);
}
.option.selected {
  border-color: var(--primary) !important;
  background: #edf0ea !important;
}
.option.correct {
  border-color: var(--good) !important;
  background: var(--good-bg) !important;
  color: var(--good-deep) !important;
  box-shadow: inset 0 0 0 1px rgba(130,151,123,.16);
}
.option.wrong {
  border-color: var(--bad) !important;
  background: var(--bad-bg) !important;
  color: var(--bad-deep) !important;
  box-shadow: inset 0 0 0 1px rgba(181,130,121,.16);
}
.option.correct .option-label,
.option.correct .option-mark {
  background: var(--good) !important;
  color: #fff !important;
}
.option.wrong .option-label,
.option.wrong .option-mark {
  background: var(--bad) !important;
  color: #fff !important;
}
.option:disabled { opacity: 1 !important; cursor: default; }
.feedback.good { background: var(--good-bg) !important; border-color: #c5d2c0 !important; color: var(--good-deep) !important; }
.feedback.bad { background: var(--bad-bg) !important; border-color: #dec2bc !important; color: var(--bad-deep) !important; }

}

}

}

麗華百貨公司做為拍攝電影的背景，屬於合理使用的範圍","原作者自行創作某音樂作品後，即可宣稱擁有該作品之著作權","著作權是為促進文化發展為目的，所保護的財產權之一"]},{"id":"Q0111","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":11,"answer":[2],"multiple":false,"question":"專利權又可區分為發明、新型與設計三種專利權，其中發明專利權是否有保護期限？期限為何？","options":["有，5 年","有，20 年","有，50 年","無期限， 只要申請後就永久歸申請人所有"]},{"id":"Q0112","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":12,"answer":[2],"multiple":false,"question":"受僱人於職務上所完成之著作，如果沒有特別以契約約定，其著作人為下列何者？","options":["雇用人","受僱人","雇用公司或機關法人代表","由雇用人指定之自然人或法人"]},{"id":"Q0113","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":13,"answer":[1],"multiple":false,"question":"任職於某公司的程式設計工程師，因職務所編寫之電腦程式，如果沒有特別以契約約定，則該電腦程式之著作財產權歸屬下列何者？","options":["公司","編寫程式之工程師","公司全體股東共有","公司與編寫程式之工程師共有"]},{"id":"Q0114","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":14,"answer":[3],"multiple":false,"question":"某公司員工因執行業務，擅自以重製之方法侵害他人之著作財產權，若被害人提起告訴，下列對於處罰對象的敘述，何者正確？","options":["僅處罰侵犯他人著作財產權之員工","僅處罰雇用該名員工的公司","該名員工及其雇主皆須受罰","員工只要在從事侵犯他人著作財產權之行為前請示雇主並獲同意，便可以不受處罰"]},{"id":"Q0115","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":15,"answer":[1],"multiple":false,"question":"受僱人於職務上所完成之發明、新型或設計，其專利申請權及專利權如未特別約定屬於下列何者？","options":["雇用人","受僱人","雇用人所指定之自然人或法人","雇用人與受僱人共有"]},{"id":"Q0116","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":16,"answer":[4],"multiple":false,"question":"任職大發公司的郝聰明，專門從事技術研發，有關研發技術的專利申請權及專利權歸屬，下列敘述何者錯誤？","options":["職務上所完成的發明，除契約另有約定外，專利申請權及專利權屬於大發公司","職務上所完成的發明，雖然專利申請權及專利權屬於大發公司，但是郝聰明享有姓名表示權","郝聰明完成非職務上的發明，應即以書面通知大發公司","大發公司與郝聰明之雇傭契約約定，郝聰明非職務上的發明，全部屬於公司，約定有效"]},{"id":"Q0117","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":17,"answer":[3],"multiple":false,"question":"有關著作權的敘述，下列何者錯誤？","options":["我們到表演場所觀看表演時，不可隨便錄音或錄影","到攝影展上，拿相機拍攝展示的作品，分贈給朋友，是侵害著作權的行為","網路上供人下載的免費軟體，都不受著作權法保護， 所以我可以燒成大補帖光碟，再去賣給別人","高普考試題，不受著作權法保護"]},{"id":"Q0118","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":18,"answer":[3],"multiple":false,"question":"有關著作權的敘述，下列何者錯誤？","options":["撰寫碩博士論文時，在合理範圍內引用他人的著作，只要註明出處，不會構成侵害著作權","在網路散布盜版光碟，不管有沒有營利，會構成侵害著作權","在網路的部落格看到一篇文章很棒，只要註明出處，就可以把文章複製在自己的部落格","將補習班老師的上課內容錄音檔，放到網路上拍賣，會構成侵害著作權"]},{"id":"Q0119","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":19,"answer":[4],"multiple":false,"question":"有關商標權的敘述，下列何者錯誤？","options":["要取得商標權一定要申請商標註冊","商標註冊後可取得10 年商標權","商標註冊後，3 年不使用，會被廢止商標權","在夜市買的仿冒品，品質不好，上網拍賣，不會構成侵權"]},{"id":"Q0120","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":20,"answer":[1],"multiple":false,"question":"有關營業秘密的敘述，下列何者錯誤？","options":["受雇人於非職務上研究或開發之營業秘密，仍歸雇用人所有","營業秘密不得為質權及強制執行之標的","營業秘密所有人得授權他人使用其營業秘密","營業秘密得全部或部分讓與他人或與他人共有"]},{"id":"Q0121","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":21,"answer":[1],"multiple":false,"question":"甲公司將其新開發受營業秘密法保護之技術，授權乙公司使用，下列何者錯誤？","options":["乙公司已獲授權，所以可以未經甲公司同意，再授權丙公司使用","約定授權使用限於一定之地域、時間","約定授權使用限於特定之內容、 一定之使用方法","要求被授權人乙公司在一定期間負有保密義務"]},{"id":"Q0122","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":22,"answer":[3],"multiple":false,"question":"甲公司嚴格保密之最新配方產品大賣，下列何者侵害甲公司之營業秘密？","options":["鑑定人A 因司法審理而知悉配方","甲公司授權乙公司使用其配方","甲公司之B 員工擅自將配方盜賣給乙公司","甲公司與乙公司協議共有配方"]},{"id":"Q0123","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":23,"answer":[3],"multiple":false,"question":"故意侵害他人之營業秘密，法院因被害人之請求，最高得酌定損害額幾倍之賠償？","options":["1 倍","2 倍","3 倍","4 倍"]},{"id":"Q0124","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":24,"answer":[4],"multiple":false,"question":"受雇者因承辦業務而知悉營業秘密，在離職後對於該營業秘密的處理方式，下列敘述何者正確？","options":["聘雇關係解除後便不再負有保障營業秘密之責","僅能自用而不得販售獲取利益","自離職日起3 年後便不再負有保障營業秘密之責","離職後仍不得洩漏該營業秘密"]},{"id":"Q0125","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":25,"answer":[3],"multiple":false,"question":"按照現行法律規定，侵害他人營業秘密，其法律責任為","options":["僅需負刑事責任","僅需負民事損害賠償責任","刑事責任與民事損害賠償責任皆須負擔","刑事責任與民事損害賠償責任皆不須負擔"]},{"id":"Q0126","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":26,"answer":[3],"multiple":false,"question":"企業內部之營業秘密，可以概分為「商業性營業秘密」及「技術性營業秘密」二大類型，請問下列何者屬於「技術性營業秘密」？","options":["人事管理","經銷據點","產品配方","客戶名單"]},{"id":"Q0127","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":27,"answer":[3],"multiple":false,"question":"某離職同事請求在職員工將離職前所製作之某份文件傳送給他，請問下列回應方式何者正確？","options":["由於該項文件係由該離職員工製作，因此可以傳送文件","若其目的僅為保留檔案備份，便可以傳送文件","可能構成對於營業秘密之侵害，應予拒絕並請他直接向公司提出請求","視彼此交情決定是否傳送文件"]},{"id":"Q0128","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":28,"answer":[1],"multiple":false,"question":"行為人以竊取等不正當方法取得營業秘密，下列敘述何者正確？","options":["已構成犯罪","只要後續沒有洩漏便不構成犯罪","只要後續沒有出現使用之行為便不構成犯罪","只要後續沒有造成所有人之損害便不構成犯罪"]},{"id":"Q0129","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":29,"answer":[3],"multiple":false,"question":"針對在我國境內竊取營業秘密後，意圖在外國、中國大陸或港澳地區使用者，營業秘密法是否可以適用？","options":["無法適用","可以適用，但若屬未遂犯則不罰","可以適用並加重其刑","能否適用需視該國家或地區與我國是否簽訂相互保護營業秘密之條約或協定"]},{"id":"Q0130","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":30,"answer":[4],"multiple":false,"question":"所謂營業秘密，係指方法、技術、製程、配方、程式、設計或其他可用於生產、銷售或經營之資訊，但其保障所需符合的要件不包括下列何者？","options":["因其秘密性而具有實際之經濟價值者","所有人已採取合理之保密措施者","因其秘密性而具有潛在之經濟價值者","一般涉及該類資訊之人所知者"]},{"id":"Q0131","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":31,"answer":[1],"multiple":false,"question":"因故意或過失而不法侵害他人之營業秘密者，負損害賠償責任該損害賠償之請求權，自請求權人知有行為及賠償義務人時起，幾年間不行使就會消滅？","options":["2 年","5 年","7 年","10 年"]},{"id":"Q0132","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":32,"answer":[1],"multiple":false,"question":"公司負責人為了要節省開銷，將員工薪資以高報低來投保全民健保及勞保，是觸犯了刑法上之何種罪刑？","options":["詐欺罪","侵占罪","背信罪","工商秘密罪"]},{"id":"Q0133","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":33,"answer":[2],"multiple":false,"question":"A 受僱於公司擔任會計，因自己的財務陷入危機，多次將公司帳款轉入妻兒戶頭，是觸犯了刑法上之何種罪刑？","options":["洩漏工商秘密罪","侵占罪","詐欺罪","偽造文書罪"]},{"id":"Q0134","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":34,"answer":[3],"multiple":false,"question":"某甲於公司擔任業務經理時，未依規定經董事會同意，私自與自己親友之公司訂定生意合約，會觸犯下列何種罪刑？","options":["侵占罪","貪污罪","背信罪","詐欺罪"]},{"id":"Q0135","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":35,"answer":[1],"multiple":false,"question":"如果你擔任公司採購的職務，親朋好友們會向你推銷自家的產品，希望你要採購時，你應該","options":["適時地婉拒，說明利益需要迴避的考量，請他們見諒","既然是親朋好友，就應該互相幫忙","建議親朋好友將產品折扣，折扣部分歸於自己，就會採購","可以暗中地幫忙親朋好友，進行採購，不要被發現有親友關係便可"]},{"id":"Q0136","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":36,"answer":[3],"multiple":false,"question":"小美是公司的業務經理，有一天巧遇國中同班的死黨小林，發現他是公司的下游廠商老闆。最近小美處理一件公司的招標案件，小林的公司也在其中，私下約小美見面，請求她提供這次招標案的底標，並馬上要給予幾十萬元的前謝金，請問小美該怎麼辦？","options":["退回錢，並告訴小林都是老朋友， 一定會全力幫忙","收下錢，將錢拿出來給單位同事們分紅","應該堅決拒絕，並避免每次見面都與小林談論相關業務問題","朋友一場，給他一個比較接近底標的金額，反正又不是正確的，所以沒關係"]},{"id":"Q0137","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":37,"answer":[3],"multiple":false,"question":"公司發給每人一台平板電腦提供業務上使用，但是發現根本很少在使用， 為了讓它有效的利用，所以將它拿回家給親人使用，這樣的行為是","options":["可以的，這樣就不用花錢買","可以的，反正放在那裡不用它，也是浪費資源","不可以的，因為這是公司的財產，不能私用","不可以的，因為使用年限未到，如果年限到報廢了，便可以拿回家"]},{"id":"Q0138","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":38,"answer":[3],"multiple":false,"question":"公司的車子，假日又沒人使用，你是鑰匙保管者，請問假日可以開出去嗎？","options":["可以，只要付費加油即可","可以，反正假日不影響公務","不可以，因為是公司的，並非私人擁有","不可以，應該是讓公司想要使用的員工，輪流使用才可"]},{"id":"Q0139","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":39,"answer":[4],"multiple":false,"question":"阿哲是財經線的新聞記者，某次採訪中得知A 公司在一個月內將有一個大的併購案，這個併購案顯示公司的財力，且能讓A 公司股價往上飆升。請問阿哲得知此消息後，可以立刻購買該公司的股票嗎？","options":["可以，有錢大家賺","可以，這是我努力獲得的消息","可以，不賺白不賺","不可以，屬於內線消息，必須保持記者之操守，不得洩漏"]},{"id":"Q0140","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":40,"answer":[4],"multiple":false,"question":"與公務機關接洽業務時，下列敘述何者正確？","options":["沒有要求公務員違背職務，花錢疏通而已，並不違法","唆使公務機關承辦採購人員配合浮報價額，僅屬偽造文書行為","口頭允諾行賄金額但還沒送錢，尚不構成犯罪","與公務員同謀之共犯，即便不具公務員身分，仍可依據貪污治罪條例處刑"]},{"id":"Q0141","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":41,"answer":[1],"multiple":false,"question":"與公務機關有業務往來構成職務利害關係者，下列敘述何者正確？","options":["將餽贈之財物請公務員父母代轉，該公務員亦已違反規定","與公務機關承辦人飲宴應酬為增進基本關係的必要方法","高級茶葉低價售予有利害關係之承辦公務員，有價購行為就不算違反法規","機關公務員藉子女婚宴廣邀業務往來廠商之行為，並無不妥"]},{"id":"Q0142","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":42,"answer":[4],"multiple":false,"question":"廠商某甲承攬公共工程，工程進行期間，甲與其工程人員經常招待該公共工程委辦機關之監工及驗收之公務員喝花酒或招待出國旅遊，下列敘述何者正確？","options":["公務員若沒有收現金，就沒有罪","只要工程沒有問題，某甲與監工及驗收等相關公務員就沒有犯罪","因為不是送錢，所以都沒有犯罪","某甲與相關公務員均已涉嫌觸犯貪污治罪條例"]},{"id":"Q0143","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":43,"answer":[1],"multiple":false,"question":"行（受）賄罪成立要素之一為具有對價關係，而作為公務員職務之對價有 「賄賂」或「不正利益」，下列何者不屬於「賄賂」或「不正利益」？","options":["開工邀請公務員觀禮","送百貨公司大額禮券","免除債務","招待吃米其林等級之高檔大餐"]},{"id":"Q0144","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":44,"answer":[4],"multiple":false,"question":"下列有關貪腐的敘述何者錯誤？","options":["貪腐會危害永續發展和法治","貪腐會破壞民主體制及價值觀","貪腐會破壞倫理道德與正義","貪腐有助降低企業的經營成本"]},{"id":"Q0145","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":45,"answer":[4],"multiple":false,"question":"下列何者不是設置反貪腐專責機構須具備的必要條件？","options":["賦予該機構必要的獨立性","使該機構的工作人員行使職權不會受到不當干預","提供該機構必要的資源、專職工作人員及必要培訓","賦予該機構的工作人員有權力可隨時逮捕貪污嫌疑人"]},{"id":"Q0146","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":46,"answer":[2],"multiple":false,"question":"檢舉人向有偵查權機關或政風機構檢舉貪污瀆職，必須於何時為之始可能給與獎金？","options":["犯罪未起訴前","犯罪未發覺前","犯罪未遂前","預備犯罪前"]},{"id":"Q0147","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":47,"answer":[3],"multiple":false,"question":"檢舉人應以何種方式檢舉貪污瀆職始能核給獎金？","options":["匿名","委託他人檢舉","以真實姓名檢舉","以他人名義檢舉"]},{"id":"Q0148","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":48,"answer":[4],"multiple":false,"question":"我國制定何種法律以保護刑事案件之證人，使其勇於出面作證，俾利犯罪之偵查、審判？","options":["貪污治罪條例","刑事訴訟法","行政程序法","證人保護法"]},{"id":"Q0149","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":49,"answer":[1],"multiple":false,"question":"下列何者非屬公司對於企業社會責任實踐之原則？","options":["加強個人資料揭露","維護社會公益","發展永續環境","落實公司治理"]},{"id":"Q0150","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":50,"answer":[1],"multiple":false,"question":"下列何者並不屬於「職業素養」規範中的範疇？","options":["增進自我獲利的能力","擁有正確的職業價值觀","積極進取職業的知識技能","具備良好的職業行為習慣"]},{"id":"Q0151","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":51,"answer":[4],"multiple":false,"question":"下列何者符合專業人員的職業道德？","options":["未經雇主同意，於上班時間從事私人事務","利用雇主的機具設備私自接單生產","未經顧客同意，任意散佈或利用顧客資料","盡力維護雇主及客戶的權益"]},{"id":"Q0152","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":52,"answer":[4],"multiple":false,"question":"身為公司員工必須維護公司利益，下列何者是正確的工作態度或行為？","options":["將公司逾期的產品更改標籤","施工時以省時、省料為獲利首要考量，不顧品質","服務時優先考量公司的利益，顧客權益次之","工作時謹守本分， 以積極態度解決問題"]},{"id":"Q0153","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":53,"answer":[3],"multiple":false,"question":"身為專業技術工作人士，應以何種認知及態度服務客戶？","options":["若客戶不瞭解，就儘量減少成本支出，抬高報價","遇到維修問題，儘量拖過保固期","主動告知可能碰到問題及預防方法","隨著個人心情來提供服務的內容及品質"]},{"id":"Q0154","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":54,"answer":[2],"multiple":false,"question":"因為工作本身需要高度專業技術及知識，所以在對客戶服務時應如何？","options":["不用理會顧客的意見","保持親切、真誠、客戶至上的態度","若價錢較低，就敷衍了事","以專業機密為由，不用對客戶說明及解釋"]},{"id":"Q0155","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":55,"answer":[2],"multiple":false,"question":"從事專業性工作，在與客戶約定時間應","options":["保持彈性，任意調整","儘可能準時，依約定時間完成工作","能拖就拖，能改就改","自己方便就好，不必理會客戶的要求"]},{"id":"Q0156","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":56,"answer":[1],"multiple":false,"question":"從事專業性工作，在服務顧客時應有的態度為何？","options":["選擇最安全、經濟及有效的方法完成工作","選擇工時較長、獲利較多的方法服務客戶","為了降低成本，可以降低安全標準","不必顧及雇主和顧客的立場"]},{"id":"Q0157","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":57,"answer":[4],"multiple":false,"question":"以下那一項員工的作為符合敬業精神？","options":["利用正常工作時間從事私人事務","運用雇主的資源，從事個人工作","未經雇主同意擅離工作崗位","謹守職場紀律及禮節，尊重客戶隱私"]},{"id":"Q0158","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":58,"answer":[3],"multiple":false,"question":"小張獲選為小孩學校的家長會長，這個月要召開會議，沒時間準備資料， 所以，利用上班期間有空檔非休息時間來完成，請問是否可以？","options":["可以， 因為不耽誤他的工作","可以，因為他能力好，能夠同時完成很多事","不可以，因為這是私事，不可以利用上班時間完成","可以，只要不要被發現"]},{"id":"Q0159","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":59,"answer":[2],"multiple":false,"question":"小吳是公司的專用司機，為了能夠隨時用車，經過公司同意，每晚都將公司的車開回家，然而，他發現反正每天上班路線，都要經過女兒學校，就順便載女兒上學，請問可以嗎？","options":["可以，反正順路","不可以，這是公司的車不能私用","可以，只要不被公司發現即可","可以，要資源須有效使用"]},{"id":"Q0160","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":60,"answer":[4],"multiple":false,"question":"小江是職場上的新鮮人，剛進公司不久，他應該具備怎樣的態度？","options":["上班、下班，管好自己便可","仔細觀察公司生態，加入某些小團體，以做為後盾","只要做好人脈關係，這樣以後就好辦事","努力做好自己職掌的業務，樂於工作，與同事之間有良好的互動，相互協助"]},{"id":"Q0161","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":61,"answer":[4],"multiple":false,"question":"在公司內部行使商務禮儀的過程，主要以參與者在公司中的何種條件來訂定順序？","options":["年齡","性別","社會地位","職位"]},{"id":"Q0162","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":62,"answer":[1],"multiple":false,"question":"一位職場新鮮人剛進公司時，良好的工作態度是","options":["多觀察、多學習，了解企業文化和價值觀","多打聽哪一個部門比較輕鬆，升遷機會較多","多探聽哪一個公司在找人，隨時準備跳槽走人","多遊走各部門認識同事，建立自己的小圈圈"]},{"id":"Q0163","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":63,"answer":[1],"multiple":false,"question":"根據消除對婦女一切形式歧視公約(CEDAW)，下列何者正確？","options":["對婦女的歧視指基於性別而作的任何區別、排斥或限制","只關心女性在政治方面的人權和基本自由","未要求政府需消除個人或企業對女性的歧視","傳統習俗應予保護及傳承，即使含有歧視女性的部分，也不可以改變"]},{"id":"Q0164","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":64,"answer":[1],"multiple":false,"question":"某規範明定地政機關進用女性測量助理名額，不得超過該機關測量助理名額總數二分之一，根據消除對婦女一切形式歧視公約(CEDAW)，下列何者正確？","options":["限制女性測量助理人數比例，屬於直接歧視","土地測量經常在戶外工作，基於保護女性所作的限制，不屬性別歧視","此項二分之一規定是為促進男女比例平衡","此限制是為確保機關業務順暢推動，並未歧視女性"]},{"id":"Q0165","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":65,"answer":[4],"multiple":false,"question":"根據消除對婦女一切形式歧視公約(CEDAW)之間接歧視意涵，下列何者錯誤？","options":["一項法律、政策、方案或措施表面上對男性和女性無任何歧視，但實際上卻產生歧視女性的效果","察覺間接歧視的一個方法，是善加利用性別統計與性別分析","如果未正視歧視之結構和歷史模式，及忽略男女權力關係之不平等，可能使現有不平等狀況更為惡化","不論在任何情況下，只要以相同方式對待男性和女性，就能避免間接歧視之產生"]},{"id":"Q0166","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":66,"answer":[4],"multiple":false,"question":"下列何者不是菸害防制法之立法目的？","options":["防制菸害","保護未成年免於菸害","保護孕婦免於菸害","促進菸品的使用"]},{"id":"Q0167","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":67,"answer":[1],"multiple":false,"question":"按菸害防制法規定，對於在禁菸場所吸菸會被罰多少錢？","options":["新臺幣2 千元至1 萬元罰鍰","新臺幣1 千元至5 千元罰鍰","新臺幣1 萬元至5 萬元罰鍰","新臺幣2 萬元至10 萬元罰鍰"]},{"id":"Q0168","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":68,"answer":[3],"multiple":false,"question":"請問下列何者不是個人資料保護法所定義的個人資料？","options":["身分證號碼","最高學歷","職稱","護照號碼"]},{"id":"Q0169","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":69,"answer":[1],"multiple":false,"question":"有關專利權的敘述，下列何者正確？","options":["專利有規定保護年限，當某商品、 技術的專利保護年限屆滿，任何人皆可免費運用該項專利","我發明了某項商品，卻被他人率先申請專利權，我仍可主張擁有這項商品的專利權","製造方法可以申請新型專利權","在本國申請專利之商品進軍國外，不需向他國申請專利權"]},{"id":"Q0170","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":70,"answer":[4],"multiple":false,"question":"下列何者行為會有侵害著作權的問題？","options":["將報導事件事實的新聞文字轉貼於自己的社群網站","直接轉貼高普考考古題在FACEBOOK","以分享網址的方式轉貼資訊分享於社群網站","將講師的授課內容錄音，複製多份分贈友人"]},{"id":"Q0171","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":71,"answer":[1],"multiple":false,"question":"有關著作權之概念，下列何者正確？","options":["國外學者之著作，可受我國著作權法的保護","公務機關所函頒之公文，受我國著作權法的保護","著作權要待向智慧財產權申請通過後才可主張","以傳達事實之新聞報導的語文著作，依然受著作權之保障"]},{"id":"Q0172","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":72,"answer":[1],"multiple":false,"question":"某廠商之商標在我國已經獲准註冊，請問若希望將商品行銷販賣到國外， 請問是否需在當地申請註冊才能主張商標權？","options":["是，因為商標權註冊採取屬地保護原則","否，因為我國申請註冊之商標權在國外也會受到承認","不一定，需視我國是否與商品希望行銷販賣的國家訂有相互商標承認之協定","不一定，需視商品希望行銷販賣的國家是否為WTO 會員國"]},{"id":"Q0173","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":73,"answer":[1],"multiple":false,"question":"下列何者不屬於營業秘密？","options":["具廣告性質的不動產交易底價","須授權取得之產品設計或開發流程圖示","公司內部管制的各種計畫方案","不是公開可查知的客戶名單分析資料"]},{"id":"Q0174","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":74,"answer":[3],"multiple":false,"question":"營業秘密可分為「技術機密」與「商業機密」，下列何者屬於「商業機密」？","options":["程式","設計圖","商業策略","生產製程"]},{"id":"Q0175","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":75,"answer":[3],"multiple":false,"question":"某甲在公務機關擔任首長，其弟弟乙是某協會的理事長，乙為舉辦協會活動，決定向甲服務的機關申請經費補助，下列有關利益衝突迴避之敘述， 何者正確？","options":["協會是舉辦慈善活動，甲認為是好事，所以指示機關承辦人補助活動經費","機關未經公開公平方式，私下直接對協會補助活動經費新臺幣10 萬元","甲應自行迴避該案審查，避免瓜田李下，防止利益衝突","乙為順利取得補助，應該隱瞞是機關首長甲之弟弟的身分"]},{"id":"Q0176","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":76,"answer":[3],"multiple":false,"question":"依公職人員利益衝突迴避法規定，公職人員甲與其小舅子乙（二親等以內的關係人）間，下列何種行為不違反該法？","options":["甲要求受其監督之機關聘用小舅子乙","小舅子乙以請託關說之方式，請求甲之服務機關通過其名下農地變更使用申請案","關係人乙經政府採購法公開招標程序，並主動在投標文件表明與甲的身分關係，取得甲服務機關之年度採購標案","甲、乙兩人均自認為人公正，處事坦蕩，任何往來都是清者自清，不需擔心任何問題"]},{"id":"Q0177","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":77,"answer":[3],"multiple":false,"question":"大雄擔任公司部門主管，代表公司向公務機關投標，為使公司順利取得標案，可以向公務機關的採購人員為以下何種行為？","options":["為社交禮俗需要，贈送價值昂貴的名牌手錶作為見面禮","為與公務機關間有良好互動，招待至有女陪侍場所飲宴","為了解招標文件內容，提出招標文件疑義並請說明","為避免報價錯誤，要求提供底價作為參考"]},{"id":"Q0178","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":78,"answer":[1],"multiple":false,"question":"下列關於政府採購人員之敘述，何者未違反相關規定？","options":["非主動向廠商求取，是偶發地收到廠商致贈價值在新臺幣500 元以下之廣告物、促銷品、 紀念品","要求廠商提供與採購無關之額外服務","利用職務關係向廠商借貸","利用職務關係媒介親友至廠商處所任職"]},{"id":"Q0179","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":79,"answer":[4],"multiple":false,"question":"下列敘述何者錯誤？","options":["憲法保障言論自由，但散布假新聞、假消息仍須面對法律責任","在網路或Line 社群網站收到假訊息，可以敘明案情並附加截圖檔，向法務部調查局檢舉","對新聞媒體報導有意見，向國家通訊傳播委員會申訴","自己或他人捏造、扭曲、竄改或虛構的訊息，只要一小部分能證明是真的，就不會構成假訊息"]},{"id":"Q0180","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":80,"answer":[4],"multiple":false,"question":"下列敘述何者正確？","options":["公務機關委託的代檢（代驗）業者，不是公務員， 不會觸犯到刑法的罪責","賄賂或不正利益，只限於法定貨幣，給予網路遊戲幣沒有違法的問題","在靠北公務員社群網站，覺得可受公評且匿名發文，就可以謾罵公務機關對特定案件的檢查情形","受公務機關委託辦理案件，除履行採購契約應辦事項外，對於蒐集到的個人資料，也要遵守相關保護及保密規定"]},{"id":"Q0181","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":81,"answer":[1],"multiple":false,"question":"有關促進參與及預防貪腐的敘述，下列何者錯誤？","options":["我國非聯合國會員國，無須落實聯合國反貪腐公約規定","推動政府部門以外之個人及團體積極參與預防和打擊貪腐","提高決策過程之透明度，並促進公眾在決策過程中發揮作用","對公職人員訂定執行公務之行為守則或標準"]},{"id":"Q0182","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":82,"answer":[2],"multiple":false,"question":"為建立良好之公司治理制度，公司內部宜納入何種檢舉人制度？","options":["告訴乃論制度","吹哨者（whistleblower）保護程序及保護制度","不告不理制度","非告訴乃論制度"]},{"id":"Q0183","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":83,"answer":[4],"multiple":false,"question":"有關公司訂定誠信經營守則時，下列何者錯誤？","options":["避免與涉有不誠信行為者進行交易","防範侵害營業秘密、商標權、專利權、著作權及其他智慧財產權","建立有效之會計制度及內部控制制度","防範檢舉"]},{"id":"Q0184","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":84,"answer":[1],"multiple":false,"question":"乘坐轎車時，如有司機駕駛，按照國際乘車禮儀，以司機的方位來看，首位應為","options":["後排右側","前座右側","後排左側","後排中間"]},{"id":"Q0185","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":85,"answer":[2],"multiple":false,"question":"今天好友突然來電，想來個「說走就走的旅行」，因此，無法去上班，下列何者作法不適當？","options":["發送E-MAIL 給主管與人事部門，並收到回覆","什麼都無需做，等公司打電話來確認後，再告知即可","用LINE 傳訊息給主管，並確認讀取且有回覆","打電話給主管與人事部門請假"]},{"id":"Q0186","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":86,"answer":[4],"multiple":false,"question":"每天下班回家後，就懶得再出門去買菜，利用上班時間瀏覽線上購物網站，發現有很多限時搶購的便宜商品，還能在下班前就可以送到公司，下班順便帶回家，省掉好多時間，下列何者最適當？","options":["可以，又沒離開工作崗位，且能節省時間","可以，還能介紹同事一同團購，省更多的錢，增進同事情誼","不可以，應該把商品寄回家，不是公司","不可以，上班不能從事個人私務，應該等下班後再網路購物"]},{"id":"Q0187","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":87,"answer":[4],"multiple":false,"question":"宜樺家中養了一隻貓，由於最近生病，獸醫師建議要有人一直陪牠，這樣會恢復快一點，辦公室雖然禁止攜帶寵物，但因為上班家裡無人陪伴，所以準備帶牠到辦公室一起上班，下列何者最適當？","options":["可以，只要我放在寵物箱，不要影響工作即可","可以，同事們都答應也不反對","可以，雖然貓會發出聲音，大小便有異味，只要處理好不影響工作即可","不可以，可以送至專門機構照護或請專人照顧，以免影響工作"]},{"id":"Q0188","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":88,"answer":[4],"multiple":false,"question":"根據性別平等工作法，下列何者非屬職場性騷擾？","options":["公司員工執行職務時，客戶對其講黃色笑話，該員工感覺被冒犯","雇主對求職者要求交往， 作為僱用與否之交換條件","公司員工執行職務時，遭到同事以「女人就是沒大腦」性別歧視用語加以辱罵，該員工感覺其人格尊嚴受損","公司員工下班後搭乘捷運，在捷運上遭到其他乘客偷拍"]},{"id":"Q0189","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":89,"answer":[4],"multiple":false,"question":"根據性別平等工作法，下列何者非屬職場性別歧視？","options":["雇主考量男性賺錢養家之社會期待，提供男性高於女性之薪資","雇主考量女性以家庭為重之社會期待，裁員時優先資遣女性","雇主事先與員工約定倘其有懷孕之情事，必須離職","有未滿2 歲子女之男性員工，也可申請每日六十分鐘的哺乳時間"]},{"id":"Q0190","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":90,"answer":[3],"multiple":false,"question":"根據性別平等工作法，有關雇主防治性騷擾之責任與罰則，下列何者錯誤？","options":["僱用受僱者30 人以上者，應訂定性騷擾防治措施、申訴及懲戒規範","雇主知悉性騷擾發生時，應採取立即有效之糾正及補救措施","雇主違反應訂定性騷擾防治措施之規定時，處以罰鍰即可，不用公布其姓名","雇主違反應訂定性騷擾申訴管道者，應限期令其改善，屆期未改善者，應按次處罰"]},{"id":"Q0191","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":91,"answer":[1],"multiple":false,"question":"根據性騷擾防治法，有關性騷擾之責任與罰則，下列何者錯誤？","options":["對他人為性騷擾者，如果沒有造成他人財產上之損失，就無需負擔金錢賠償之責任","對於因教育、訓練、醫療、公務、業務、求職，受自己監督、照護之人，利用權勢或機會為性騷擾者，得加重科處罰鍰至二分之一","意圖性騷擾，乘人不及抗拒而為親吻、擁抱或觸摸其臀部、胸部或其他身體隱私處之行為者，處2 年以下有期徒刑、拘役或科或併科10 萬元以下罰金","對他人為權勢性騷擾以外之性騷擾者，由直轄市、縣（市）主管機關處1 萬元以上10 萬元以下罰鍰"]},{"id":"Q0192","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":92,"answer":[3],"multiple":false,"question":"根據性別平等工作法規範職場性騷擾範疇，下列何者錯誤？","options":["上班執行職務時，任何人以性要求、具有性意味或性別歧視之言詞或行為，造成敵意性、脅迫性或冒犯性之工作環境","對僱用、求職或執行職務關係受自己指揮、監督之人，利用權勢或機會為性騷擾","與朋友聚餐後回家時，被陌生人以盯梢、守候、尾隨跟蹤","雇主對受僱者或求職者為明示或暗示之性要求、具有性意味或性別歧視之言詞或行為"]},{"id":"Q0193","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":93,"answer":[3],"multiple":false,"question":"根據消除對婦女一切形式歧視公約（CEDAW）之直接歧視及間接歧視意涵，下列何者錯誤？","options":["老闆得知小黃懷孕後，故意將小黃調任薪資待遇較差的工作，意圖使其自行離開職場，小黃老闆的行為是直接歧視","某餐廳於網路上招募外場服務生，條件以未婚年輕女性優先錄取，明顯以性或性別差異為由所實施的差別待遇，為直接歧視","某公司員工值班注意事項排除女性員工參與夜間輪值，是考量女性有人身安全及家庭照顧等需求，為維護女性權益之措施，非直接歧視","某科技公司規定男女員工之加班時數上限及加班費或津貼不同，認為女性能力有限，且無法長時間工作，限制女性獲取薪資及升遷機會，這規定是直接歧視"]},{"id":"Q0194","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":94,"answer":[1],"multiple":false,"question":"目前菸害防制法規範，「不可販賣菸品」給幾歲以下的人？","options":["20","19","18","17"]},{"id":"Q0195","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":95,"answer":[1],"multiple":false,"question":"按菸害防制法規定，下列敘述何者錯誤？","options":["只有老闆、店員才可以出面勸阻在禁菸場所抽菸的人","任何人都可以出面勸阻在禁菸場所抽菸的人","餐廳、旅館設置室內吸菸室，需經專業技師簽證核可","加油站屬易燃易爆場所，任何人都可以勸阻在禁菸場所抽菸的人"]},{"id":"Q0196","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":96,"answer":[3],"multiple":false,"question":"關於菸品對人體危害的敘述，下列何者正確？","options":["只要開電風扇、或是抽風機就可以去除菸霧中的有害物質","指定菸品（如：加熱菸）只要通過健康風險評估，就不會危害健康，因此工作時如果想吸菸，就可以在職場拿出來使用","雖然自己不吸菸，同事在旁邊吸菸，就會增加自己得肺癌的機率","只要不將菸吸入肺部，就不會對身體造成傷害"]},{"id":"Q0197","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":97,"answer":[4],"multiple":false,"question":"職場禁菸的好處不包括","options":["降低吸菸者的菸品使用量，有助於減少吸菸導致的疾病而請假","避免同事因為被動吸菸而生病","讓吸菸者菸癮降低，戒菸較容易成功","吸菸者不能抽菸會影響工作效率"]},{"id":"Q0198","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":98,"answer":[4],"multiple":false,"question":"大多數的吸菸者都嘗試過戒菸，但是很少自己戒菸成功。吸菸的同事要戒菸，怎樣建議他是無效的？","options":["鼓勵他撥打戒菸專線0800-63-63-63，取得相關建議與協助","建議他到醫療院所、社區藥局找藥物戒菸","建議他參加醫院或衛生所辦理的戒菸班","戒菸是自己的事，別人幫不了忙"]},{"id":"Q0199","source":"不分級 工作項目02：工作倫理與職業道德.pdf","section":"90007 工作倫理與職業道德共同科目不分級工作項目01：工作倫理與職業道德","number":99,"answer":[2],"multiple":false,"question":"禁菸場所負責人未於場所入口處設置明顯禁菸標示，要罰該場所負責人多少元？","options":["2 千至1 萬","1 萬至5 萬","1 萬至25 萬","20 萬至100 萬"]},{"id":"Q0200","sour 義","團體的章程","個人偏好","法令"]},{"id":"Q0858","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":458,"answer":[4],"multiple":false,"question":"下列何者非屬就業服務人員對求職人應有的倫理義務？","options":["確保隱私","尊重個案的自主決定","忠實告知","以個人標準影響個案"]},{"id":"Q0859","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":459,"answer":[2],"multiple":false,"question":"就業服務人員應時常參與各界辦理的訓練課程，其主要目的為何？","options":["評鑑要求","充實專業知能","拓展人脈","開拓業務"]},{"id":"Q0860","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":460,"answer":[4],"multiple":false,"question":"為協助助人工作者發展個人的倫理決策模式，胡斯(Van Hoose)和卡特洛(Kottler)擬定一個做倫理決策的流程，其中第1 步驟應為何者？","options":["助人工作者在做倫理決策時，應參考專業倫理規範","評估關係人的權責與福祉","找出衝突或問題的相關因素","識別衝突或兩難問題及問題發生的真實情況"]},{"id":"Q0861","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":461,"answer":[2],"multiple":false,"question":"根據雷梅爾(Reamer)處理倫理困境的原則，下列敘述何者不正確？","options":["傷害到維持人類生命、健康、尊嚴時，優位於傷害到其他，如誠實、保密等","案主自決優於他人的基本福祉之權利","個人自我決定權優於其自身基本福祉的考量","人們在自由意志下同意遵守的法律、機構規定等義務，凌駕於個人的信仰、價值與原則"]},{"id":"Q0862","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":462,"answer":[1],"multiple":false,"question":"下列何者是就業服務人員對機構的倫理？","options":["績效評估","謹守能力範圍","自清","告知後同意"]},{"id":"Q0863","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":463,"answer":[2],"multiple":false,"question":"下列哪一項職業道德與專業倫理是就業服務人員不應有的作為？","options":["尊重求職者對選擇職業的意願","避免結合轄區內公民營機構共同協助就業","針對失業者就業助力與阻力之診斷／評估而直接開立就業推介卡","協助求職者排除就業障礙"]},{"id":"Q0864","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":464,"answer":[3],"multiple":false,"question":"助人工作者在緊急災難中的危機介入與倫理守則中，當需要介入志工動員與安排時，應遵守的倫理守則是","options":["知後同意","資源公平性","案主利益優先","代理案主維護其權益"]},{"id":"Q0865","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":465,"answer":[1],"multiple":false,"question":"關於倫理的敘述，下列何者正確","options":["助人專業倫理以義務論為中心","行政倫理以效益論為中心","社區倫理以博愛論為中心","環境倫理以特殊論為中心"]},{"id":"Q0866","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":466,"answer":[3],"multiple":false,"question":"甲君在某一就業服務機構工作，長期協助職場新鮮人就業，基於達到推介就業的目的，甲君將部分具有長照相關背景的求職者資訊，對外公開給符合政府認證標準的優良廠商，以增加就業機會之取得。請問若從就業服務法的角度來看，下列敘述何者正確？","options":["基於對求職者的保護， 就業服務人員不得以任何理由，對外公開求職者資訊","就業服務人員可根據個人專業與需求，對外公開求職者資訊","就業服務人員，對求職者之資料，除推介就業之必要外，不得對外公開","就業服務人員應聽從主管的領導，作為求職者資訊公開與否的依據"]},{"id":"Q0867","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":467,"answer":[1],"multiple":false,"question":"甲君在職場工作20 年，長期以來都持續表現出符合職業倫理的行為。 乙君雖然初入職場，但很擅長發現哪些行為會違反職業倫理問題。若從瑞斯特(Rest)所提出的道德4 要素，包括道德敏感度(moral sensitivity)、道德判斷(moral judgement)、道德動機(moral motivation) 與道德人格(moral character)來看，甲君與乙君的行為表現，下列敘述何者最為正確？","options":["甲君具有道德人格；乙君具有道德敏感度","甲君具有道德人格；乙君具有道德動機","甲君具有道德敏感度；乙君具有道德人格","甲君具有道德動機；乙君具有道德人格"]},{"id":"Q0868","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":468,"answer":[3],"multiple":false,"question":"甲君在職場工作已有5 年之久，最近他發現自己的好同事挪用公款，但為了維持同事間的情誼而沒有去舉發這位同事的錯誤行為。請問若從柯柏格(Kohlberg)的6 個道德發展階段來看，甲君最有可能處在下列哪一個階段？","options":["服從與懲罰定向","利己主義定向","人際和諧與一致","維護權威與社會秩序定向"]},{"id":"Q0869","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":469,"answer":[1],"multiple":false,"question":"甲君向諮詢人員哭訴自己的工作搭檔乙君在工作上沒有時間概念，行為也不受控制。有一次甲君與乙君一起出差，乙君竟然趁客戶不注意，偷走錢包。若從佛洛依德(Freud)的人格結構來看乙君的道德發展與行為表現，下列敘述何者正確？","options":["乙君的「本我｣(id)最強","乙君的「自我 ｣(ego)最強","乙君的「超我｣(superego)最強","乙君的「無我｣(non- self)最強"]},{"id":"Q0870","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":470,"answer":[2],"multiple":false,"question":"目的論(Teleology)、道義論(Deontology)、德行論(Virtur)與行為論 (Behaviorism)等理論經常被用來判斷行為是否合乎倫理規範。甲君根據上述理論，反思自己在判斷職場行為對錯時，大都以工作者的意圖與動機作為依據。請問甲君的行為，最符合下列何種理論？","options":["目的論","道義論","德行論","行為論"]},{"id":"Q0871","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":471,"answer":[2],"multiple":false,"question":"甲君公司每年都會實施職場倫理課程，要求每位員工至少要上課3 小時。人資部門在訓練方式上，以一個「海因茲偷藥｣的兩難故事要求員工作出道德判斷，請問這種教學法，最可能是下列何者？","options":["自我澄清法","討論教學法","聯想法","融滲式教學法"]},{"id":"Q0872","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":472,"answer":[1],"multiple":false,"question":"甲君、乙君、丙君3 人即將從學校進入職場，甲君期許自己要尊重上司；乙君希望自己要與同事合作；丙君認為在競爭的年代，顧好自己最重要。請問這3 人的敘述，誰的主張符合職場倫理？","options":["甲君與乙君","乙君與丙君","丙君與甲君","甲君、乙君與丙君"]},{"id":"Q0873","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":473,"answer":[4],"multiple":false,"question":"甲君提醒乙君進入職場工作應該要有好的工作態度，下列敘述，何者最能反映良好工作態度？","options":["少做事多計較","自掃門前雪","寬以待己，嚴以律人","己所不欲勿施於人"]},{"id":"Q0874","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":474,"answer":[4],"multiple":false,"question":"甲君、乙君、丙君3 人在討論職場倫理的定義，甲君認為倫理是人類是非善惡的標準及行為準則。乙君認為職業倫理是基於道德觀點所做的有關「對｣與「錯｣的判斷。丙君主張一般職場工作規則就是專業倫理。請問他們3 人對職業倫理的看法，何者最為正確？","options":["甲君與丙君","乙君與丙君","甲君、乙君與丙君","甲君與乙君"]},{"id":"Q0875","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":475,"answer":[1],"multiple":false,"question":"甲君選用源自美國哈佛大學的「個案教學法｣進行職場倫理教學。此法的教學步驟，包括：A 描述(description)、B 分析(analysis)、C 詮釋 (interpretation)、D 行動(action)、E 評價(evaluation)。甲君引導學生對個案的情形，做客觀的觀察與表達。請問甲君運用了上述何種步驟？","options":["描述(description)","分析(analysis)","詮釋(interpretation)","行動 (action)"]},{"id":"Q0876","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":476,"answer":[1],"multiple":false,"question":"有關「職場倫理｣的「職場｣狹義定義，下列敘述何者正確？","options":["職場指的是工作場域","職場指的是家庭場域","職場指的是社區場域","職場指的是學習場域"]},{"id":"Q0877","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":477,"answer":[3],"multiple":false,"question":"有關職場倫理基本精神的落實，下列敘述何者最為適當？","options":["著重在建立禮儀或守則的規範，不含倫理抉擇的思辨分析","只適用特定職業， 有許多職業並不需要職場倫理","不只是建立禮儀或守則的規範，更要省思規範的合理性","強調倫理抉擇的思辨分析，而不用考慮禮儀或守則的規範"]},{"id":"Q0878","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":478,"answer":[3],"multiple":false,"question":"甲君在職場工作時，不慎把主管交辦的工作做錯了，一方面害怕受到責備，另方面又覺得要讓主管知道。於是請教好友乙君與丙君，乙君說： 「只要不被主管發現就好了，不需要說｣。丙君提醒甲君：「你那麼努力工作，不說就可以保有好的考績｣。甲君左思右想，決定還是向主管坦白。請問這3 人的做法，下列敘述何者正確？","options":["丙君的做法，能夠兼顧個人的努力與權益","乙君的做法，是1 種負責與承擔的表現","甲君的做法，符合誠實的倫理也可以減輕問題造成的傷害","丙君、乙君及甲君的做法，都是1 種敬業的表現"]},{"id":"Q0879","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":479,"answer":[2],"multiple":false,"question":"在職場中，每個人或多或少都會與來自不同成長背景的夥伴共事，有些夥伴很難相處，其行為表現與自己差異很大。面對此種情況，最適合依循下列何種行為法則？","options":["請調部門","包容差異","視若無睹","勤勞節儉"]},{"id":"Q0880","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":480,"answer":[2],"multiple":false,"question":"甲君注意到主管怎麼做，部屬就很容易跟著學。若從這個角度來看，下列何種做法最能運用到上行下效的效果","options":["賞罰分明","角色榜樣","隨機應變","自我管理"]},{"id":"Q0881","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":481,"answer":[3],"multiple":false,"question":"在「員工協助方案｣(Employee Assistance Program，EAP)的諮詢會談中，求助員工向諮詢人員提到傷害自己的計畫。下列敘述，何者最符合專業人員應注意的倫理原則？","options":["尊重個案的自主性，不應介入干預","毋需太過擔心，順其自然就好","注意個案自主性的範圍，不包括傷害自己","要為個案保密，維護其自主性的發揮"]},{"id":"Q0882","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":482,"answer":[2],"multiple":false,"question":"就業服務人員甲君在員工諮詢會談中，發現接受諮詢的員工乙君與同事相處不愉快，而且有離職計畫。在乙君不知情的狀況下，甲君將前述會談內容告知主管。請問甲君的做法可能違反下列何種倫理？","options":["雙重關係","知後同意","溝通特權","專業督導"]},{"id":"Q0883","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":483,"answer":[2],"multiple":false,"question":"甲君與乙君最近都遭遇工作與家庭難以取得平衡的困擾，不僅工作壓力大，而且有親子衝突。二人同時求助某私立就業服務機構，該機構諮詢人員認為甲君是乙君的主管，可以優先服務，就告訴乙君諮詢預約已滿額，要等候一段時間。請問這位諮詢人員的做法最可能違反下列何種倫理？","options":["自主性","公正性","忠誠性","保密性"]},{"id":"Q0884","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":484,"answer":[3],"multiple":false,"question":"目前臺灣在校園推動職場倫理教育，主要有四種形式，包括：滲融式課程、單一課程、服務學習式課程，以及非正式課程。其中有一種課程最為強調「做中學｣，學生需要親至工作場域，從付出與參與中學習職場倫理。請問下列何種課程形式最為符合？","options":["滲融式課程","單一課程","服務學習式課程","非正式課程"]},{"id":"Q0885","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":485,"answer":[3],"multiple":false,"question":"隨著時代變遷，許多企業發現有部分新進員工取得工作機會後，經常會出現未經請假就缺班或上班遲到，甚至不認同企業，異動頻繁。請問此一現象，最可能反映職場何種工作價值倫理正在消失？","options":["應變力","專業性","忠誠度","契合度"]},{"id":"Q0886","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":486,"answer":[2],"multiple":false,"question":"A、B、C、D 四家公司招募員工，除了學歷、面試與筆試之外，A 公司特別要求精通英文和日文；B 公司強調誠信與團隊精神；C 公司注重專業能力；D 公司強調尊重與負責。請問對於職業倫理特別重視的公司， 是指下列何者？","options":["A 與C","B 與D","A 與B","C 與D"]},{"id":"Q0887","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":487,"answer":[1],"multiple":false,"question":"甲君與乙君都是公務員，二人私下各有支持的政治黨派。最近甲君常在辦公室中力挺特定黨派並拉票。請問甲君的做法違反下列何種倫理？","options":["行政倫理","專業倫理","個人倫理","公共倫理"]},{"id":"Q0888","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":488,"answer":[2],"multiple":false,"question":"政府在制定與執行各項政策時，為能實現公共利益與社會正義。當政策涉及專業，而決策者又無法憑自身知識處理時，就必須請求協助。下列敘述，何者最符合此種狀況所涉及之職場倫理？","options":["行政倫理","專業倫理","個人倫理","公共倫理"]},{"id":"Q0889","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":489,"answer":[1],"multiple":false,"question":"職場環境瞬息萬變，挑戰與誘惑有時就會化身出現來考驗一個人的內在自制力。因此在職場中自我反省，檢視自己的價值判斷相當重要。請問此種強調內在反思的能力，最有可能是何種職場倫理？","options":["個人倫理","公共倫理","行政倫理","專業倫理"]},{"id":"Q0890","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":490,"answer":[3],"multiple":false,"question":"某職訓中心辦理職場倫理講座，主講人以A、B、C 三個例子做說明。 A 為「謹言慎行，融入團隊｣、B 為「上班空檔，網購個人用品｣、C 為 「友愛同仁，代替上班打卡｣。請問上述舉例，何者符合職場倫理？","options":["A 與B 符合","A 與C 符合","只有A 符合","只有C 符合"]},{"id":"Q0891","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":491,"answer":[4],"multiple":false,"question":"送禮是華人文化的重要公關行為，企業之間的交流與互動有時也會送禮。下列何者最符合職場表達感謝又不會造成誤解的送禮時機？","options":["雙方簽約合作之前送禮，禮物價格愈高愈好","選擇聖誕節送禮，並以主事者喜好的個人貼身用品為主","雙方尚在契約合作歷程中，見面最容易，也是送禮最佳時機","雙方合作關係結束，且已完成契約明定之任務，以送禮來表示感謝是最佳時機"]},{"id":"Q0892","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":492,"answer":[1],"multiple":false,"question":"甲君有豐富的國際工作經驗，他發現有些國家將「同志婚姻｣視為合法，但也有國家視為不合法。不同國家有不同的規範，由各國的人民所認同與遵循，此種尊重各國群體利益的倫理守則標準，最有可能是下列何種理論？","options":["社會契約論(social contract)","道義論(deontology)","自我決定論(Self-determination theory)","本我論(id theory)"]},{"id":"Q0893","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":493,"answer":[4],"multiple":false,"question":"甲君任職的公司，規劃有「倫理困境｣之相關課程活動，反思自己的工作行為是否符合道德。乙君任職的公司則會辦理「淨灘｣公益活動，鼓勵員工一起到海邊撿拾垃圾，維護環境。就倫理的觀點來看，下列何者最為正確？","options":["甲君的公司重視回饋社會；乙君的公司重視企業內部道德檢視","甲君與乙君的公司都重視企業內部道德檢視","甲君與乙君的公司都重視回饋社會","甲君的公司重視企業內部道德檢視；乙君的公司重視回饋社會"]},{"id":"Q0894","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":494,"answer":[1],"multiple":false,"question":"甲君任職某個家族企業，公司裡有很多員工是老闆的親戚。甲君工作 10 年之後，發現自己很認真努力，然而在主管眼中始終有一種「自己人｣與「非自己人｣的差別待遇，請問從職場的領導關係來看，下列何種概念最能詮釋此一現象？","options":["差序格局(Structure of Grade)","破窗效應 (Break Pane Law)","天花板效應(Ceiling Effect)","腳在門檻內(Foot in the Door)"]},{"id":"Q0895","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":495,"answer":[3],"multiple":false,"question":"甲君選擇公務員作為終身志業，他經常提醒自己要有行政倫理。最近他的工作面臨一項重大決策。他從「適當性｣、「必要性｣以及「衡量性｣ 三個角度來回反思，希望在倫理正義上能夠取利之最大而害之最輕者。 請問下列敘述，何者是甲君最可能依循的倫理原則？","options":["誠實信用","信賴保謢","比例原則","公益原則"]},{"id":"Q0896","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":496,"answer":[1],"multiple":false,"question":"有關職場倫理教育，多數企業主管與學校教師都強調要讓學生在實際的生活中體驗倫理，比講授倫理的定義更有效，也更生動。請問下列敘述，何者最符合此種道德倫理教學法？","options":["生活倫理化(living ethics)","倫理案例教學(case of ethic)","行動學習(action learning)","倫理領導 (ethical leadership)"]},{"id":"Q0897","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":497,"answer":[1],"multiple":false,"question":"某企業為節省成本常利用晚間排放廢水，造成臨近河川汙染。甲君認為只要公司不受罰，就可以繼續排放廢水；然而乙君卻認為排放廢水造成河川汙染，違反正義，是傷人又傷己的行為。從柯柏格(kohlberg)的道德發展階段來看，下列敘述何者正確？","options":["甲君是避罰服從取向；乙君是普遍倫理取向","甲君是順從權威取向；乙君是相對功利取向","甲君是避罰服從取向；乙君是法治觀念取向","甲君是順從權威取向；乙君是尋求認可取向"]},{"id":"Q0898","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":498,"answer":[2],"multiple":false,"question":"甲君與乙君分別在A、B 兩家公司任職。甲君力邀乙君轉職，強調乙君只要將B 公司的工作機密帶到A 公司，就可以獲得員工貢獻獎金100 萬。適巧乙君家人生病急需用錢，乙君考量薪水收入，最後轉職A 公司，但拒絕提供B 公司工作機密，而選擇員工貸款100 萬。請問下列敘述，何者正確？","options":["甲君致力取得機密，乙君致力維護機密，兩人都很敬業並具有職場倫理","乙君致力維護機密，具有敬業精神；甲君很為公司設想，但違反職場倫理","甲君致力為公司設想，比乙君更具敬業精神與職場倫理","甲君與乙君只是立場不同，兩人的表現都沒有違反職場倫理"]},{"id":"Q0899","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":499,"answer":[1],"multiple":false,"question":"所謂社會資源(Social Resources)係指對社會環境不能適應的哪些人，提供人力、物力、財力、社會制度或福利設施及個案工作人員等，提供使其過著正常的社會生活的事與物而言。下列何者屬財力資源？","options":["基金會","社區心理衛生中心","文化中心","社區活動中心"]},{"id":"Q0900","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":500,"answer":[4],"multiple":false,"question":"人力資源是影響就業服務機構成效的第一個外在因素，下列何者是在公立就業服務機構內所需的人力資源？","options":["外來訪客","地方領袖","小學學生","專業工作者"]},{"id":"Q0901","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":501,"answer":[2],"multiple":false,"question":"若以求職者為主體，社會資源可區分為內在與外在資源2 種，下列何者是指內在資源？","options":["助人者","家庭","親友","鄰居"]},{"id":"Q0902","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":502,"answer":[1],"multiple":false,"question":"若以求職者為主體，社會資源可區分為內在與外在資源2 種，下列何者是外在資源？","options":["助人者、親友鄰居","家庭成員間的忠誠度","個人的智力、體力","瞭解自我處境"]},{"id":"Q0903","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":503,"answer":[4],"multiple":false,"question":"就業服務工作是一項助人專業，在助人的過程中社會資源的運用與助人服務的成效有著密切關聯。一般而言，社會資源包括有形和無形資源， 下列何者是有形的資源？","options":["社會關係","專業技術","信念","財力"]},{"id":"Q0904","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":504,"answer":[2],"multiple":false,"question":"就業服務工作是一項助人專業，在助人的過程中社會資源的運用與助人服務的成效有著密切關聯。一般而言，社會資源包括有形和無形資源， 下列何者是無形的資源？","options":["志願者","專業技術","物力","財力"]},{"id":"Q0905","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":505,"answer":[1],"multiple":false,"question":"社會資源的種類，學者間有不同的看法，梁偉康等人將社會資源分為廣義與狹義兩方面，下列何者是屬於狹義的社會資源？","options":["社區資源","人力資源","策略資源","方案資源"]},{"id":"Q0906","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":506,"answer":[1],"multiple":false,"question":"就業服務需要透過許多社會資源的協同合作，才能提供求職者最完善的服務。下列何者比較不是就業服務需要的社會資源系統","options":["環境保護系統","經濟系統","法律系統","社會化教育系統"]},{"id":"Q0907","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":507,"answer":[3],"multiple":false,"question":"當求職者專長經評估不適合當前就業市場需求時，可建議他向哪1 類單位求助？","options":["張老師","健康保險機構","職業訓練機構","生命線與補習班"]},{"id":"Q0908","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":508,"answer":[3],"multiple":false,"question":"公立就業服務機構提供就業服務過程中，如遇到自殺暨高危險群之求職者，下列何者為適當的轉介機構？","options":["運動休閒中心","民眾活動中心","各直轄市、縣市社區心理衛生中心","各縣市勞工育樂中心"]},{"id":"Q0909","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":509,"answer":[1],"multiple":false,"question":"為協助身心障礙者就業，公立就業服務機構之就業服務人員可以有效轉介的社會資源為何者？","options":["直轄市／縣市政府職業重建個管員","身心障礙者職業重建資源服務中心","庇護工場","教會"]},{"id":"Q0910","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":510,"answer":[4],"multiple":false,"question":"社會資源的運用，對就業服務專業人員而言是非常重要的，惟其仍有實務上的限制。根據國內學者研究，下列何者不是國內社會資源輸送的問題？","options":["不可近性","不連續性","不公平性","責信性"]},{"id":"Q0911","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":511,"answer":[2],"multiple":false,"question":"每一個社會蘊藏著許多社會資源，就業服務人員可讓求職者從各項社會資源獲得協助，而開啟外部社會資源鑰匙之技巧是？","options":["傾聽技巧","轉介技巧","澄清技巧","面質技巧"]},{"id":"Q0912","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":512,"answer":[2],"multiple":false,"question":"資源有限是人類社會共同的認知，就業服務人員在處理分配問題時需要堅守哪一原則？","options":["保密","正義","專業分際","專業知能"]},{"id":"Q0913","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":513,"answer":[3],"multiple":false,"question":"近來社會資源理論的發展已朝向著重社會支持的概念，且特別重視非正式網絡的支持系統，所以社會網絡介入模式不僅很重要，亦關係到專業人員的角色。下列哪一種模式與「就業服務」關係最密切？","options":["臨床治療模式","家庭照料者之增強模式","個案管理模式","志工連結模式"]},{"id":"Q0914","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":514,"answer":[3],"multiple":false,"question":"在就業服務工作的過程中，不論是外在資源的補助或心理的支持，或多或少都能化解個人的壓力程度，這是指壓力緩衝盾中的","options":["生活經驗","態度或信仰","支持系統","社會行動技巧"]},{"id":"Q0915","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":515,"answer":[1],"multiple":false,"question":"公立就業服務機構的角色功能之一，在於積極主動服務就業能力薄弱的特定對象。在原住民部落推動下列哪件事最能夠有效開創原住民在部落裡的就業機會？","options":["推廣在地文化產業","設立中小學","設立家暴防治中心","推廣戒酒方案"]},{"id":"Q0916","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":516,"answer":[2],"multiple":false,"question":"甲君在十年前透過仲介從越南嫁到臺灣，她的丈夫因為車禍半癱、失業，儘管家中稍有積蓄，但甲君擔心坐吃山空，來到公立就業服務機構求職，她不會看、寫中文，也沒有特殊工作技能。請問：哪種社會資源最能解決她的根本問題？","options":["急難救助","職業訓練","托育服務","醫療服務"]},{"id":"Q0917","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":517,"answer":[4],"multiple":false,"question":"根據林南(Lin-nan)的社會資本理論(Social Capital Theory)，就業服務員應該鼓勵求職者善用哪一種連結以獲得更多元而豐富的就業資訊？","options":["正連結","負連結","強連結","弱連結"]},{"id":"Q0918","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":518,"answer":[2],"multiple":false,"question":"在社會服務的過程中，社會資源的盤整運用不涉及哪些人？","options":["贊助者","儲存者","輸送者","使用者"]},{"id":"Q0919","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":519,"answer":[3],"multiple":false,"question":"〈多元就業開發方案〉是我國解決失業問題的重要政策之一，下列哪一個描述與社會型〈多元就業開發方案〉不相符？","options":["由政府與非營利組織合作開發","強調在地就業機會的創造","以廣泛僱用民眾為主要目標","非營利組織需要在補助結束後持續僱用一定比例人員"]},{"id":"Q0920","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":520,"answer":[2],"multiple":false,"question":"以求職者為主體，社會資源區分為內在、外在資源。下列何者是外在資源？","options":["家人支持","家事服務","家人溝通","家人同理"]},{"id":"Q0921","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":521,"answer":[3],"multiple":false,"question":"下列何者不是就業服務人員可運用的非正式社會人力資源？","options":["心理諮詢專家","學者的創新知識資源","政府機關的人力資源","社區志工"]},{"id":"Q0922","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":522,"answer":[3],"multiple":false,"que 級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":669,"answer":[1,2,3],"multiple":true,"question":"依私立就業服務機構收費項目及金額標準規定，營利之私立就業服務機構接受外籍看護工委任辦理就業服務業務，每月得向外國人收取服務費，下列何者正確？","options":["第1 年每月不得超過新臺幣1,800 元","第2 年每月不得超過新臺幣1,700 元","第3 年起每月不得超過新臺幣1,500 元","曾受聘僱工作2 年以上，因聘僱關係終止或聘僱許可期間屆滿出國後再入國工作，並受聘僱於同1 雇主者，每月不得超過新臺幣1,800 元"]},{"id":"Q1070","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":670,"answer":[1,3,4],"multiple":true,"question":"依雇主聘僱外國人許可及管理辦法規定，雇主聘僱外國人從事製造工作，有關設置生活照顧服務人員之資格，下列何者正確？","options":["取得就業服務專業人員證書者","高中(職)畢業，並具2 年以上工作經驗者","具從事外國人生活照顧服務工作2 年以上經驗者","大專校院畢業，並具1 年以上工作經驗者"]},{"id":"Q1071","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":671,"answer":[1,2,3],"multiple":true,"question":"依受聘僱外國人健康檢查管理辦法規定，有關外籍家庭看護工辦理健康檢查時程，下列何者正確？","options":["申請入國簽證時，應檢具認可醫院核發之3 個月內健康檢查合格證明","入國後3 工作日內，雇主應安排其至指定醫院接受健康檢查","入國工作滿6 個月、18 個月及30 個月之日前後30 日內，雇主應安排其至指定醫院接受定期健康檢查","雇主因故未能依限安排外國人辦理入國後之健康檢查者，得於逾期後延長7 個工作日補行辦理"]},{"id":"Q1072","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":672,"answer":[3,4],"multiple":true,"question":"依就業服務法規定，有關外國人轉換雇主下列哪些正確？","options":["雇主聘僱之外國人於聘僱許可有效期間內，如需轉換雇主或受聘僱於二以上之雇主者，應由外國人申請許可","受聘僱從事第46 條第1 項第1 款至第7 款規定工作之外國人轉換雇主或工作者，得從事同條項第8 款至第11 款規定之工作","受聘僱從事海洋漁撈工作之外國人，除有第59 條第1 項各款規定之情事，經中央主管機關核准者，不得轉換雇主或工作","受聘僱之外國人經許可轉換雇主或工作者，其受聘僱期間應合併計算之，並受第52 條規定之限制"]},{"id":"Q1073","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":673,"answer":[1,2,3],"multiple":true,"question":"依就業服務法規定，雇主申請聘僱外國人從事營造之工作，辦理國內招募，下列哪些正確？","options":["應先以合理勞動條件在國內辦理招募，經招募無法滿足其需要時，始得就該不足人數提出申請","並應於招募時，將招募全部內容通知其事業單位之工會或勞工，並於外國人預定工作之場所公告之","雇主對於公立就業服務機構所推介之求職人，非有正當理由不得拒絕","雇主得於辦理國內招募時提供不實資料"]},{"id":"Q1074","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":674,"answer":[1,2,4],"multiple":true,"question":"依就業服務法規定，任何人有媒介外國人非法為他人工作之情事者，其處罰之規定，下列哪些為正確？","options":["處新臺幣10 萬元以上50 萬元以下罰鍰","其於5 年內再違反者，處1 年以下有期徒刑、拘役或科或併科新臺幣60 萬元以下罰金","意圖營利而違反者，處5 年以下有期徒刑、 拘役或科或併科新臺幣120 萬元以下罰金","法人之代表人、法人或自然人之代理人、受僱人或其他從業人員，因執行業務違反規定者，除處罰其行為人外，對該法人或自然人亦科處各該項之罰鍰或罰金"]},{"id":"Q1075","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":675,"answer":[1,2,4],"multiple":true,"question":"依就業服務法規定，任何人有非法容留外國人從事工作之情事，下列敘述何者正確","options":["處新臺幣15 萬元以上75 萬元以下罰鍰","其於5 年內再違反者，處3 年以下有期徒刑、拘役或科或併科新臺幣120 萬元以下罰金","意圖營利而違反者，處3 年以下有期徒刑、拘役或科或併科新臺幣120 萬元以下罰金","法人之代表人、法人或自然人之代理人、受僱人或其他從業人員，因執行業務違反規定者，除處罰其行為人外，對該法人或自然人亦科處罰鍰或罰金"]},{"id":"Q1076","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":676,"answer":[1,2],"multiple":true,"question":"依就業服務法規定，有關雇主得向中央主管機關申請遞補外國人規定， 下列哪些正確？","options":["外國人從事製造業工作，於聘僱許可有效期間內， 因不可歸責於雇主之原因出國、死亡或發生行蹤不明之情事經依規定通知入出國管理機關及警察機關滿3 個月仍未查獲者","雇主聘僱之外籍家庭看護，因於入出國機場或收容單位發生行蹤不明之情事，依規定通知入出國管理機關及警察機關","雇主聘僱之外籍家庭看護，於雇主處所發生行蹤不明之情事，依規定通知入出國管理機關及警察機關滿3 個月仍未查獲","遞補之聘僱許可期間，以補足原聘僱許可期間為限；原聘僱許可所餘期間不足1 年者，不予遞補"]},{"id":"Q1077","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":677,"answer":[1,4],"multiple":true,"question":"依雇主聘僱外國人許可及管理辦法規定，雇主申請聘僱從事本法第46 條第1 項第8 款至第10 款規定工作之外國人，應依外國人生活照顧服務計畫書確實執行，下列哪些正確？","options":["外國人生活照顧服務計畫書， 應規劃飲食及住宿之安全衛生、人身安全及健康之保護","雇主聘僱外籍家庭幫傭或家庭看護工，免規劃生活照顧服務人員","雇主變更住宿地點，應於變更後至遲14 日內，以書面通知外國人工作所在地或住宿地點之當地主管機關","雇主未依外國人生活照顧服務計畫書執行，經當地主管機關認定情節輕微者，得先以書面通知限期改善"]},{"id":"Q1078","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":678,"answer":[1,2],"multiple":true,"question":"依雇主聘僱外國人許可及管理辦法規定，雇主繳納就業安定費，下列哪些正確？","options":["自聘僱之外國人入國翌日或接續聘僱日起至聘僱許可屆滿日或廢止聘僱許可前一日止計算","聘僱外國人於養護機構從事機構看護工作，每月應繳就業安定費新臺幣2000 元","雇主應於次季第二個月至遲30 日前，向就業安定基金專戶繳納就業安定費","雇主聘僱外國人之當月日數未滿一個月者，其就業安定費依一個月計算"]},{"id":"Q1079","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":" "id":"Q1118","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":718,"answer":[1,2,3],"multiple":true,"question":"依就業保險促進就業實施辦法規定，促進就業措施之範圍包括下列哪些項目？","options":["僱用獎助措施","推介從事臨時工作","補助求職交通費用","職業訓練生活津貼"]},{"id":"Q1119","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":719,"answer":[2,3,4],"multiple":true,"question":"依就業保險法規定，下列敘述哪些正確？","options":["被保險人對保險人核定之案件發生爭議時，應先向職業安全衛生署申請審議","被保險人對於爭議審議結果不服時，得依法提起訴願及行政訴訟","就業保險業務，依法由勞工保險監理委員會監理","就業保險，由勞動部委任勞工保險局辦理"]},{"id":"Q1120","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":720,"answer":[1,2,3],"multiple":true,"question":"依就業保險法規定，有關「提早就業獎助津貼」之請領資格、給付金額及次數，下列哪些正確？","options":["需先符合失業給付請領條件","需於失業給付請領期間屆滿前受僱工作","其再就業時需再次參加就業保險三個月以上","給付金額為尚未請領之失業給付金額之百分之五十，按月發給"]},{"id":"Q1121","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":721,"answer":[1,2,3],"multiple":true,"question":"依就業保險法，有關失業給付之請領規定，下列哪些正確？","options":["被保險人需於非自願離職辦理退保當日前3 年內，保險年資合計滿1 年以上","需具有工作能力及繼續工作意願","需向公立就業服務機構辦理求職登記","需自求職登記之日起10 日內仍無法推介就業或安排職業訓練"]},{"id":"Q1122","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":722,"answer":[1,2,4],"multiple":true,"question":"依就業保險法規定，有關失業給付之請領期間，下列哪些正確？","options":["最長發給6 個月，但申請人離職辦理本保險退保時，已年滿45 歲或領有社政主管機關核發之身心障礙證明者，最長發給9 個月","中央主管機關於經濟不景氣致大量失業或其他緊急情事時，於審酌失業率及其他情形後，得延長前項之給付期間最長至9 個月，必要時得再延長之，但最長不得超過12 個月","延長失業給付實施期間屆滿後，申請人仍得繼續請領延長失業給付，直到其延長期間屆滿為止","符合請領延長失業給付者，於延長失業給付實施期間屆滿前，經公立就業服務機構完成失業再認定，保險人應發給當月之失業給付"]},{"id":"Q1123","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":723,"answer":[1,3,4],"multiple":true,"question":"依就業保險法，有關參加就業保險之規定，下列哪些正確？","options":["其資格條件應為年滿15 歲以上，65 歲以下之受僱勞工，且應參加本保險為被保險人","與在中華民國境內設有戶籍之國民結婚，且獲准居留依法在臺灣地區工作之外國人不得加保","應以其雇主或所屬機構為投保單位","受僱於二個以上雇主者，得擇一參加本保險"]},{"id":"Q1124","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":724,"answer":[2,3,4],"multiple":true,"question":"依就業保險法規定，仍得請領失業給付之情形，下列哪些正確？","options":["申請人不接受公立就業服務機構推介工資高於其每月得請領之失業給付數額之工作","申請人對公立就業服務機構安排之就業諮詢或職業訓練， 因傷病診療，持有證明而無法參加者","申請人為參加職業訓練，需要變更現在住所，經公立就業服務機構認定顯有困難者","公立就業服務機構推介申請人之工作，其工作地點距離申請人日常居住處所30 公里以上，而經申請人拒絕者"]},{"id":"Q1125","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":725,"answer":[2,3,4],"multiple":true,"question":"依就業保險法第10 條規定，下列哪些是就業保險之保險給付項目？","options":["僱用獎助措施","失業給付","職業訓練生活津貼","育嬰留職停薪津貼"]},{"id":"Q1126","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":726,"answer":[2,3,4],"multiple":true,"question":"依就業保險促進就業實施辦法規定，雇主有下列哪些情況之一者，公立就業服務機構應不予發給僱用獎助；已發給者，經撤銷原核定之獎助後，應追還之？","options":["申請僱用獎助前，未依身心障礙者權益保障法規定，足額進用身心障礙者，但已繳納差額補助費","未為應參加就業保險之受僱勞工申報參加就業保險","僱用雇主或事業單位負責人之配偶、直系血親或三親等內之旁系血親","同一雇主再僱用離職未滿一年之勞工"]},{"id":"Q1127","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":727,"answer":[2,3,4],"multiple":true,"question":"依就業保險法規定，下列哪些對象不得參加就業保險？","options":["與在中華民國境內設有戶籍之國民結婚，且獲准居留依法在臺灣地區工作之外國人、大陸地區人民、香港居民或澳門居民","依法應參加公教人員保險或軍人保險者","已領取勞工保險老年給付或公教人員保險養老給付","受僱於依法免辦登記且無核定課稅或依法免辦登記且無統一發票購票證之雇主或機構"]},{"id":"Q1128","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":728,"answer":[1,2,4],"multiple":true,"question":"依就業保險法規定，所稱非自願離職，下列哪些正確？","options":["被保險人因投保單位關廠、遷廠、休業、解散、破產宣告離職","參加就業保險勞工不能勝任工作，經雇主終止勞動契約者","勞工因健康不佳，不得已辭職休養","被保險人因定期契約屆滿離職，逾一個月未能就業，且離職前一年內，契約期間合計滿六個月以上者"]},{"id":"Q1129","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":729,"answer":[1,3,4],"multiple":true,"question":"依就業保險法規定，有關請領眷屬加計給付規定，下列哪些正確？","options":["保險人請領失業給付期間，有受其扶養之眷屬者，每一人按申請人離職辦理本保險退保之當月起前6 個月平均月 :[2,3,4],"multiple":true,"question":"依勞工職業災害保險及保護法規定，下列有關投保單位對應繳納之保險費，未依規定限期繳納者之處理敘述，哪3 項是正確？","options":["在寬限期間仍未向保險人繳納者，保險人自寬限期滿之翌日起至完納前1 日止，每逾1 日加徵其應納費額百分之零點1 滯納金；加徵之滯納金額，以至應納費額15%為限","在寬限期間仍未向保險人繳納者，保險人自寬限期滿之翌日起至完納前1 日止，每逾1 日加徵其應納費額0.2%滯納金； 加徵之滯納金額，以至應納費額20%為限","加徵滯納金15 日後仍未繳納者，保險人就其應繳之保險費及滯納金，得依法移送行政執行。投保單位無財產可供執行或其財產不足清償時，由其代表人或負責人負連帶清償責任","投保單位代表人或負責人有變更者，原代表人或負責人未繳清保險費或滯納金時，新代表人或負責人應負連帶清償責任"]},{"id":"Q1248","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":848,"answer":[1,2,3],"multiple":true,"question":"依勞工職業災害保險及保護法規定，保險人為辦理本保險業務，或中央主管機關為審議保險爭議事項所需之必要資料時，得有相關作為之敘述，下列哪3 項是正確？","options":["得洽請被保險人、受益人、投保單位提供之","得洽請醫事服務機構、醫師或其他相關機關（構）、團體、法人或個人提供之","各該受洽請者不得規避、妨礙、拒絕或為虛偽之證明、報告及陳述","各該受洽請者得有條件的規避、妨礙、拒絕或為虛偽之證明、報告及陳述"]},{"id":"Q1249","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":849,"answer":[1,2,3],"multiple":true,"question":"依勞工職業災害保險及保護法規定，所定喪葬津貼、遺屬年金、遺屬一次金及遺屬津貼給付之基準，下列哪3 項是正確？","options":["所謂喪葬津貼， 是指按被保險人平均月投保薪資1 次發給5 個月。但被保險人無遺屬者，按其平均月投保薪資1 次發給10 個月","所謂遺屬年金，是指依第 49 條第2 項規定請領遺屬年金者，按被保險人之平均月投保薪資50% 發給","依第50 條第1 項規定請領遺屬年金者，依失能年金給付基準計算後金額之半數發給","所謂遺屬一次金及遺屬津貼，是指按被保險人平均月投保薪資發給45 個月"]},{"id":"Q1250","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":850,"answer":[1,3,4],"multiple":true,"question":"依勞工職業災害保險及保護法規定，被保險人之失能程度，經評估得請領失能年金之敘述，下列哪3 項是正確？","options":["部分失能者，按平均月投保薪資20%發給","部分失能者，按平均月投保薪資30%發給","完全失能者，按平均月投保薪資70%發給","嚴重失能者，按平均月投保薪資 50%發給"]},{"id":"Q1251","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":851,"answer":[1,3],"multiple":true,"question":"依勞工職業災害保險及保護法規定，本保險的基金來源，下列哪2 項是正確？","options":["設立時由勞工保險職業災害保險基金一次撥入之款項","設立時由勞工退休基金一次撥入之款項","設立時由職業災害勞工保護專款一次撥入之款項","設立時由就業保險基金專款一次撥入之款項"]},{"id":"Q1252","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":852,"answer":[1,4],"multiple":true,"question":"依勞工職業災害保險及保護法規定，下列有關年金給付敘述，哪2 項是正確？","options":["被保險人或其受益人，經保險人審核符合請領規定者，其年金給付自申請之當月起，按月發給，至應停止發給之當月止","被保險人或其受益人，經保險人審核符合請領規定者，其年金給付自申請之次月起，按月發給，至應停止發給之當月止設立時由勞工退休基金一次撥入之款項","領取年金給付者不符合給付條件或死亡時，本人或其繼承人應自事實發生之日起15 日內，檢附相關文件資料通知保險人，保險人應自事實發生之次月起停止發給年金給付","領取年金給付者不符合給付條件或死亡時，本人或其繼承人應自事實發生之日起30 日內，檢附相關文件資料通知保險人，保險人應自事實發生之次月起停止發給年金給付"]},{"id":"Q1253","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":853,"answer":[1,2,3],"multiple":true,"question":"依勞工職業災害保險及保護法規定，本保險的保險給付敘述，下列哪3 項是正確？","options":["以現金發給之保險給付，其金額按被保險人平均月投保薪資及給付基準計算","所謂平均月投保薪資，應按被保險人發生保險事故之當月起前6 個月之實際月投保薪資，平均計算；未滿6 個月者， 按其實際投保期間之平均月投保薪資計算","保險給付以日為給付單位者，按平均月投保薪資除以30 計算","未依規定辦理期間之月投保薪資，投保單位或被保險人未提具相關薪資資料供保險人審核時，按投保薪資分級表第3 等級計算"]},{"id":"Q1254","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":854,"answer":[2,3],"multiple":true,"question":"依勞工職業災害保險及保護法規定，職業災害勞工之重建涉及哪2 項者，主管機關應協調衛生福利主管機關提供整體及持續性服務?","options":["休閒生活","社會福利","醫療保健","教育發展"]},{"id":"Q1255","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":855,"answer":[1,2,3,4],"multiple":true,"question":"依勞工職業災害保險及保護法規定，勞工遭遇職業傷病，得向主管機關通報者為下列哪些對象？","options":["遭受職業傷病本人","雇主","醫療機構","知悉之其他人員"]},{"id":"Q1256","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":856,"answer":[3,4],"multiple":true,"question":"依勞工職業災害保險及保護法規定，主管機關裁處相關罰鍰，下列哪2 項不是量罰輕重審酌之標準","options":["與違反行為有關之勞工人數","違反情節","地區產業發展狀況","職業技術內容"]},{"id":"Q1257","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","number":857,"answer":[1,3,4],"multiple":true,"question":"依勞工職業災害保險及保護法規定，加入職業災害保險之勞工，遭遇職業傷病致失能或死亡，得向勞工保險局申請哪3 項補助？","options":["照護補助","租屋補助","失能補助","死亡補助"]},{"id":"Q1258","source":"就業服務學科：職業介紹、人力仲介及外國人引進、聘僱、管理事項.pdf","section":"19500 就業服務乙級工作項目01：職業介紹、人力仲介及外國人引進、聘僱、管理事項","
